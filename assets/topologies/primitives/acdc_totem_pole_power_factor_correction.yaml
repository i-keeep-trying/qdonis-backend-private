      - {id: W6, from: LPF_I.in, to: n_Iact_raw.P}
      - {id: W7, from: LPF_I.out, to: SUM_I.in2}
      - {id: W8, from: LPF_I.out, to: n_Iact_rect.P}
      - {id: W9, from: SUM_I.out, to: "^current_loop:n_Ierr.P"}
      - {id: W10, from: "^current_loop:n_Ierr.P", to: n_Ierr.P}
      - {id: W11, from: IREF.out, to: SUM_I.in1}
      - {id: W12, from: IREF.out, to: n_Iref.P}
      - {id: W13, from: IREF.in1, to: "^current_loop:n_PI_out.P"}
      - {id: W14, from: "^current_loop:n_PI_out.P", to: n_PI_out.P}
      - {id: W15, from: I_SENSE.in1, to: POL_SIGN.out}
      - {id: W16, from: I_SENSE.in1, to: n_pol_sign.P}
      - {id: W17, from: VAC_NORM.out, to: n_vac_norm.P}
      - {id: W18, from: IREF.in2, to: n_vac_norm.P}
    modulator:
      wires:
      - {id: W1, from: V_tri.B, to: "~GND@V_tri.B.P"}
      - {id: W2, from: FF_D.in1, to: "^modulator:n_AC_L.P"}
      - {id: W3, from: FF_D.in2, to: "^modulator:n_AC_N.P"}
      - {id: W4, from: KP_I.in, to: "^modulator:n_Ierr.P"}
      - {id: W5, from: KP_I.out, to: SUM_D.in2}
      - {id: W6, from: KP_I.out, to: n_dfb.P}
      - {id: W7, from: FF_D.out, to: SUM_D.in1}
      - {id: W8, from: SUM_D.in1, to: n_dff.P}
      - {id: W9, from: LIM_D.in, to: SUM_D.out}
      - {id: W10, from: LIM_D.in, to: n_duty.P}
      - {id: W11, from: CMP.inp, to: LIM_D.out}
      - {id: W12, from: CMP.inp, to: n_duty_c.P}
      - {id: W13, from: CMP.out, to: "^modulator:n_pwm.P"}
      - {id: W14, from: CMP.inn, to: V_tri.A}
      - {id: W15, from: CMP.inn, to: n_tri.P}
    voltage_loop:
      wires:
      - {id: W1, from: SUM_V.in2, to: "^voltage_loop:n_DC_POS.P"}
      - {id: W2, from: LIM_PI.out, to: "^voltage_loop:n_PI_out.P"}
      - {id: W3, from: LIM_PI.in, to: SUM_PI.out}
      - {id: W4, from: LIM_PI.in, to: n_PI_sum.P}
      - {id: W5, from: INT_V.in, to: KP_V.in}
      - {id: W6, from: KP_V.in, to: SUM_V.out}
      - {id: W7, from: KP_V.in, to: n_Verr.P}
      - {id: W8, from: INT_V.out, to: SUM_PI.in2}
      - {id: W9, from: SUM_PI.in2, to: n_Vint.P}
      - {id: W10, from: KP_V.out, to: SUM_PI.in1}
      - {id: W11, from: SUM_PI.in1, to: n_Vp.P}
      - {id: W12, from: REF_V.out, to: SUM_V.in1}
      - {id: W13, from: SUM_V.in1, to: n_Vref.P}
    gate_logic:
      wires:
      - {id: W1, from: POL.inp, to: "^gate_logic:n_AC_L.P"}
      - {id: W2, from: E_g_LF_TOP.B, to: "^gate_logic:n_AC_N.P"}
      - {id: W3, from: E_g_LF_TOP.B, to: POL.inn}
      - {id: W4, from: E_g_HF_TOP.B, to: "^gate_logic:n_SW_HF.P"}
      - {id: W5, from: DRV_HF_BOT.out, to: "^gate_logic:n_g_HF_BOT.P"}
      - {id: W6, from: E_g_HF_TOP.A, to: "^gate_logic:n_g_HF_TOP.P"}
      - {id: W7, from: DRV_LF_BOT.out, to: "^gate_logic:n_g_LF_BOT.P"}
      - {id: W8, from: E_g_LF_TOP.A, to: "^gate_logic:n_g_LF_TOP.P"}
      - {id: W9, from: DRV_LF_BOT.in, to: POL.out}
      - {id: W10, from: DRV_HF_BOT.in1, to: DRV_LF_BOT.in}
      - {id: W11, from: DRV_HF_BOT.in1, to: n_pol.P}
      - {id: W12, from: DRV_HF_BOT.in2, to: "^gate_logic:n_pwm.P"}
      - {id: W13, from: "^gate_logic:n_pwm.P", to: n_pwm.P}
