analysis:
  spice_settings:
    reltol: 0.01
    abstol: 1.0e-09
    vntol: 1.0e-05
    chgtol: 1.0e-11
    gmin: 1.0e-10
    method: gear
    maxord: 2
    trtol: 4
  transient:
    spice_settings:
      tstop: 0.06
      use_ic: false
      reltol: 0.01
      abstol: 1.0e-09
      vntol: 1.0e-05
      chgtol: 1.0e-11
      gmin: 1.0e-10
      method: gear
      maxord: 2
      trtol: 4
    requirements:
    - rid: tr_hbridge_inverter
      requirement: Filtered sinusoidal AC output voltage across load and inductor
        current
      criteria:
        target_vout_rms: 215
        fundamental_freq_hz: 50
        vdc_bus: 380
      environment:
      - ref: time_domain
        t_step: 1.0e-06
        t_stop: 0.06
        t_max_step: 1.0e-06
      measurement:
      - ref: VOUT
        plot:
          x_axis: time
          title: Filtered Output Voltage
        quantity: voltage
        nets:
        - - R_LOAD
          - pos
        - - R_LOAD
          - neg
        data:
        - name: Vout_rms
          spice_command: rms
          description: RMS Filtered AC Output Voltage
        - name: Vout_max
          spice_command: max
          description: Peak Positive Output Voltage
        - name: Vout_min
          spice_command: min
          description: Peak Negative Output Voltage
        - name: Vout_pp
          spice_command: pp
          description: Peak-to-Peak Filtered Output Voltage
      - ref: ILOAD
        plot:
          x_axis: time
          title: Filtered Load Current
        component: L_FILT
        quantity: current
        data:
        - name: Iload_rms
          spice_command: rms
          description: RMS Filtered Inductor/Load Current
        - name: Iload_max
          spice_command: max
          description: Peak Positive Load Current
        - name: Iload_min
          spice_command: min
          description: Peak Negative Load Current
        - name: Iload_pp
          spice_command: pp
          description: Peak-to-Peak Load Current
      - ref: V_PWM_RAW
        plot:
          x_axis: time
          title: Raw PWM Bridge Voltage (OUT1 - OUT2)
        quantity: voltage
        nets:
        - - L_FILT
          - pos
        - - C_FILT
          - neg
        data:
        - name: Vpwm_max
          spice_command: max
          description: Peak Raw Bridge Voltage
        - name: Vpwm_min
          spice_command: min
          description: Minimum Raw Bridge Voltage
        - name: Vpwm_pp
          spice_command: pp
          description: Peak-to-Peak Raw Bridge Voltage
      outputs:
      - var: vout_rms_v
        formula: '[Vout_rms]'
        description: RMS Filtered AC Output Voltage
      - var: vout_peak_v
        formula: '[Vout_max]'
        description: Peak Filtered Output Voltage
      - var: vout_pp_v
        formula: '[Vout_pp]'
        description: Peak-to-Peak Filtered Output Voltage
      - var: iload_rms_a
        formula: '[Iload_rms]'
        description: RMS Filtered Load Current
      - var: iload_peak_a
        formula: '[Iload_max]'
        description: Peak Load Current
      - var: vpwm_max_v
        formula: '[Vpwm_max]'
        description: Peak Raw PWM Bridge Voltage
      - var: vpwm_pp_v
        formula: '[Vpwm_pp]'
        description: Peak-to-Peak Raw Bridge Voltage
