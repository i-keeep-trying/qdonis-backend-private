analysis:
  transient:
    spice_settings:
      tstop: 0.06
      use_ic: true
      reltol: 0.01
      abstol: 1.0e-05
      vntol: 0.01
      cshunt: 2.0e-11
      chgtol: 1.0e-10
      itl4: 50
      method: gear
    requirements:
    - rid: tr_vienna_rectifier
      requirement: Verify Vienna Rectifier active current shaping and output voltage.
      criteria:
        target_vout: 800.0
      # A 0.2 us maximum step is needed for a correct energy balance: at 1 us (the default here) the ideal switches
      # gain or lose up to 15 % of the power numerically (efficiency read 87 %, or 115 % without the diode Cjo);
      # 0.2 us and 0.1 us agree to 0.01 V and give 97.4 %.
      environment:
      - ref: time_domain
        t_step: 4.0e-07
        t_stop: 0.06
        t_max_step: 2.0e-07
      measurement:
      - ref: VOUT_TOT
        plot:
          x_axis: time
          title: Total DC Link Voltage
        quantity: voltage
        component: R_LOAD
        nets:
        - - R_LOAD
          - pos
        - - R_LOAD
          - neg
        data:
        - name: Vout_avg
          spice_command: avg
          description: Average Output Voltage
      outputs:
      - var: vout_avg_v
        formula: abs([Vout_avg])
        description: Average Output Voltage
