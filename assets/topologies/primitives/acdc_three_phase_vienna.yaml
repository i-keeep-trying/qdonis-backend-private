id: acdc_three_phase_vienna
name: Three-Phase Vienna Rectifier
description: Three-phase Vienna rectifier, 120 Vrms / 50 Hz phase voltage to an 800 V split DC bus, 15 kW,
  unity power factor (PI voltage loop, per-phase current loop with bus-voltage duty feed-forward)
components:
- ref: GND
  type: node
  params:
    node_type: ground
- ref: V_AC_A
  type: node
  role: voltage_source
  params:
    node_type: voltage_source
    source: sine
    amplitude: 170.0
    frequency: 50
    phase: 0
- ref: V_AC_B
  type: node
  role: voltage_source
  params:
    node_type: voltage_source
    source: sine
    amplitude: 170.0
    frequency: 50
    phase: -120
- ref: V_AC_C
  type: node
  role: voltage_source
  params:
    node_type: voltage_source
    source: sine
    amplitude: 170.0
    frequency: 50
    phase: -240
- ref: R_neutral
  type: resistor
  params:
    resistance: 10000000.0
- ref: R_grid_A
  type: resistor
  params:
    resistance: 0.05
- ref: R_grid_B
  type: resistor
  params:
    resistance: 0.05
- ref: R_grid_C
  type: resistor
  params:
    resistance: 0.05
- ref: V_SENSE_A
  type: node
  params:
    node_type: voltage_source
    source: dc
    voltage: 0
- ref: V_SENSE_B
  type: node
  params:
    node_type: voltage_source
    source: dc
    voltage: 0
- ref: V_SENSE_C
  type: node
  params:
    node_type: voltage_source
    source: dc
    voltage: 0
- ref: L_A
  type: inductor
  params:
    inductance: 0.00047
- ref: L_B
  type: inductor
  params:
    inductance: 0.00047
- ref: L_C
  type: inductor
  params:
    inductance: 0.00047
- ref: C_DC_TOP
  type: capacitor
  params:
    capacitance: 0.0022
    ic: 400
- ref: C_DC_BOT
  type: capacitor
  params:
    capacitance: 0.0022
    ic: 400  # pos = midpoint, neg = -DC rail: +400 puts the rail at -400 V (was -400: bus started at 0 V)
- ref: R_LOAD
  type: resistor
  params:
    resistance: 42.66
- ref: D_A_TOP
  type: diode
  params:
    model: D_SiC
- ref: D_A_BOT
  type: diode
  params:
    model: D_SiC
- ref: D_B_TOP
  type: diode
  params:
    model: D_SiC
- ref: D_B_BOT
  type: diode
  params:
    model: D_SiC
- ref: D_C_TOP
  type: diode
  params:
    model: D_SiC
- ref: D_C_BOT
  type: diode
  params:
    model: D_SiC
- ref: S_A
  type: switch
  params:
    model: sw_mod
- ref: S_B
  type: switch
  params:
    model: sw_mod
- ref: S_C
  type: switch
  params:
    model: sw_mod

- ref: n_vref
  type: node
  params:
    node_type: "label"

- ref: n_pi_sum
  type: node
  params:
    node_type: "label"

- ref: n_tri
  type: node
  params:
    node_type: "label"

- ref: v_a_abs
  type: node
  params:
    node_type: "label"

- ref: n_ff_A
  type: node
  params:
    node_type: "label"

- ref: n_ierr_A
  type: node
  params:
    node_type: "label"

- ref: n_dfb_A
  type: node
  params:
    node_type: "label"

- ref: v_b_abs
  type: node
  params:
    node_type: "label"

- ref: n_ff_B
  type: node
  params:
    node_type: "label"

- ref: n_ierr_B
  type: node
  params:
    node_type: "label"

- ref: n_dfb_B
  type: node
  params:
    node_type: "label"

