analysis:
  transient:
    requirements:
    - rid: tr_afe_rectifier
      requirement: Verify 3-phase Active Front End boost rectification to 700V DC.
      environment:
      - ref: time_domain
        t_step: 1.0e-05
        t_stop: 0.05
        t_start: 0.04
        t_max_step: 1.0e-05
      measurement:
      - ref: V_DC_OUT
        plot: true
        quantity: voltage
        nets:
        - - R_DC
          - pos
        - - R_DC
          - neg
        data:
        - name: Vout_avg
          spice_command: avg
          description: Average Output Voltage
      outputs:
      - var: vout_avg_v
        formula: abs([Vout_avg])
        description: Average Output Voltage
      criteria:
        target_vout: 700.0
        tolerance_pct: 5.0
    spice_settings:
      use_ic: false
      method: trap
      trtol: 7
      ic: v(V_DC)=700 v(V_I)=21.5
