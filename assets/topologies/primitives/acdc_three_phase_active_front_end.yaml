- ref: V_IERR_K_C
  type: node
  params:
    node_type: "label"

# Control (blocks): voltage PI 0.08 * err + 500 * integral (conditional anti-windup 0..30.1) -> clamp ->
# 1 ms filter = current amplitude; per phase: reference = amplitude * v_phase / 310.27, error * 20 clamped +-12,
# 10 us filter, bipolar PWM against a +-10 V 100 kHz triangle (0.2 V dead band, 15 V gate levels).
# E1..E3 stay E sources: the high-side gate buffers float on the phase nodes.
- ref: REF_V
  type: const
  role: voltage_reference
  params:
    value: 700

- ref: SUM_V
  type: sum
  role: voltage_error
  params:
    signs: "+-"

- ref: KP_V
  type: gain
  role: voltage_p
  params:
    gain: 0.08

- ref: INT_V
  type: integrator
  role: voltage_i
  params:
    ki: 500
    lower: 0
    upper: 30.1
    antiwindup: "conditional"
    ic: 21.5

- ref: SUM_PI
  type: sum
  role: voltage_pi_sum
  params:
    signs: "++"

- ref: LIM_PI
  type: limiter
  role: current_amplitude_clamp
  params:
    lower: 0
    upper: 30.1

- ref: LPF_MAG
  type: lowpass
  role: current_amplitude_filter
  params:
    tau: 0.000999001
    gain: 0.999001

- ref: CAR
  type: carrier
  role: pwm_carrier
  params:
    frequency: 100000.0
    low: -10
    high: 10
    shape: "triangle"

- ref: SUM_VA
  type: sum
  role: phase_a_voltage_sense
  params:
    signs: "+-"

- ref: REF_A
  type: product
  role: phase_a_current_reference
  params:
    gain: "1/310.27"

- ref: I_SENSE_A
  type: function
  role: phase_a_current_sense
  params:
    expression: "i(VLA_SENSE)"
    inputs: 0

- ref: SUM_IA
  type: sum
  role: phase_a_current_error
  params:
    signs: "+-"

- ref: K_IA
  type: gain
  role: phase_a_current_error_amp
  params:
    gain: 20

- ref: LIM_IA
  type: limiter
  role: phase_a_current_error_clamp
  params:
    lower: -12
    upper: 12

- ref: LPF_CA
  type: lowpass
  role: phase_a_current_compensator
  params:
    tau: 9.99001e-06
    gain: 0.999001

- ref: CMP_A_TOP
  type: comparator
  role: phase_a_top_pwm
  params:
    high: 15
    low: 0
    threshold: 0.2
    width: 0.2

- ref: CMP_A_BOT
  type: comparator
  role: phase_a_bottom_pwm
  params:
    high: 15
    low: 0
    threshold: 0.2
    width: 0.2

- ref: SUM_VB
  type: sum
  role: phase_b_voltage_sense
  params:
    signs: "+-"

- ref: REF_B
  type: product
  role: phase_b_current_reference
  params:
    gain: "1/310.27"

- ref: I_SENSE_B
  type: function
  role: phase_b_current_sense
  params:
    expression: "i(VLB_SENSE)"
    inputs: 0

- ref: SUM_IB
  type: sum
  role: phase_b_current_error
  params:
    signs: "+-"

- ref: K_IB
  type: gain
  role: phase_b_current_error_amp
  params:
    gain: 20

- ref: LIM_IB
  type: limiter
  role: phase_b_current_error_clamp
  params:
    lower: -12
    upper: 12

- ref: LPF_CB
  type: lowpass
  role: phase_b_current_compensator
  params:
    tau: 9.99001e-06
    gain: 0.999001

- ref: CMP_B_TOP
  type: comparator
  role: phase_b_top_pwm
  params:
    high: 15
    low: 0
    threshold: 0.2
    width: 0.2

- ref: CMP_B_BOT
  type: comparator
  role: phase_b_bottom_pwm
  params:
    high: 15
    low: 0
    threshold: 0.2
    width: 0.2

- ref: SUM_VC
  type: sum
  role: phase_c_voltage_sense
  params:
    signs: "+-"

- ref: REF_C
  type: product
  role: phase_c_current_reference
  params:
    gain: "1/310.27"

- ref: I_SENSE_C
  type: function
  role: phase_c_current_sense
  params:
    expression: "i(VLC_SENSE)"
    inputs: 0

- ref: SUM_IC
  type: sum
  role: phase_c_current_error
  params:
    signs: "+-"

- ref: K_IC
  type: gain
  role: phase_c_current_error_amp
  params:
    gain: 20

- ref: LIM_IC
  type: limiter
  role: phase_c_current_error_clamp
  params:
    lower: -12
    upper: 12

- ref: LPF_CC
  type: lowpass
  role: phase_c_current_compensator
  params:
    tau: 9.99001e-06
    gain: 0.999001

- ref: CMP_C_TOP
  type: comparator
  role: phase_c_top_pwm
  params:
    high: 15
    low: 0
    threshold: 0.2
    width: 0.2

- ref: CMP_C_BOT
  type: comparator
  role: phase_c_bottom_pwm
  params:
    high: 15
    low: 0
    threshold: 0.2
    width: 0.2

- ref: R8
  type: resistor
  params:
    resistance: 10
- ref: M_C_TOP
  type: transistor
  params:
    family: mosfet
    type: nmos
    mode: enhancement
    model: sic_mosfet
    part_number: C3M0015065D
    rds_on: 0.015
    tr: 1.0e-08
- ref: D3
  type: diode
  params:
    model: dmodel1
    Bv: 1200
    Rs: 0.001
    Tt: 1.0e-08
    Cjo: 5.0e-11
- ref: R11
  type: resistor
  params:
    resistance: 10
- ref: M_C_BOT
  type: transistor
  params:
    family: mosfet
    type: nmos
