- ref: VIN
  type: node
  role: input_source
  params:
    node_type: voltage_source
    source: dc
    voltage: 380
    series_resistance: 0.01
- ref: VTRI
  type: node
  role: carrier_source
  params:
    node_type: voltage_source
    source: pulse
    v1: -10
    v2: 10
    td: 0
    tr: 0.03124m
    tf: 0.03124m
    pw: 0.00002m
    per: 0.0625m
    series_resistance: 0
- ref: VREF
  type: node
  role: reference_source
  params:
    node_type: voltage_source
    source: sine
    offset: 0
    amplitude: 8
    frequency: 50
    series_resistance: 0
- ref: B2
  type: b_source
  params:
    expression: -V(ControlA)
- ref: B1
  type: b_source
  params:
    expression: 0.5 * (1 + tanh((V(ControlA) - V(TRI)) * 1000))
- ref: E1
