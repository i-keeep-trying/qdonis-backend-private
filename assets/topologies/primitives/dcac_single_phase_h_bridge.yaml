- ref: L_FILT
  type: inductor
  role: output_filter_inductor
  params:
    inductance: 5m
    sense: false
- ref: C_FILT
  type: capacitor
  role: output_filter_capacitor
  params:
    capacitance: 10u
    sense: false
- ref: R_LOAD
