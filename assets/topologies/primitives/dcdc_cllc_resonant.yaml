      schY: 0.0
      rotation: 270deg
  - ref: SW6
    type: transistor
    role: sec_ls_left
    params:
      family: mosfet
      type: nmos
      mode: enhancement
      voltage_rating: 600
      current_rating: 10
      Vto: 1.5
      Kn: 25e-3
      Lambda: 0.005
      Cgs: 1000e-12
      Cgd: 200e-12
      Cdb: 200e-12
    layout:
      schX: 9.0
      schY: -3.0
      rotation: 270deg
  - ref: SW7
    type: transistor
    role: sec_hs_right
    params:
      family: mosfet
      type: nmos
      mode: enhancement
      voltage_rating: 600
      current_rating: 10
      Vto: 1.5
      Kn: 25e-3
      Lambda: 0.005
      Cgs: 1000e-12
      Cgd: 200e-12
      Cdb: 200e-12
    layout:
      schX: 12.0
      schY: 0.0
      rotation: 270deg
  - ref: SW8
    type: transistor
    role: sec_ls_right
    params:
      family: mosfet
      type: nmos
      mode: enhancement
      voltage_rating: 600
      current_rating: 10
      Vto: 1.5
      Kn: 25e-3
      Lambda: 0.005
      Cgs: 1000e-12
      Cgd: 200e-12
      Cdb: 200e-12
    layout:
      schX: 12.0
      schY: -3.0
      rotation: 270deg
  - ref: Cout
    type: capacitor
    role: output_filter
    params:
      capacitance: 10e-6
      polarized: true
      voltage_rating: 600
      tolerance: 0.1
      esr: 0.01
      esl: 5e-9
      leakage_current: 10e-6
      ic: 0
    layout:
      schX: 13.5
      schY: -1.5
      orientation: vertical
  - ref: R_LOAD
    type: resistor
    role: load
    params:
      resistance: 40
      tolerance: 0.05
      temp_coefficient: 100e-6
      parasitic_inductance: 10e-9
