id: dcdc_half_bridge
name: Half Bridge DC-DC Converter
description: 'Isolated half-bridge converter with high-frequency transformer isolation.
  Primary: Split capacitors (C1, C2) with two NMOS switches (SW1 high-side with floating
  drive, SW2 low-side). Secondary: Center-tapped rectification with two diodes (DR1,
  DR2) and LC output filter. External antiparallel diodes (D1, D2) for visualization
  and protection.'
components:
  - ref: VIN
    type: node
    role: input_source
    params:
      node_type: voltage_source
      voltage: 48
      source: dc
      series_resistance: 0.1
      ramp_rise: 1e-4
  - ref: SW1
    type: transistor
    role: upper_switch
    params:
      family: mosfet
      type: nmos
      mode: enhancement
      voltage_rating: 100
      current_rating: 10
      Vto: 2.0
      Kn: 50e-3
      Lambda: 0.01
      Cgs: 500e-12
      Cgd: 100e-12
      Cdb: 100e-12
    layout:
      schX: 1.0
      schY: 1.0
      rotation: 270deg
  - ref: SW2
    type: transistor
    role: lower_switch
    params:
      family: mosfet
      type: nmos
      mode: enhancement
      voltage_rating: 100
      current_rating: 10
      Vto: 2.0
      Kn: 50e-3
      Lambda: 0.01
      Cgs: 500e-12
      Cgd: 100e-12
      Cdb: 100e-12
    layout:
      schX: 1.0
      schY: -1.0
      rotation: 270deg
  - ref: D1
    type: diode
    role: antiparallel_diode_sw1
    params:
      reverse_voltage: 100
      current_rating: 10
      Is: 1e-12
      n: 1.1
      Rs: 0.05
      Cjo: 10e-12
      Tt: 20e-9
      Bv: 100
      Ibv: 1e-6
    layout:
      schX: 2.0
      schY: 1.0
      orientation: pos_bottom
  - ref: D2
    type: diode
    role: antiparallel_diode_sw2
    params:
      reverse_voltage: 100
      current_rating: 10
      Is: 1e-12
      n: 1.1
      Rs: 0.05
      Cjo: 10e-12
      Tt: 20e-9
      Bv: 100
      Ibv: 1e-6
    layout:
      schX: 2.0
      schY: -1.0
      orientation: pos_bottom
  - ref: C1
    type: capacitor
    role: upper_cap
    params:
      capacitance: 470e-6
      polarized: true
      voltage_rating: 100
      tolerance: 0.1
      esr: 0.05
      esl: 5e-9
      leakage_current: 1e-9
      ic: 0
    layout:
      schX: 0.0
      schY: 1.0
      orientation: vertical
  - ref: C2
    type: capacitor
    role: lower_cap
    params:
      capacitance: 470e-6
      polarized: true
      voltage_rating: 100
      tolerance: 0.1
      esr: 0.05
      esl: 5e-9
      leakage_current: 1e-9
      ic: 24
    layout:
      schX: 0.0
      schY: -1.0
      orientation: vertical
  - ref: T1
    type: ct_transformer
    role: isolation_transformer
    layout:
      schX: 3.0
      schY: 0.0
      configuration: left-to-right
    params:
      Lm_primary: 500e-6
      turns_ratio: 0.8
      k_coupling: 0.98
      phase_s1: same
      phase_s2: opposite
      Rp: 0.1
      Rs1: 0.1
      Rs2: 0.1
      core_loss_resistance: 1e6
      center_tap_resistance: 100e6
      center_tap_capacitance: 0
    internal:
      - ref: R_SNUB
        type: resistor
        role: primary_snubber
        params:
          resistance: 220
        connections:
          pos:
            - T1
            - P1
          neg:
            - C_SNUB
            - pos
      - ref: C_SNUB
        type: capacitor
        role: primary_snubber
        params:
          capacitance: 2.2e-09
        connections:
          pos:
            - R_SNUB
            - neg
          neg:
            - T1
            - P2
      - ref: R_ISO
        type: resistor
        role: isolation_ground_anchor
        params:
          resistance: 100e6
        connections:
          pos:
            - T1
            - CT
          neg:
            - VIN
            - '-'
  - ref: DR1
    type: diode
    role: rectifier_1
    params:
      reverse_voltage: 100
      current_rating: 5
      Is: 1e-12
      n: 1.1
      Rs: 0.3
      Cjo: 10e-12
      Tt: 20e-9
      Bv: 50
      Ibv: 1e-6
    layout:
      schX: 4.0
      schY: 1.0
      orientation: horizontal
  - ref: DR2
    type: diode
    role: rectifier_2
    layout:
      schX: 4.0
      schY: -1.0
      orientation: horizontal
    params:
      reverse_voltage: 100
      current_rating: 5
      Is: 1e-12
      n: 1.1
      Rs: 0.3
      Cjo: 10e-12
      Tt: 20e-9
      Bv: 50
      Ibv: 1e-6
  - ref: L_OUT
    type: inductor
    role: output_filter_inductor
    params:
      inductance: 22e-6
      series_resistance: 0.2
      parasitic_capacitance: 1e-12
    layout:
      schX: 5.5
      schY: 1.0
      orientation: horizontal
  - ref: C_OUT
    type: capacitor
    role: output_filter
    params:
      capacitance: 470e-6
      polarized: true
      voltage_rating: 25
      tolerance: 0.1
      esr: 0.5
      esl: 5e-9
      leakage_current: 1e-6
      ic: 0
    layout:
      schX: 6.5
      schY: 0.0
      orientation: vertical
  - ref: R_LOAD
    type: resistor
    role: load
    params:
      resistance: 10
      tolerance: 0.05
      temp_coefficient: 100e-6
      parasitic_inductance: 10e-9
    layout:
      schX: 8.0
      schY: 0.0
      orientation: vertical
  - ref: PWM1
    type: node
    role: pwm_control_high_side
    params:
      node_type: pwm_control
      frequency: 100e3
      duty_cycle: 0.5
      vhigh: 12.0
      vlow: 0.0
      trise: 5e-7
      tfall: 5e-7
      tdelay: 0
      drive_resistance: 10
  - ref: PWM2
    type: node
    role: pwm_control_low_side
    params:
      node_type: pwm_control
      frequency: 100e3
      duty_cycle: 0.5
      vhigh: 12.0
      vlow: 0.0
      trise: 5e-7
      tfall: 5e-7
      tdelay: 5.2e-06
      drive_resistance: 10
nets:
  - - - VIN
      - +
    - - C1
      - pos
    - - SW1
      - drain
    - - D1
      - cathode
  - - - VIN
      - '-'
    - - C2
      - neg
    - - SW2
      - source
    - - D2
      - anode
    - - PWM2
      - neg
  - - - SW1
      - source
    - - SW2
      - drain
    - - T1
      - P1
    - - D1
      - anode
    - - D2
      - cathode
    - - PWM1
      - neg
  - - - C1
      - neg
    - - C2
      - pos
    - - T1
      - P2
  - - - PWM1
      - pos
    - - SW1
      - gate
  - - - PWM2
      - pos
    - - SW2
      - gate
  - - - T1
      - S1
    - - DR1
      - anode
  - - - T1
      - S2
    - - DR2
      - anode
  - - - DR1
      - cathode
    - - DR2
      - cathode
    - - L_OUT
      - pos
  - - - T1
      - CT
    - - C_OUT
      - neg
    - - R_LOAD
      - neg
  - - - L_OUT
      - neg
    - - C_OUT
      - pos
    - - R_LOAD
      - pos
analysis:
  transient:
    spice_settings:
      reltol: 0.005
      abstol: 1.0e-09
      vntol: 1.0e-05
      chgtol: 1.0e-12
      gmin: 1.0e-10
      method: gear
      maxord: 2
      trtol: 10.0
      use_ic: true
    requirements:
      - rid: tr_startup
        requirement: Startup transient from 0V to steady-state output voltage. Converter
          is NON-INVERTING half-bridge with center-tapped secondary rectification.
          Measure VOUT at [R_LOAD, pos] or [C_OUT, pos] (positive output terminal).
          Verify output reaches target voltage with acceptable overshoot and settling
          time.
        criteria:
          target_vout_min: 11.5
          target_vout_max: 12.5
          overshoot_pct_max: 10
          settle_time_ms_max: 5
        environment:
          - ref: time_domain
            t_start: 0.0135
            t_stop: 0.015
            t_step: 1.0e-07
            description: 15ms simulation time for startup settling (1000+ switching
              periods at typical 100kHz)
        measurement:
          - ref: VIN
            plot:
              x_axis: time
              title: Input Voltage
            quantity: voltage
            nets:
              - - VIN
                - +
              - - VIN
                - '-'
          - ref: VOUT
            plot:
              x_axis: time
              title: Output Voltage Startup Transient
            quantity: voltage
            nets:
              - - R_LOAD
                - pos
              - - R_LOAD
                - neg
            data:
              - name: vout_steady
                spice_command: avg
                description: Steady-state output voltage (average over simulation)
              - name: vout_peak
                spice_command: max
                description: Peak output voltage during startup
              - name: t_settle
                spice_command: TRIG AT={{environment.time_domain.t_step}} TARG [VOUT]
                  VAL={{criteria.target_vout_min}*1.0}
                  CROSS=LAST
                description: Time when output settles to within 5% of target (last
                  crossing)
            description: Output voltage measurement for startup transient analysis
          - ref: IL_OUT
            plot:
              x_axis: time
              title: Output Inductor Current
            quantity: current
            nets:
              - - L_OUT
                - pos
              - - L_OUT
                - neg
          - ref: VDS_SW1
            plot:
              x_axis: time
              title: SW1 Drain-Source Voltage
            quantity: voltage
            nets:
              - - SW1
                - drain
              - - SW1
                - source
          - ref: VDS_SW2
            plot:
              x_axis: time
              title: SW2 Drain-Source Voltage
            quantity: voltage
            nets:
              - - SW2
                - drain
              - - SW2
                - source
          - ref: ID_SW1
            plot:
              x_axis: time
              title: SW1 Drain Current
            quantity: current
            nets:
              - - SW1
                - drain
              - - SW1
                - source
        outputs:
          - var: vout_steady_v
            formula: '[vout_steady]'
            description: Steady-state output voltage in volts
          - var: overshoot_pct
            formula: 100*abs([vout_peak]-[vout_steady])/[vout_steady]
            description: Output voltage overshoot percentage
          - var: settle_time_ms
            formula: '[t_settle]*1000'
            description: Settling time in milliseconds
      - rid: tr_line_regulation
        requirement: 'Line regulation test: Input voltage step from nominal to high
          line. Measure output voltage deviation and recovery time. Converter maintains
          regulation across input voltage range.'
        criteria:
          vout_deviation_pct_max: 5
          recovery_time_ms_max: 2
          target_vout: 12
        environment:
          - ref: time_domain
            t_start: 0.01275
            t_stop: 0.015
            t_step: 1.0e-07
            description: '15ms simulation: 5ms startup + 5ms nominal + 5ms after input
              step'
          - ref: transient_sources
            type: voltage
            net:
              - VIN
              - +
            description: Input voltage step from 24V to 30V at t=5ms to test line
              regulation
        measurement:
          - ref: VIN
            plot: false
            quantity: voltage
            nets:
              - - VIN
                - +
              - - VIN
                - '-'
          - ref: VOUT_LINE
            plot:
              x_axis: time
              title: Output Voltage - Line Regulation
            quantity: voltage
            nets:
              - - R_LOAD
                - pos
              - - R_LOAD
                - neg
            data:
              - name: vout_before
                spice_command: find [VOUT_LINE] at={{environment.time_domain.t_start}+0.001}
                description: Output voltage before input step (1ms after start)
              - name: vout_after_min
                spice_command: min
                description: Minimum output voltage after input step
              - name: vout_after_steady
                spice_command: avg
                description: Steady-state output voltage after input step
              - name: t_recovery
                spice_command: TRIG AT={{environment.time_domain.t_step}} TARG [VOUT_LINE]
                  VAL={{criteria.target_vout}*(1-0.05)} CROSS=LAST
                description: Recovery time to within 5% of target (last crossing)
            description: Output voltage for line regulation test
        outputs:
          - var: vout_deviation_pct
            formula: 100*abs([vout_after_min]-{criteria.target_vout})/{criteria.target_vout}
            description: Maximum output voltage deviation percentage during line step
          - var: recovery_time_ms
            formula: ([t_recovery]-{environment.time_domain.t_start})*1000
            description: Recovery time in milliseconds
      - rid: tr_load_transient
        requirement: 'Load transient response: Step load change from light to heavy
          load. Measure output voltage undershoot/overshoot and recovery time. Verify
          output filter (L_OUT, C_OUT) provides adequate transient response.'
        criteria:
          vout_undershoot_pct_max: 8
          vout_overshoot_pct_max: 8
          recovery_time_ms_max: 3
          target_vout: 12
        environment:
          - ref: time_domain
            t_start: 0.01275
            t_stop: 0.015
            t_step: 1.0e-07
            description: '15ms simulation: 5ms startup + load step at 5ms + 10ms recovery
              observation'
        measurement:
          - ref: VIN
            plot: false
            quantity: voltage
            nets:
              - - VIN
                - +
              - - VIN
                - '-'
          - ref: VOUT_LOAD
            plot:
              x_axis: time
              title: Output Voltage - Load Transient
            quantity: voltage
            nets:
              - - R_LOAD
                - pos
              - - R_LOAD
                - neg
            data:
              - name: vout_before_load
                spice_command: find [VOUT_LOAD] at={{environment.time_domain.t_start}+0.001}
                description: Output voltage before load step (1ms after start)
              - name: vout_min_load
                spice_command: min
                description: Minimum output voltage during load transient (undershoot)
              - name: vout_max_load
                spice_command: max
                description: Maximum output voltage during load transient (overshoot)
              - name: vout_after_load
                spice_command: avg
                description: Steady-state output voltage after load step
              - name: t_recovery_load
                spice_command: TRIG AT={{environment.time_domain.t_step}} TARG [VOUT_LOAD]
                  VAL={{criteria.target_vout}*(1-0.05)} CROSS=LAST
                description: Recovery time to within 5% of target (last crossing)
            description: Output voltage for load transient test
        outputs:
          - var: vout_undershoot_pct
            formula: 100*abs({criteria.target_vout}-[vout_min_load])/{criteria.target_vout}
            description: Output voltage undershoot percentage
          - var: vout_overshoot_pct
            formula: 100*abs([vout_max_load]-{criteria.target_vout})/{criteria.target_vout}
            description: Output voltage overshoot percentage
          - var: recovery_time_load_ms
            formula: ([t_recovery_load]-{environment.time_domain.t_start})*1000
            description: Load transient recovery time in milliseconds
      - rid: tr_efficiency
        requirement: Efficiency measurement at nominal operating point. Calculate
          Pin (input power from VIN) and Pout (output power to R_LOAD). Measure transformer
          losses, switching losses (SW1, SW2), and rectifier losses (DR1, DR2). Target
          efficiency >85% for isolated half-bridge topology.
        criteria:
          efficiency_min_pct: 85
          target_vout: 12
          target_iout_min: 0.5
        environment:
          - ref: time_domain
            t_start: 0.0135
            t_stop: 0.015
            t_step: 1.0e-07
            description: 15ms simulation for steady-state efficiency measurement
        measurement:
          - ref: VIN_EFF
            plot: false
            quantity: voltage
            nets:
              - - VIN
                - +
              - - VIN
                - '-'
            data:
              - name: vin_avg
                spice_command: avg
                description: Average input voltage
            description: Input voltage for efficiency calculation
          - ref: IIN_EFF
            plot: false
            component: VIN
            quantity: current
            data:
              - name: iin_avg
                spice_command: avg
                description: Average input current
            description: Input current for efficiency calculation
          - ref: VOUT_EFF
            plot: false
            quantity: voltage
            nets:
              - - R_LOAD
                - pos
              - - R_LOAD
                - neg
            data:
              - name: vout_avg_eff
                spice_command: avg
                description: Average output voltage
            description: Output voltage for efficiency calculation
          - ref: IOUT_EFF
            plot: false
            component: R_LOAD
            quantity: current
            data:
              - name: iout_avg
                spice_command: avg
                description: Average output current
            description: Output current for efficiency calculation
        outputs:
          - var: pin_w
            formula: abs([vin_avg]*[iin_avg])
            description: Input power in watts
          - var: pout_w
            formula: abs([vout_avg_eff]*[iout_avg])
            description: Output power in watts
          - var: efficiency_pct
            formula: 100*abs([vout_avg_eff]*[iout_avg])/abs([vin_avg]*[iin_avg])
            description: Converter efficiency percentage
      - rid: tr_switch_stress
        requirement: Primary-side switch voltage and current stress. Measure peak
          drain-source voltage (Vds_peak) on SW1 and SW2 to verify MOSFETs are not
          overstressed. Measure peak switch current (Id_peak) for thermal and SOA
          analysis. Verify antiparallel diodes (D1, D2) conduct during dead-time.
        criteria:
          vds_sw1_max: 50
          vds_sw2_max: 50
          id_sw1_peak_max: 5
          id_sw2_peak_max: 5
        environment:
          - ref: time_domain
            t_start: 0.0135
            t_stop: 0.015
            t_step: 1.0e-07
            description: 15ms simulation to capture steady-state switching stress
        measurement:
          - ref: VIN
            plot: false
            quantity: voltage
            nets:
              - - VIN
                - +
              - - VIN
                - '-'
          - ref: VDS_SW1
            plot: false
            quantity: voltage
            nets:
              - - SW1
                - drain
              - - SW1
                - source
            data:
              - name: vds_sw1_peak
                spice_command: max
                description: Peak drain-source voltage on SW1
            description: SW1 drain-source voltage stress
          - ref: VDS_SW2
            plot: false
            quantity: voltage
            nets:
              - - SW2
                - drain
              - - SW2
                - source
            data:
              - name: vds_sw2_peak
                spice_command: max
                description: Peak drain-source voltage on SW2
            description: SW2 drain-source voltage stress
          - ref: ID_SW1
            plot: false
            component: SW1
            quantity: current
            data:
              - name: id_sw1_peak
                spice_command: max
                description: Peak drain current on SW1
            description: SW1 drain current stress
          - ref: ID_SW2
            plot:
              x_axis: time
              title: SW2 Drain Current
            component: SW2
            quantity: current
            data:
              - name: id_sw2_peak
                spice_command: max
                description: Peak drain current on SW2
            description: SW2 drain current stress
          - ref: VOUT
            plot: false
            quantity: voltage
            nets:
              - - R_LOAD
                - pos
              - - R_LOAD
                - neg
        outputs:
          - var: vds_sw1_max_v
            formula: '[vds_sw1_peak]'
            description: Maximum drain-source voltage on SW1 in volts
          - var: vds_sw2_max_v
            formula: '[vds_sw2_peak]'
            description: Maximum drain-source voltage on SW2 in volts
          - var: id_sw1_peak_a
            formula: abs([id_sw1_peak])
            description: Peak drain current on SW1 in amperes
          - var: id_sw2_peak_a
            formula: abs([id_sw2_peak])
            description: Peak drain current on SW2 in amperes
      - rid: tr_rectifier_stress
        requirement: Secondary-side rectifier diode stress. Measure peak reverse voltage
          (Vr_peak) across DR1 and DR2 to verify diode voltage rating. Measure peak
          forward current (If_peak) for thermal design. Center-tapped rectification
          causes each diode to block full secondary voltage during off-state.
        criteria:
          vr_dr1_max: 30
          vr_dr2_max: 30
          if_dr1_peak_max: 3
          if_dr2_peak_max: 3
        environment:
          - ref: time_domain
            t_start: 0.0135
            t_stop: 0.015
            t_step: 1.0e-07
            description: 15ms simulation to capture rectifier stress in steady-state
        measurement:
          - ref: VIN
            plot: false
            quantity: voltage
            nets:
              - - VIN
                - +
              - - VIN
                - '-'
          - ref: VR_DR1
            plot:
              x_axis: time
              title: DR1 Reverse Voltage
            quantity: voltage
            nets:
              - - DR1
                - cathode
              - - DR1
                - anode
            data:
              - name: vr_dr1_peak
                spice_command: max
                description: Peak reverse voltage across DR1
            description: DR1 reverse voltage stress
          - ref: VR_DR2
            plot:
              x_axis: time
              title: DR2 Reverse Voltage
            quantity: voltage
            nets:
              - - DR2
                - cathode
              - - DR2
                - anode
            data:
              - name: vr_dr2_peak
                spice_command: max
                description: Peak reverse voltage across DR2
            description: DR2 reverse voltage stress
          - ref: IF_DR1
            plot:
              x_axis: time
              title: DR1 Forward Current
            component: DR1
            quantity: current
            data:
              - name: if_dr1_peak
                spice_command: max
                description: Peak forward current through DR1
            description: DR1 forward current stress
          - ref: IF_DR2
            plot:
              x_axis: time
              title: DR2 Forward Current
            component: DR2
            quantity: current
            data:
              - name: if_dr2_peak
                spice_command: max
                description: Peak forward current through DR2
            description: DR2 forward current stress
          - ref: VOUT
            plot: false
            quantity: voltage
            nets:
              - - R_LOAD
                - pos
              - - R_LOAD
                - neg
        outputs:
          - var: vr_dr1_max_v
            formula: '[vr_dr1_peak]'
            description: Maximum reverse voltage across DR1 in volts
          - var: vr_dr2_max_v
            formula: '[vr_dr2_peak]'
            description: Maximum reverse voltage across DR2 in volts
          - var: if_dr1_peak_a
            formula: abs([if_dr1_peak])
            description: Peak forward current through DR1 in amperes
          - var: if_dr2_peak_a
            formula: abs([if_dr2_peak])
            description: Peak forward current through DR2 in amperes
      - rid: tr_output_ripple
        requirement: Output voltage ripple measurement. Measure peak-to-peak ripple
          voltage at output (C_OUT) in steady-state. Verify LC output filter (L_OUT,
          C_OUT) provides adequate ripple attenuation. Typical target <2% ripple for
          isolated converters.
        criteria:
          vout_ripple_pp_max_mv: 240
          target_vout: 12
        environment:
          - ref: time_domain
            t_start: 0.0135
            t_stop: 0.015
            t_step: 1.0e-07
            description: 15ms simulation with fine timestep to capture high-frequency
              ripple
        measurement:
          - ref: VIN
            plot: false
            quantity: voltage
            nets:
              - - VIN
                - +
              - - VIN
                - '-'
          - ref: VOUT_RIPPLE
            plot:
              x_axis: time
              title: Output Voltage Ripple
            quantity: voltage
            nets:
              - - C_OUT
                - pos
              - - C_OUT
                - neg
            data:
              - name: vout_ripple_pp
                spice_command: pp
                description: Peak-to-peak output voltage ripple
              - name: vout_avg_ripple
                spice_command: avg
                description: Average output voltage for ripple calculation
            description: Output voltage ripple measurement
        outputs:
          - var: vout_ripple_pp_mv
            formula: '[vout_ripple_pp]*1000'
            description: Peak-to-peak output voltage ripple in millivolts
          - var: vout_ripple_pct
            formula: 100*[vout_ripple_pp]/abs([vout_avg_ripple])
            description: Output voltage ripple as percentage of average output
      - rid: tr_inductor_current
        requirement: 'Output inductor current ripple and average current. Measure
          L_OUT current waveform: average current (IL_avg), peak current (IL_peak),
          and peak-to-peak ripple (IL_ripple_pp). Verify inductor operates in continuous
          conduction mode (CCM) and is not saturating.'
        criteria:
          il_avg_min: 0.8
          il_peak_max: 3
          il_ripple_pp_max: 1.5
        environment:
          - ref: time_domain
            t_start: 0.0135
            t_stop: 0.015
            t_step: 1.0e-07
            description: 15ms simulation to measure inductor current in steady-state
        measurement:
          - ref: VIN
            plot: false
            quantity: voltage
            nets:
              - - VIN
                - +
              - - VIN
                - '-'
          - ref: IL_OUT
            plot: false
            component: L_OUT
            quantity: current
            data:
              - name: il_avg
                spice_command: avg
                description: Average output inductor current
              - name: il_peak
                spice_command: max
                description: Peak output inductor current
              - name: il_ripple_pp
                spice_command: pp
                description: Peak-to-peak inductor current ripple
            description: Output inductor current measurement
          - ref: VOUT
            plot: false
            quantity: voltage
            nets:
              - - R_LOAD
                - pos
              - - R_LOAD
                - neg
        outputs:
          - var: il_avg_a
            formula: abs([il_avg])
            description: Average output inductor current in amperes
          - var: il_peak_a
            formula: abs([il_peak])
            description: Peak output inductor current in amperes
          - var: il_ripple_pp_a
            formula: '[il_ripple_pp]'
            description: Peak-to-peak inductor current ripple in amperes
      - rid: tr_capacitor_balance
        requirement: "Primary-side split capacitor voltage balance. Measure voltage\
          \ across C1 and C2 to verify equal voltage division (Vc1 \xC3\xA2\xE2\u20AC\
          \xB0\xCB\u2020 Vc2 \xC3\xA2\xE2\u20AC\xB0\xCB\u2020 Vin/2). Imbalance causes\
          \ DC bias in transformer primary, leading to core saturation. Verify voltage\
          \ balance within 5% tolerance."
        criteria:
          vc1_min: 11
          vc1_max: 13
          vc2_min: 11
          vc2_max: 13
          voltage_imbalance_pct_max: 5
        environment:
          - ref: time_domain
            t_start: 0.0135
            t_stop: 0.015
            t_step: 1.0e-07
            description: 15ms simulation to verify capacitor voltage balance in steady-state
        measurement:
          - ref: VIN
            plot: false
            quantity: voltage
            nets:
              - - VIN
                - +
              - - VIN
                - '-'
          - ref: VC1
            plot:
              x_axis: time
              title: C1 Voltage
            quantity: voltage
            nets:
              - - C1
                - pos
              - - C1
                - neg
            data:
              - name: vc1_avg
                spice_command: avg
                description: Average voltage across C1
            description: C1 voltage measurement for balance check
          - ref: VC2
            plot:
              x_axis: time
              title: C2 Voltage
            quantity: voltage
            nets:
              - - C2
                - pos
              - - C2
                - neg
            data:
              - name: vc2_avg
                spice_command: avg
                description: Average voltage across C2
            description: C2 voltage measurement for balance check
          - ref: VOUT
            plot: false
            quantity: voltage
            nets:
              - - R_LOAD
                - pos
              - - R_LOAD
                - neg
        outputs:
          - var: vc1_v
            formula: abs([vc1_avg])
            description: Average voltage across C1 in volts
          - var: vc2_v
            formula: abs([vc2_avg])
            description: Average voltage across C2 in volts
          - var: voltage_imbalance_pct
            formula: 100*abs([vc1_avg]-[vc2_avg])/max(abs([vc1_avg]),abs([vc2_avg]))
            description: Voltage imbalance percentage between C1 and C2
    metrics:
      objectives: []
      constraints: []
