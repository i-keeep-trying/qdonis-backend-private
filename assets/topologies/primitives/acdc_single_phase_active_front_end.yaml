id: acdc_single_phase_active_front_end
name: Single Phase Active Front End Rectifier
description: Single-Phase Active Front End (AFE) Rectifier using a continuous PI control
  loop and bipolar smooth PWM logic.
components:
- ref: GLOBAL_PARAMS
  type: custom_spice
  params:
    spice_line: .param V_TARGET=400 V_PEAK=325.27
- ref: GND
  type: node
  params:
    node_type: ground
- ref: VAC
  type: node
  role: voltage_source
  params:
    node_type: voltage_source
    source: sine
    offset: 0
    amplitude: 325.27
    frequency: 50
- ref: R_GND_L
  type: resistor
  params:
    resistance: 10000000.0
- ref: R_GND_N
  type: resistor
  params:
    resistance: 10000000.0
- ref: R_GRID_L
  type: resistor
  params:
    resistance: 0.1
- ref: L_BOOST
  type: inductor
  params:
    inductance: 0.001
- ref: VSENSE_AC
  type: node
  params:
    node_type: voltage_source
    source: dc
    voltage: 0
- ref: R_GRID_N
  type: resistor
  params:
    resistance: 0.1
- ref: B_GA_TOP
  type: b_source
  params:
    expression: v(n_duty_A_top)
- ref: R_GA_TOP
  type: resistor
  params:
    resistance: 10.0
- ref: M_A_TOP
  type: transistor
  params:
    family: mosfet
    type: nmos
    Vto: 3.5
    Kp: 60
    Rs: 0.04
- ref: D_A_TOP
  type: diode
  params:
    Rs: 0.01
    Cjo: 1.0e-10
    Tt: 1.0e-08
    Bv: 800.0
- ref: B_A_BOT
  type: b_source
  params:
    expression: 7.5 * (1 + tanh((v(n_ctrl) - v(n_tri) - 0.2)*100))
- ref: R_GA_BOT
  type: resistor
  params:
    resistance: 10.0
- ref: M_A_BOT
  type: transistor
  params:
    family: mosfet
    type: nmos
    Vto: 3.5
    Kp: 60
    Rs: 0.04
- ref: D_A_BOT
  type: diode
  params:
    Rs: 0.01
    Cjo: 1.0e-10
    Tt: 1.0e-08
    Bv: 800.0
- ref: B_GB_TOP
  type: b_source
  params:
    expression: v(n_duty_B_top)
- ref: R_GB_TOP
  type: resistor
  params:
    resistance: 10.0
- ref: M_B_TOP
  type: transistor
  params:
    family: mosfet
    type: nmos
    Vto: 3.5
    Kp: 60
    Rs: 0.04
- ref: D_B_TOP
  type: diode
  params:
    Rs: 0.01
    Cjo: 1.0e-10
    Tt: 1.0e-08
    Bv: 800.0
- ref: B_B_BOT
  type: b_source
  params:
    expression: 7.5 * (1 + tanh((v(n_tri) - v(n_ctrl) - 0.2)*100))
- ref: R_GB_BOT
  type: resistor
  params:
    resistance: 10.0
- ref: M_B_BOT
  type: transistor
  params:
    family: mosfet
    type: nmos
    Vto: 3.5
    Kp: 60
    Rs: 0.04
- ref: D_B_BOT
  type: diode
  params:
    Rs: 0.01
    Cjo: 1.0e-10
    Tt: 1.0e-08
    Bv: 800.0
- ref: C_DC
  type: capacitor
  params:
    capacitance: 0.0022
- ref: R_DC
  type: resistor
  params:
    resistance: 100.0
- ref: B_ERR
  type: b_source
  params:
    expression: V_TARGET - v(n_DC_BUS)
- ref: B_P
  type: b_source
  params:
    expression: v(n_err) * 0.1
- ref: G_INT
  type: custom_spice
  params:
    spice_line: G_INT 0 n_INT n_err 0 0.002
- ref: C_INT
  type: capacitor
  params:
    capacitance: 0.0001
- ref: R_INT
  type: resistor
  params:
    resistance: 10000000.0
- ref: B_MAG
  type: b_source
  params:
    expression: min(max(v(n_P) + v(n_INT), 0), 40)
- ref: R_MAG_FLT
  type: resistor
  params:
    resistance: 1000.0
- ref: C_MAG_FLT
  type: capacitor
  params:
    capacitance: 0.00001
- ref: R_MAG_DC
  type: resistor
  params:
    resistance: 1000000.0
- ref: B_REF
  type: b_source
  params:
    expression: v(n_mag_flt) * v(n_VAC_P, n_VAC_N) / V_PEAK
- ref: R_REF
  type: resistor
  params:
    resistance: 1000000.0
- ref: B_IACT
  type: b_source
  params:
    expression: i(VSENSE_AC)
- ref: R_IACT
  type: resistor
  params:
    resistance: 1000000.0
- ref: B_CERR
  type: b_source
  params:
    expression: max(min((v(n_ref) - v(n_iact)) * 10, 10), -10)
- ref: R_CERR
  type: resistor
  params:
    resistance: 1000000.0
- ref: R_CP
  type: resistor
  params:
    resistance: 1000.0
- ref: C_CP
  type: capacitor
  params:
    capacitance: 4.7e-08
- ref: R_DC_C
  type: resistor
  params:
    resistance: 1000000.0
- ref: VTRI
  type: custom_spice
  params:
    spice_line: V_TRI_src n_tri 0 PULSE(-10 10 0 5u 5u 0 10u)
- ref: R_TRI
  type: resistor
  params:
    resistance: 1000000.0
- ref: B_A_TOP
  type: b_source
  params:
    expression: 7.5 * (1 + tanh((v(n_tri) - v(n_ctrl) - 0.2)*100))
- ref: B_B_TOP
  type: b_source
  params:
    expression: 7.5 * (1 + tanh((v(n_ctrl) - v(n_tri) - 0.2)*100))
- ref: IC_CMD
  type: custom_spice
  params:
    spice_line: .ic V(n_DC_BUS)=400 V(n_INT)=29.5 V(n_mag_flt)=29.5
