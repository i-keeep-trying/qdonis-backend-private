- ref: B_REFA
  type: b_source
  params:
    expression: v(I_MAG) * (v(V_A_node) - v(N_star)) / 310.27
- ref: B_REFB
  type: b_source
  params:
    expression: v(I_MAG) * (v(V_B_node) - v(N_star)) / 310.27
- ref: B_REFC
  type: b_source
  params:
    expression: v(I_MAG) * (v(V_C_node) - v(N_star)) / 310.27
- ref: R_REFA
