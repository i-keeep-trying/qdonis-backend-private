id: acdc_single_phase_full_wave(transformer)
name: Single Phase Full Wave (Transformer) Rectifier
description: Full wave bridge rectifier utilizing an isolation transformer.
components:
- ref: GND
  type: node
  params:
    node_type: ground
- ref: VAC
  type: node
  role: voltage_source
  params:
    node_type: voltage_source
    source: sine
    offset: 0
    amplitude: 24
    frequency: 160
- ref: R_PRI
  type: resistor
  params:
    resistance: 0.001
- ref: TX
  type: transformer
  params:
    Lm_primary: 0.01
    turns_ratio: 1.0
    k_coupling: 1.0
    phase: same
- ref: R_SEC
  type: resistor
  params:
    resistance: 0.001
- ref: D1
  type: diode
  params:
    Is: 3.17e-05
    Rs: 0.051
    n: 1.373
    Cjo: 1.6e-10
    Tt: 0
- ref: D2
  type: diode
  params:
    Is: 3.17e-05
    Rs: 0.051
    n: 1.373
    Cjo: 1.6e-10
    Tt: 0
- ref: D3
  type: diode
  params:
    Is: 3.17e-05
    Rs: 0.051
    n: 1.373
    Cjo: 1.6e-10
    Tt: 0
- ref: D4
  type: diode
  params:
    Is: 3.17e-05
    Rs: 0.051
    n: 1.373
    Cjo: 1.6e-10
    Tt: 0
- ref: R_LOAD
  type: resistor
  params:
    resistance: 9.0
- ref: C_OUT
  type: capacitor
  params:
    capacitance: 0.0022
nets:
- - - GND
    - pin
  - - TX
    - S2
  - - D2
    - cathode
  - - D4
    - anode
- - - D1
    - anode
  - - D2
    - anode
  - - R_LOAD
    - neg
  - - C_OUT
    - neg
- - - D1
    - cathode
  - - D3
    - anode
  - - R_SEC
    - pin1
- - - D3
    - cathode
  - - D4
    - cathode
  - - R_LOAD
    - pos
  - - C_OUT
    - pos
- - - VAC
    - +
  - - R_PRI
    - neg
- - - VAC
    - '-'
  - - TX
    - P1
- - - TX
    - P2
  - - R_PRI
    - pos
- - - TX
    - S1
  - - R_SEC
    - pin2
analysis:
  transient:
    requirements:
    - rid: tr_single_phase_fw
      requirement: Verify full wave rectification via isolated transformer.
      criteria:
        target_vout: 18.0
      environment:
      - ref: time_domain
        t_step: 1.0e-06
        t_stop: 0.1
        t_start: 0.05
        t_max_step: 1.0e-06
      measurement:
      - ref: VOUT
        plot: true
        quantity: voltage
        nets:
        - - R_LOAD
          - pos
        - - R_LOAD
          - neg
        data:
        - name: Vout_avg
          spice_command: avg
          description: Average Output Voltage in steady state
      outputs:
      - var: vout_avg_v
        formula: abs([Vout_avg])
        description: Average Output Voltage
schematic:
  tuned: true
  components:
    C_OUT: {x: 880, y: 200, rotation: 0}
    D1: {x: 560, y: 280, rotation: 180}
    D2: {x: 720, y: 280, rotation: 180}
    D3: {x: 560, y: 120, rotation: 180}
    D4: {x: 720, y: 120, rotation: 180}
    GND: {x: 320, y: 340, rotation: 0}
    R_LOAD: {x: 1000, y: 200, rotation: 0}
    R_PRI: {x: 200, y: 300, rotation: 90}
    R_SEC: {x: 420, y: 140, rotation: 90}
    TX: {x: 300, y: 200, rotation: 0}
    VAC: {x: 100, y: 200, rotation: 180}
  wires:
  - {id: W1, from: GND.P, to: TX.S2}
  - {id: W2, from: D2.B, to: D4.A}
  - {id: W3, from: D2.B, to: GND.P}
  - {id: W4, from: C_OUT.B, to: R_LOAD.B}
  - {id: W5, from: D1.A, to: D2.A}
  - {id: W6, from: C_OUT.B, to: D2.A}
  - {id: W7, from: D1.B, to: D3.A}
  - {id: W8, from: D3.A, to: R_SEC.A}
  - {id: W9, from: C_OUT.A, to: R_LOAD.A}
  - {id: W10, from: D3.B, to: D4.B}
  - {id: W11, from: C_OUT.A, to: D4.B}
  - {id: W12, from: R_PRI.B, to: VAC.A}
  - {id: W13, from: TX.P1, to: VAC.B}
  - {id: W14, from: R_PRI.A, to: TX.P2}
  - {id: W15, from: R_SEC.B, to: TX.S1}
  groups: {}
