- ref: L1
  type: inductor
  role: ph1_filter
  params:
    inductance: 330e-9
    series_resistance: 0.02
    saturation_current: 15.0
    core_loss_resistance: 1e6
    parasitic_capacitance: 20e-12
    ic: 0
