    - +
- - - R_GB_TOP
    - neg
  - - M_B_TOP
    - gate
- - - CMP_B_BOT
    - out
  - - R_GB_BOT
    - pos
- - - R_GB_BOT
    - neg
  - - M_B_BOT
    - gate
- - - SUM_V
    - out
  - n_err
  - - KP_V
    - in
  - - INT_V
    - in
- - - KP_V
    - out
  - n_P
  - - SUM_PI
    - in1
- - - INT_V
    - out
  - n_INT
  - - SUM_PI
    - in2
- - - LIM_MAG
    - out
  - - LPF_MAG
    - in
- - - LPF_MAG
    - out
  - n_mag_flt
  - - REF_I
    - in1
- - - REF_I
    - out
  - n_ref
  - - SUM_I
    - in1
- - - I_SENSE
    - out
  - n_iact
  - - SUM_I
    - in2
- - - LIM_I
    - out
  - - LPF_C
    - in
- - - LPF_C
    - out
  - n_ctrl
  - - CMP_A_TOP
    - inn
  - - CMP_A_BOT
    - inp
  - - CMP_B_TOP
    - inp
  - - CMP_B_BOT
    - inn
- - - CAR
    - out
  - n_tri
  - - CMP_A_TOP
    - inp
  - - CMP_A_BOT
    - inn
  - - CMP_B_TOP
    - inn
  - - CMP_B_BOT
    - inp

# Voltage reference V_TARGET
- - - n_vref
    - pin
  - - REF_V
    - out
  - - SUM_V
    - in1

# Voltage PI sum (before the 0..40 clamp)
- - - n_pi_sum
    - pin
  - - SUM_PI
    - out
  - - LIM_MAG
    - in

# Line voltage v(n_VAC_P) - v(n_VAC_N)
- - - n_vac
    - pin
  - - SUM_VAC
    - out
  - - REF_I
    - in2

# Current error
- - - n_ierr
    - pin
  - - SUM_I
    - out
  - - K_I
    - in

# Amplified current error (before the +-10 clamp)
- - - n_ierr_k
    - pin
  - - K_I
    - out
  - - LIM_I
    - in
analysis:
  transient:
    spice_settings:
      tstop: 0.15
      use_ic: false
      reltol: 0.01
      abstol: 1.0e-06
      vntol: 0.001
      cshunt: 1.0e-11
      chgtol: 1.0e-11
      itl4: 50
      method: gear
    requirements:
    - rid: tr_afe_rectifier
      requirement: Verify AFE Rectifier active current shaping and output voltage.
      criteria:
        target_vout: 400.0
      measurement:
      - ref: VOUT
        plot:
          x_axis: time
          title: Output DC Voltage
        quantity: voltage
        component: R_DC
        nets:
        - - R_DC
          - pos
        - - R_DC
          - neg
        data:
        - name: Vout_avg
          spice_command: avg
          description: Average Output Voltage
          from: 0.14
          to: 0.15
      - ref: IIN_SENSE
        plot:
          x_axis: time
          title: Input AC Current
        quantity: current
        component: VSENSE_AC
        data:
        - name: Iin_rms
          spice_command: rms
          description: RMS Input Current
          from: 0.14
          to: 0.15
        - name: Iin_max
          spice_command: max
          description: Peak Input Current
          from: 0.14
          to: 0.15
      outputs:
      - var: vout_avg_v
        formula: abs([Vout_avg])
        description: Average Output Voltage
      - var: iin_rms_a
        formula: abs([Iin_rms])
        description: RMS Input Current
      - var: iin_peak_a
        formula: abs([Iin_max])
        description: Peak Input Current
