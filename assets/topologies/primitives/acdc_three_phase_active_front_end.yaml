- ref: L_EMI_A
  type: inductor
  params:
    inductance: 1m
- ref: L_EMI_B
  type: inductor
  params:
    inductance: 1m
- ref: L_EMI_C
  type: inductor
  params:
    inductance: 1m
- ref: C_EMI_A
  type: capacitor
  params:
    capacitance: 10u
- ref: C_EMI_B
  type: capacitor
  params:
