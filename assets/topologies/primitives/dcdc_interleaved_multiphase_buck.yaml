- ref: L2
  type: inductor
  role: ph2_filter
  params:
    inductance: 330e-9
    series_resistance: 0.02
    saturation_current: 15.0
    core_loss_resistance: 1e6
    parasitic_capacitance: 20e-12
    ic: 0
  layout:
    schX: -0.5
    schY: -6.0
    orientation: horizontal
- ref: L3
  type: inductor
  role: ph3_filter
  params:
    inductance: 330e-9
    series_resistance: 0.02
    saturation_current: 15.0
    core_loss_resistance: 1e6
    parasitic_capacitance: 20e-12
    ic: 0
  layout:
