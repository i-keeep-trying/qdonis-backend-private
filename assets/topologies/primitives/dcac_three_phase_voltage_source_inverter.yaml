id: dcac_three_phase_voltage_source_inverter
name: Three Phase Voltage Source Inverter
description: A 3-phase sine-PWM voltage source inverter with an RL load, using explicit
  carrier generation and behavioral comparators for switching logic.
components:
  - ref: ControlA
    type: node
    params:
      node_type: "label"

  - ref: ControlB
    type: node
    params:
      node_type: "label"

  - ref: ControlC
    type: node
    params:
      node_type: "label"

  - ref: Tri
    type: node
    params:
      node_type: "label"

  - ref: GND
    type: node
    params:
      node_type: "ground"

  - ref: PWM_AH
    type: node
    params:
      node_type: "label"

  - ref: PWM_AL
    type: node
    params:
      node_type: "label"

  - ref: PWM_BH
    type: node
    params:
      node_type: "label"

  - ref: PWM_BL
    type: node
    params:
      node_type: "label"

  - ref: PWM_CH
    type: node
    params:
      node_type: "label"

  - ref: PWM_CL
    type: node
    params:
      node_type: "label"

  # Modulation sources (were raw SPICE lines): 160 Hz three-phase sine references and the 16 kHz carrier
  - ref: V1
    type: node
    role: voltage_source
    params:
      node_type: "voltage_source"
      source: "pulse"
      v1: -10
      v2: 10
      td: 0
      tr: 3.124e-05
      tf: 3.124e-05
      pw: 2e-08
      per: 6.25e-05
      series_resistance: 0

  - ref: V2
    type: node
    role: voltage_source
    params:
      node_type: "voltage_source"
      source: "sine"
      offset: 0
      amplitude: 8
      frequency: 160
      series_resistance: 0

  - ref: V3
    type: node
    role: voltage_source
    params:
      node_type: "voltage_source"
      source: "sine"
      offset: 0
      amplitude: 8
      frequency: 160
      delay: 0
      damping: 0
      phase: 120
      series_resistance: 0

  - ref: V4
    type: node
    role: voltage_source
    params:
      node_type: "voltage_source"
      source: "sine"
      offset: 0
      amplitude: 8
      frequency: 160
      delay: 0
      damping: 0
      phase: 240
      series_resistance: 0

  # Sine-triangle PWM (blocks): each phase's top / bottom comparator; hard switching like the original
  # V(a) >= V(b) ? 1 : 0. The gate drivers E1..E6 (gain 100, floating on the switch nodes) stay E sources.
  - ref: CMP_AH
    type: comparator
    role: a_top_pwm
    params:
      high: 1
      low: 0
      width: 1e-06

  - ref: CMP_AL
    type: comparator
    role: a_bottom_pwm
    params:
      high: 1
      low: 0
      width: 1e-06

  - ref: CMP_BH
    type: comparator
    role: b_top_pwm
    params:
      high: 1
      low: 0
      width: 1e-06

  - ref: CMP_BL
    type: comparator
    role: b_bottom_pwm
    params:
      high: 1
      low: 0
      width: 1e-06

  - ref: CMP_CH
    type: comparator
    role: c_top_pwm
    params:
      high: 1
      low: 0
      width: 1e-06

  - ref: CMP_CL
    type: comparator
    role: c_bottom_pwm
    params:
      high: 1
      low: 0
      width: 1e-06

  - ref: E1
    type: e_source
    role: gate_driver_a_high
    params:
      gain: 100
  - ref: R1
    type: resistor
    role: gate_resistor_a_high
    params:
      resistance: 1k
  - ref: R2
    type: resistor
    role: gate_pulldown_a_high
    params:
      resistance: 50k
  - ref: E2
    type: e_source
    role: gate_driver_a_low
    params:
      gain: 100
  - ref: R3
    type: resistor
    role: gate_resistor_a_low
    params:
      resistance: 1k
  - ref: R4
    type: resistor
    role: gate_pulldown_a_low
    params:
      resistance: 50k
  - ref: E3
    type: e_source
    role: gate_driver_b_high
    params:
      gain: 100
  - ref: R5
    type: resistor
    role: gate_resistor_b_high
    params:
      resistance: 1k
  - ref: R6
    type: resistor
    role: gate_pulldown_b_high
    params:
      resistance: 50k
  - ref: E4
    type: e_source
    role: gate_driver_b_low
    params:
      gain: 100
  - ref: R7
    type: resistor
    role: gate_resistor_b_low
    params:
