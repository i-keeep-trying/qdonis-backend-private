id: dcac_three_phase_voltage_source_inverter
name: Three Phase Voltage Source Inverter
description: A 3-phase sine-PWM voltage source inverter with an RL load, using explicit
  carrier generation and behavioral comparators for switching logic.
components:
  - ref: V1
    type: custom_spice
    role: pwm_carrier
    params:
      spice_line: V1 Tri 0 PULSE(-10 10 0 0.03124m 0.03124m 0.00002m 0.0625m)
  - ref: V2
    type: custom_spice
    role: mod_a
    params:
      spice_line: V2 ControlA 0 SINE(0 8 160)
  - ref: V3
    type: custom_spice
    role: reference_sine_b
    params:
      spice_line: V3 ControlB 0 SINE(0 8 160 0 0 120)
  - ref: V4
    type: custom_spice
    role: reference_sine_c
    params:
      spice_line: V4 ControlC 0 SINE(0 8 160 0 0 240)
  - ref: B1
    type: b_source
    role: comparator_a_high
    params:
      expression: 'V(ControlA) >= V(Tri) ? 1 : 0'
  - ref: B2
    type: b_source
    role: comparator_a_low
    params:
      expression: 'V(ControlA) < V(Tri) ? 1 : 0'
  - ref: B3
    type: b_source
    role: comparator_b_high
    params:
      expression: 'V(ControlB) >= V(Tri) ? 1 : 0'
  - ref: B4
    type: b_source
    role: comparator_b_low
    params:
      expression: 'V(ControlB) < V(Tri) ? 1 : 0'
  - ref: B5
    type: b_source
    role: comparator_c_high
    params:
      expression: 'V(ControlC) >= V(Tri) ? 1 : 0'
  - ref: B6
    type: b_source
    role: comparator_c_low
    params:
      expression: 'V(ControlC) < V(Tri) ? 1 : 0'
  - ref: E1
    type: e_source
    role: gate_driver_a_high
    params:
      gain: 100
  - ref: R1
    type: resistor
    role: gate_resistor_a_high
    params:
      resistance: 1k
  - ref: R2
    type: resistor
    role: gate_pulldown_a_high
    params:
      resistance: 50k
  - ref: E2
    type: e_source
    role: gate_driver_a_low
    params:
      gain: 100
  - ref: R3
    type: resistor
    role: gate_resistor_a_low
    params:
      resistance: 1k
  - ref: R4
    type: resistor
    role: gate_pulldown_a_low
    params:
      resistance: 50k
  - ref: E3
    type: e_source
    role: gate_driver_b_high
    params:
      gain: 100
  - ref: R5
    type: resistor
    role: gate_resistor_b_high
    params:
      resistance: 1k
  - ref: R6
    type: resistor
    role: gate_pulldown_b_high
    params:
      resistance: 50k
  - ref: E4
    type: e_source
    role: gate_driver_b_low
    params:
      gain: 100
  - ref: R7
    type: resistor
    role: gate_resistor_b_low
    params:
      resistance: 1k
  - ref: R8
    type: resistor
    role: gate_pulldown_b_low
    params:
      resistance: 50k
  - ref: E5
    type: e_source
    role: gate_driver_c_high
    params:
      gain: 100
  - ref: R9
    type: resistor
    role: gate_resistor_c_high
    params:
      resistance: 1k
  - ref: R10
    type: resistor
    role: gate_pulldown_c_high
    params:
      resistance: 50k
  - ref: E6
    type: e_source
    role: gate_driver_c_low
    params:
      gain: 100
  - ref: R11
    type: resistor
    role: gate_resistor_c_low
    params:
      resistance: 1k
  - ref: R12
    type: resistor
    role: gate_pulldown_c_low
    params:
      resistance: 50k
  - ref: V5
    type: node
    role: dc_link_voltage
    params:
      node_type: voltage_source
      source: dc
      voltage: 380
  - ref: R13
    type: resistor
    role: dc_link_filter_res1
    params:
      resistance: 10
  - ref: C1
    type: capacitor
    role: dc_link_filter_cap1
    params:
      capacitance: 10u
  - ref: R14
    type: resistor
    role: dc_link_filter_res2
    params:
      resistance: 10
  - ref: C2
    type: capacitor
    role: dc_link_filter_cap2
    params:
      capacitance: 10u
  - ref: M1
    type: transistor
    role: mosfet_a_high
    params:
      family: mosfet
      type: nmos
      model: FDH210N08
      Bv: 500
  - ref: M2
    type: transistor
    role: mosfet_a_low
    params:
      family: mosfet
      type: nmos
      model: FDH210N08
      Bv: 500
  - ref: M3
    type: transistor
    role: mosfet_b_high
    params:
      family: mosfet
      type: nmos
      model: FDH210N08
      Bv: 500
  - ref: M4
    type: transistor
    role: mosfet_b_low
    params:
      family: mosfet
      type: nmos
      model: FDH210N08
      Bv: 500
  - ref: M5
    type: transistor
    role: mosfet_c_high
    params:
      family: mosfet
      type: nmos
      model: FDH210N08
      Bv: 500
  - ref: M6
    type: transistor
    role: mosfet_c_low
    params:
      family: mosfet
      type: nmos
      model: FDH210N08
      Bv: 500
  - ref: L1
    type: inductor
    role: load_inductor_a
    params:
      inductance: 10m
  - ref: L2
    type: inductor
    role: load_inductor_b
    params:
      inductance: 10m
  - ref: L3
    type: inductor
    role: load_inductor_c
    params:
      inductance: 10m
  - ref: R15
    type: resistor
    role: load_resistor_a
    params:
      resistance: 10
  - ref: R16
    type: resistor
    role: load_resistor_b
    params:
      resistance: 10
  - ref: R17
    type: resistor
    role: load_resistor_c
    params:
      resistance: 10
