id: acdc_totem_pole_power_factor_correction
name: Totem Pole Power Factor Correction Rectifier
description: 4kW Totem-Pole Bridgeless PFC Rectifier with Active Current Shaping Control
  Loop. Uses GaN (HF) and Si (LF) legs for synchronous rectification. Converts 200V AC RMS (282.84V peak, 50Hz)
  to regulated 400V DC bus across a 40 Ohm load (4kW).

models:
  - ".model nmos_hf NMOS(Vto=2 Lambda=0.01 Kp=100 Rs=0.03)"
  - ".model nmos_lf NMOS(Vto=3 Lambda=0.01 Kp=100 Rs=0.02)"
  - ".model Dmodel D(Is=5e-13 n=1.05 Rs=0.005 Cjo=5e-12 Tt=5e-09 Bv=650 Ibv=1e-06)"

components:
  # Reference & semantic node labels
  - ref: GND
    type: node
    params:
      node_type: ground

  - ref: n_AC_L_raw
    type: node
    params:
      node_type: label

  - ref: n_AC_N_raw
    type: node
    params:
      node_type: label

  - ref: n_AC_L
    type: node
    params:
      node_type: label

  - ref: n_AC_N
    type: node
    params:
      node_type: label

  - ref: n_SW_HF
    type: node
    params:
      node_type: label

  - ref: n_DC_POS
    type: node
    params:
      node_type: label

  - ref: n_SW_HF_TOP_dsense
    type: node
    params:
      node_type: label

  - ref: n_SW_HF_BOT_dsense
    type: node
    params:
      node_type: label

  - ref: n_SW_LF_TOP_dsense
    type: node
    params:
      node_type: label

  - ref: n_SW_LF_BOT_dsense
    type: node
    params:
      node_type: label

  - ref: n_g_HF_TOP
    type: node
    params:
      node_type: label

  - ref: n_g_HF_BOT
    type: node
    params:
      node_type: label

  - ref: n_g_LF_TOP
    type: node
    params:
      node_type: label

  - ref: n_g_LF_BOT
    type: node
    params:
      node_type: label

  - ref: n_pol
    type: node
    params:
      node_type: label

  - ref: n_pol_sign
    type: node
    params:
      node_type: label

  - ref: n_Verr
    type: node
    params:
      node_type: label

  - ref: n_Vp
    type: node
    params:
      node_type: label

  - ref: n_Vint
    type: node
    params:
      node_type: label

  - ref: n_PI_out
    type: node
    params:
      node_type: label

  - ref: n_Iref
    type: node
    params:
      node_type: label

  - ref: n_Iact_raw
    type: node
    params:
      node_type: label

  - ref: n_Iact_rect
    type: node
    params:
      node_type: label

  - ref: n_Ierr
    type: node
    params:
      node_type: label

  - ref: n_duty
    type: node
    params:
      node_type: label

  - ref: n_duty_c
    type: node
    params:
      node_type: label

  - ref: n_tri
    type: node
    params:
      node_type: label

  - ref: n_pwm
    type: node
    params:
      node_type: label

  - ref: n_Vref
    type: node
    params:
      node_type: "label"

  - ref: n_PI_sum
    type: node
    params:
      node_type: "label"

  - ref: n_vac_norm
    type: node
    params:
      node_type: "label"

  - ref: n_dff
    type: node
    params:
      node_type: "label"

  - ref: n_dfb
    type: node
    params:
      node_type: "label"

  # --- Input source (200V AC RMS = 282.84V peak, 50Hz) ---
  - ref: VAC
    type: node
    role: voltage_source
    params:
      node_type: voltage_source
      source: sine
      offset: 0
      amplitude: 282.84
      frequency: 50
      series_resistance: 0

  - ref: RAC_L_series
    type: resistor
    params:
      resistance: 0.05
      sense: false

  - ref: RAC_N_series
    type: resistor
    params:
      resistance: 0.05
      sense: false

  # --- PFC Inductor (480uH) ---
  - ref: L_PFC
    type: inductor
    role: boost_inductor
    params:
      inductance: 0.00048
      series_resistance: 0.01

  # --- High-Frequency Leg (GaN) ---
  - ref: VSW_HF_TOP_SENSE
    type: node
    params:
      node_type: voltage_source
      source: dc
      voltage: 0
      series_resistance: 0

  - ref: SW_HF_TOP
    type: transistor
    role: hf_high_side
    params:
      family: mosfet
      type: nmos
      model: nmos_hf
      sense: false

  - ref: DD_HF_TOP
    type: diode
    role: body_diode
    params:
      model: Dmodel
      sense: false

  - ref: VSW_HF_BOT_SENSE
    type: node
    params:
      node_type: voltage_source
      source: dc
      voltage: 0
      series_resistance: 0

  - ref: SW_HF_BOT
    type: transistor
    role: hf_low_side
    params:
      family: mosfet
      type: nmos
      model: nmos_hf
      sense: false

  - ref: DD_HF_BOT
    type: diode
    role: body_diode
    params:
      model: Dmodel
      sense: false

  # --- Low-Frequency Leg (Si) ---
  - ref: VSW_LF_TOP_SENSE
    type: node
    params:
      node_type: voltage_source
      source: dc
      voltage: 0
      series_resistance: 0

  - ref: SW_LF_TOP
    type: transistor
    role: lf_high_side
    params:
      family: mosfet
      type: nmos
      model: nmos_lf
      sense: false

  - ref: DD_LF_TOP
    type: diode
    role: body_diode
    params:
      model: Dmodel
      sense: false

  - ref: VSW_LF_BOT_SENSE
    type: node
    params:
      node_type: voltage_source
      source: dc
      voltage: 0
      series_resistance: 0

  - ref: SW_LF_BOT
    type: transistor
    role: lf_low_side
    params:
      family: mosfet
      type: nmos
      model: nmos_lf
      sense: false

  - ref: DD_LF_BOT
    type: diode
    role: body_diode
    params:
      model: Dmodel
      sense: false

  # --- Output Filter & Load (400V DC, 4kW) ---
  - ref: Cout
    type: capacitor
    role: output_filter_cap
    params:
      capacitance: 0.00272
      series_resistance: 0.01
      ic: 400.0

  - ref: R_LOAD
    type: resistor
    role: load
    params:
      resistance: 40.0
      sense: false

  # 1. Smooth AC polarity detection (0..1 and -1..+1)
  - ref: POL
    type: comparator
    role: ac_polarity
    params:
      high: 1
      low: 0
      width: 0.01

  - ref: POL_SIGN
    type: comparator
    role: ac_polarity_sign
    params:
      high: 1
      low: -1
      width: 0.01

  # 2. Outer voltage loop: PI = 0.01 * err + 100 * integral(err), clamped 0..45
  - ref: REF_V
    type: const
    role: voltage_reference
    params:
      value: 400

  - ref: SUM_V
    type: sum
    role: voltage_error
    params:
      signs: "+-"

  - ref: KP_V
    type: gain
    role: voltage_p
    params:
      gain: 0.01

  - ref: INT_V
    type: integrator
    role: voltage_i
    params:
      ki: 100
      ic: 28.28

  - ref: SUM_PI
    type: sum
    role: voltage_pi_sum
    params:
      signs: "++"

  - ref: LIM_PI
    type: limiter
    role: voltage_pi_clamp
    params:
      lower: 0
      upper: 45

  # 3./4./5. Current reference = PI * |v_ac| / 282.84; sensed current rectified by the polarity, 10us filter; error
  - ref: VAC_NORM
    type: function
    role: normalised_line_voltage
    params:
      expression: "abs(in1-in2)/282.84"
      inputs: 2

  - ref: IREF
    type: product
    role: current_reference
    params:
      gain: 1

  - ref: I_SENSE
    type: function
    role: rectified_current_sense
    params:
      expression: "I(VL_PFC_SENSE)*in1"
      inputs: 1

  - ref: LPF_I
    type: lowpass
    role: current_filter
    params:
      tau: 1e-05

  - ref: SUM_I
    type: sum
    role: current_error
    params:
      signs: "+-"

  # 6. Duty = feed-forward (1 - |v_ac| / 400) + 0.05 * current error, clamped 0.02..0.98
  - ref: FF_D
    type: function
    role: duty_feedforward
    params:
      expression: "1-abs(in1-in2)/400"
      inputs: 2

  - ref: KP_I
    type: gain
    role: current_p
    params:
      gain: 0.05

  - ref: SUM_D
    type: sum
    role: duty
    params:
      signs: "++"

  - ref: LIM_D
    type: limiter
    role: duty_clamp
    params:
      lower: 0.02
      upper: 0.98

  # ========================================================
  # --- Active Current Shaping Controller (Closed-Loop) ---
  # ========================================================
  # 7. PWM Generation (100kHz Sawtooth Carrier)
  - ref: V_tri
    type: node
    role: voltage_source
    params:
      node_type: voltage_source
      source: pulse
      v1: 0
      v2: 1
      td: 0
      tr: 5.0e-06
      tf: 5.0e-06
      pw: 0
      per: 1.0e-05
      series_resistance: 0

  - ref: CMP
    type: comparator
    role: pwm_comparator
    params:
      high: 1
      low: 0
      width: 1.0e-06  # hard switching, like the original V(a) > V(b) ? high : low

  # Ground-referenced gate drives as blocks; the high-side ones (floating on the switch nodes) stay E sources
  - ref: DRV_LF_BOT
    type: gain
    role: lf_bottom_gate_drive
    params:
      gain: 12

  - ref: DRV_HF_BOT
    type: function
    role: hf_bottom_gate_drive
    params:
      expression: "(in1*in2+(1-in1)*(1-in2))*12"
      inputs: 2

  # 8. Gate Routing
  - ref: E_g_LF_TOP
    type: e_source
    params:
      expression: "(1 - V(n_pol)) * 12"

  - ref: E_g_HF_TOP
    type: e_source
    params:
      expression: "((1 - V(n_pol)) * V(n_pwm) + V(n_pol) * (1 - V(n_pwm))) * 12"

nets:
  # Circuit Ground (0)
  - - - GND
      - pin
    - - SW_HF_BOT
      - source
    - - DD_HF_BOT
      - anode
    - - SW_LF_BOT
      - source
    - - DD_LF_BOT
      - anode
    - - Cout
      - neg
    - - R_LOAD
      - neg
    - - V_tri
      - '-'

  # AC input lines raw
  - - - n_AC_L_raw
      - pin
    - - VAC
      - +
    - - RAC_L_series
      - pos

  - - - n_AC_N_raw
      - pin
    - - VAC
      - '-'
    - - RAC_N_series
      - pos

  # AC input Line L
  - - - n_AC_L
      - pin
    - - RAC_L_series
      - neg
    - - L_PFC
      - pos
    - - POL
      - inp
    - - POL_SIGN
      - inp
    - - VAC_NORM
      - in1
    - - FF_D
      - in1

  # AC input Neutral N
  - - - n_AC_N
      - pin
    - - RAC_N_series
      - neg
    - - SW_LF_TOP
      - source
    - - DD_LF_TOP
      - anode
    - - VSW_LF_BOT_SENSE
      - +
    - - E_g_LF_TOP
      - '-'
    - - POL
      - inn
    - - POL_SIGN
      - inn
    - - VAC_NORM
      - in2
    - - FF_D
      - in2

  # HF switch node (between inductor and HF GaN leg)
  - - - n_SW_HF
      - pin
    - - L_PFC
      - neg
    - - SW_HF_TOP
      - source
    - - DD_HF_TOP
      - anode
    - - VSW_HF_BOT_SENSE
      - +
    - - E_g_HF_TOP
      - '-'

  # DC positive bus (400V)
  - - - n_DC_POS
      - pin
    - - VSW_HF_TOP_SENSE
      - +
    - - VSW_LF_TOP_SENSE
      - +
    - - Cout
      - pos
    - - R_LOAD
      - pos
    - - SUM_V
      - in2

  # Switch drain sense nodes
  - - - n_SW_HF_TOP_dsense
      - pin
    - - VSW_HF_TOP_SENSE
      - '-'
    - - SW_HF_TOP
      - drain
    - - DD_HF_TOP
      - cathode

  - - - n_SW_HF_BOT_dsense
      - pin
    - - VSW_HF_BOT_SENSE
      - '-'
    - - SW_HF_BOT
      - drain
    - - DD_HF_BOT
      - cathode

  - - - n_SW_LF_TOP_dsense
      - pin
    - - VSW_LF_TOP_SENSE
      - '-'
    - - SW_LF_TOP
      - drain
    - - DD_LF_TOP
      - cathode

  - - - n_SW_LF_BOT_dsense
      - pin
    - - VSW_LF_BOT_SENSE
      - '-'
    - - SW_LF_BOT
      - drain
    - - DD_LF_BOT
      - cathode

  # Switch gate nodes
  - - - n_g_HF_TOP
      - pin
    - - SW_HF_TOP
      - gate
    - - E_g_HF_TOP
      - +

  - - - n_g_HF_BOT
      - pin
    - - SW_HF_BOT
      - gate
    - - DRV_HF_BOT
      - out

  - - - n_g_LF_TOP
      - pin
    - - SW_LF_TOP
      - gate
    - - E_g_LF_TOP
      - +

  - - - n_g_LF_BOT
      - pin
    - - SW_LF_BOT
      - gate
    - - DRV_LF_BOT
      - out

  # Control signals
  - - - n_pol
      - pin
    - - POL
      - out
    - - DRV_LF_BOT
      - in
    - - DRV_HF_BOT
      - in1

  - - - n_pol_sign
      - pin
    - - POL_SIGN
      - out
    - - I_SENSE
      - in1

  - - - n_Verr
      - pin
    - - SUM_V
      - out
    - - INT_V
      - in
    - - KP_V
      - in

  - - - n_Vp
      - pin
    - - KP_V
      - out
    - - SUM_PI
      - in1

  - - - n_Vint
      - pin
    - - INT_V
      - out
    - - SUM_PI
      - in2

  - - - n_PI_out
      - pin
    - - LIM_PI
      - out
    - - IREF
      - in1

  - - - n_Iref
      - pin
    - - IREF
      - out
    - - SUM_I
      - in1

  - - - n_Iact_raw
      - pin
    - - I_SENSE
      - out
    - - LPF_I
      - in

  - - - n_Iact_rect
      - pin
    - - LPF_I
      - out
    - - SUM_I
      - in2

  - - - n_Ierr
      - pin
    - - SUM_I
      - out
    - - KP_I
      - in

  - - - n_duty
      - pin
    - - SUM_D
      - out
    - - LIM_D
      - in

  - - - n_duty_c
      - pin
    - - LIM_D
      - out
    - - CMP
      - inp

  - - - n_tri
      - pin
    - - V_tri
      - +
    - - CMP
      - inn

  - - - n_pwm
      - pin
    - - CMP
      - out
    - - DRV_HF_BOT
      - in2

  # Voltage reference 400V
  - - - n_Vref
      - pin
    - - REF_V
      - out
    - - SUM_V
      - in1

  # Voltage PI sum (before the 0..45 clamp)
  - - - n_PI_sum
      - pin
    - - SUM_PI
      - out
    - - LIM_PI
      - in

  # Normalised rectified line voltage |v_ac| / 282.84
  - - - n_vac_norm
      - pin
    - - VAC_NORM
      - out
    - - IREF
      - in2

  # Duty feed-forward 1 - |v_ac| / 400
  - - - n_dff
      - pin
    - - FF_D
      - out
    - - SUM_D
      - in1

  # Duty feedback 0.05 * current error
  - - - n_dfb
      - pin
    - - KP_I
      - out
    - - SUM_D
      - in2

analysis:
  spice_settings:
    rshunt: 1.0e+06
    reltol: 0.001
    abstol: 1.0e-06
    vntol: 0.001
    chgtol: 1.0e-07
    gmin: 1.0e-09
    method: gear
    maxord: 2
    trtol: 4
  transient:
    requirements:
      - rid: tr_totem_pfc
        requirement: Verify 400V DC output and active current shaping PFC operation
        criteria:
          target_vout: 400.0
        environment:
          - ref: time_domain
            t_step: 1.0e-06
            t_stop: 0.04
            t_max_step: 1.0e-06
        # Measured over one full 50 Hz line cycle (20-40 ms; settled by 10 ms). The default window (last 20 %,
        # 32-40 ms) covered only part of the negative half-cycle: Iin_peak read 0.34 A instead of 29.8 A, and the
        # averages and RMS were taken over a fraction of a cycle.
        measurement:
          - ref: VOUT
            plot: true
            quantity: voltage
            nets:
              - - R_LOAD
                - pos
              - - R_LOAD
                - neg
            data:
              - name: Vout_avg
                spice_command: avg
                description: Average Output Voltage over one line cycle
                from: 0.02
                to: 0.04
              - name: Vout_ripple_vpp
                spice_command: pp
                description: Output Ripple peak-to-peak (100 Hz) over one line cycle
                from: 0.02
                to: 0.04
          - ref: IIN
            plot: true
            quantity: current
            component: L_PFC
            data:
              - name: Iin_rms
                spice_command: rms
                description: RMS Input AC Inductor Current
                from: 0.02
                to: 0.04
              - name: Iin_peak
                spice_command: max
                description: Peak Input AC Inductor Current
                from: 0.02
                to: 0.04
          - ref: VAC
            plot: true
            quantity: voltage
            nets:
              - - n_AC_L
                - pin
              - - n_AC_N
                - pin
        outputs:
          - var: vout_avg_v
            formula: abs([Vout_avg])
            description: Average Output Voltage
          - var: iin_rms_a
            formula: abs([Iin_rms])
            description: RMS Input Current
          - var: pout_avg_w
            formula: (abs([Vout_avg])**2) / 40.0
            description: Delivered Output Power
metadata:
  stage:
    - pfc
    - rectifier
  topology: totem_pole_pfc
  control: active_current_shaping
  tags:
    - totem-pole
    - pfc
    - gan
    - acdc
    - bridgeless
