analysis:
  spice_settings:
    reltol: 0.005
    abstol: 1.0e-09
    vntol: 1.0e-06
    chgtol: 1.0e-11
    gmin: 1.0e-10
    method: trap
    maxord: 2
    trtol: 4
    itl4: 100
    ic: v(N008)=400
  transient:
    spice_settings:
      tstop: 0.06
      use_ic: false
      reltol: 0.005
      abstol: 1.0e-09
      vntol: 1.0e-06
      chgtol: 1.0e-11
      gmin: 1.0e-10
      method: trap
      maxord: 2
      trtol: 4
      itl4: 100
      ic: v(N008)=400
    requirements:
    - rid: tr_phase_currents
      requirement: Regulate three-phase output load currents to 1.0A peak at 160Hz
        via closed-loop control
      criteria:
        target_current_peak_a: 1.0
        fundamental_freq_hz: 160
      environment:
      - ref: time_domain
        t_step: 2.0e-07
        t_stop: 0.06
        t_max_step: 1.0e-06
      measurement:
      - ref: VIN
        plot:
          x_axis: time
          title: DC Input Voltage (V1)
        component: VIN
        quantity: voltage
        nets:
        - - VIN
          - +
        - - VIN
          - '-'
        data:
        - name: Vin_avg
          spice_command: avg
          description: Avg Input Voltage
      - ref: V_OUT
        plot:
          x_axis: time
          title: Phase A Load Voltage
        nets:
        - - N011
          - pin
        - - N020
          - pin
        quantity: voltage
        data:
        - name: Vout_rms
          spice_command: rms
          description: RMS Load Voltage
      - ref: I_PHASE_A
        plot:
          x_axis: time
          title: Phase A Output Current
        component: VSENSE_A
        quantity: current
        data:
        - name: Iphase_a_max
          spice_command: max
          description: Peak positive Phase A output current
        - name: Iphase_a_min
          spice_command: min
          description: Peak negative Phase A output current
        - name: Iphase_a_rms
          spice_command: rms
          description: RMS Phase A output current
      - ref: I_PHASE_B
        plot:
          x_axis: time
          title: Phase B Output Current
        component: VSENSE_B
        quantity: current
        data:
        - name: Iphase_b_max
          spice_command: max
          description: Peak positive Phase B output current
        - name: Iphase_b_min
          spice_command: min
          description: Peak negative Phase B output current
        - name: Iphase_b_rms
          spice_command: rms
          description: RMS Phase B output current
      - ref: I_PHASE_C
        plot:
          x_axis: time
          title: Phase C Output Current
        component: VSENSE_C
        quantity: current
        data:
        - name: Iphase_c_max
          spice_command: max
          description: Peak positive Phase C output current
        - name: Iphase_c_min
          spice_command: min
          description: Peak negative Phase C output current
        - name: Iphase_c_rms
          spice_command: rms
          description: RMS Phase C output current
      - ref: I_REF_A
        plot:
          x_axis: time
          title: Phase A Current Reference (1.0A Peak)
        component: V_IREF_A
        quantity: voltage
        nets:
        - - V_IREF_A
          - +
        - - V_IREF_A
          - '-'
        data:
        - name: Iref_a_max
          spice_command: max
          description: Peak reference current command
      outputs:
      - var: iphase_a_peak_a
        formula: '[Iphase_a_max]'
        description: Peak Phase A current (regulated to 1.0A)
      - var: iphase_b_peak_a
        formula: '[Iphase_b_max]'
        description: Peak Phase B current (regulated to 1.0A)
      - var: iphase_c_peak_a
        formula: '[Iphase_c_max]'
        description: Peak Phase C current (regulated to 1.0A)
      - var: iphase_a_rms_a
        formula: '[Iphase_a_rms]'
        description: RMS Phase A current
      - var: current_tracking_error_pct
        formula: 100*abs([Iphase_a_max] - [Iref_a_max])/[Iref_a_max]
        description: Closed-loop Phase A current tracking error percentage
    - rid: tr_line_voltage
      requirement: Three-level Line-to-Line PWM AC voltage (V_N1 - V_N2)
      criteria:
        vdc_bus_v: 24
      environment:
      - ref: time_domain
        t_step: 2.0e-07
        t_stop: 0.06
        t_max_step: 1.0e-06
      measurement:
      - ref: VLINE_AB
        plot:
          x_axis: time
          title: Line-to-Line Output Voltage (V_N1 - V_N2)
        quantity: voltage
        nets:
        - - VSENSE_A
          - +
        - - VSENSE_B
          - +
        data:
        - name: Vline_ab_max
          spice_command: max
          description: Peak positive line-to-line voltage
        - name: Vline_ab_min
          spice_command: min
          description: Peak negative line-to-line voltage
        - name: Vline_ab_pp
          spice_command: pp
          description: Peak-to-peak line-to-line voltage
      outputs:
      - var: vline_ab_max_v
        formula: '[Vline_ab_max]'
        description: Peak line-to-line voltage
      - var: vline_ab_pp_v
        formula: '[Vline_ab_pp]'
        description: Peak-to-peak line-to-line voltage
    - rid: tr_midpoint_balance
      requirement: DC bus midpoint stability and 3-level pole-to-midpoint voltage
        (V_N1 - V_N008)
      criteria:
        vmid_target_v: 12
      environment:
      - ref: time_domain
        t_step: 2.0e-07
        t_stop: 0.06
        t_max_step: 1.0e-06
      measurement:
      - ref: VPOLE_A
        plot:
          x_axis: time
          title: Pole-to-Midpoint Voltage V(N1) - V(N008)
        quantity: voltage
        nets:
        - - VSENSE_A
          - +
        - - C2
          - pos
        data:
        - name: Vpole_a_max
          spice_command: max
          description: Maximum pole-to-midpoint voltage (+12V)
        - name: Vpole_a_min
          spice_command: min
          description: Minimum pole-to-midpoint voltage (-12V)
      outputs:
      - var: vmid_avg_v
        formula: '[Vmid_avg]'
        description: DC bus midpoint average voltage
      - var: vmid_ripple_v
        formula: '[Vmid_pp]'
        description: DC bus midpoint voltage ripple
      - var: vpole_a_max_v
        formula: '[Vpole_a_max]'
        description: Peak positive pole-to-midpoint voltage
      - var: vpole_a_min_v
        formula: '[Vpole_a_min]'
        description: Peak negative pole-to-midpoint voltage
metadata:
  stage:
  - power_switch
  - control
  - filter
  topology: inverter
  control: closed-loop_current_pd_pwm
  tags:
  - t-type
  - three-level
  - multilevel
  - closed-loop
  - current-controlled
  - three-phase
  - inverter
