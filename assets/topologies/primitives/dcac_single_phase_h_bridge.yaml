id: dcac_single_phase_h_bridge
name: Single-Phase Full-Bridge (H-Bridge) Inverter
description: Single-phase full-bridge (H-bridge) PWM voltage-source inverter with
  unipolar/bipolar sine-triangle modulation. Converts a 380V DC bus to a 50Hz sinusoidal
  AC output voltage (approx 215V RMS) filtered through a 5mH/10uF LC filter across
  a 20 Ohm resistive load. Uses four voltage-controlled switches (S1-S4) with anti-parallel
  freewheeling diodes (D1-D4) and 15V gate drivers driven by a 16kHz triangle carrier.
models:
- .model sw_mod SW(Ron=0.003 Roff=1Meg Vt=7.5 Vh=1)
- .model Dmodel D(Is=1e-12 n=1.1 Rs=0.01 Cjo=10p Tt=0 Bv=1000 Ibv=1e-06)
