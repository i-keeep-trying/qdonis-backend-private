id: dcdc_two_switch_forward
name: Two Switch Forward DC-DC Converter
description: Isolated DC-DC forward converter with two series primary switches and
  automatic core demagnetization via clamp diodes D1/D2. Converts 48V input to 5V
  output at 1A load. Both SW1 and SW2 switch simultaneously (same gate signal). When
  switches turn OFF, the transformer magnetizing current drives the switch node voltage;
  D1 (P1 node to VIN+) and D2 (VIN- to P2 node) clamp the primary voltage to VIN and
  return energy to the source. Core resets in the off-time, requiring duty < 0.5.
  Secondary uses a forward diode and freewheeling diode with LC output filter.
components:
  - ref: VIN
    type: node
    role: input_source
    params:
      node_type: voltage_source
      source: dc
      voltage: 48
      series_resistance: 0.1
  - ref: PWM1
    type: node
    role: pwm_control
    params:
      node_type: pwm_control
      frequency: 100e3
      duty_cycle: 0.42
      vhigh: 15.0
      vlow: 0.0
      trise: 1e-7
      tfall: 1e-7
      tdelay: 0
      drive_resistance: 100
  - ref: PWM2
    type: node
    role: pwm_control
    params:
      node_type: pwm_control
      frequency: 100e3
      duty_cycle: 0.42
      vhigh: 15.0
      vlow: 0.0
      trise: 1e-7
      tfall: 1e-7
      tdelay: 0
      drive_resistance: 100
  - ref: SW1
    type: transistor
    role: primary_switch_top
    params:
      family: mosfet
      type: nmos
      mode: enhancement
      voltage_rating: 200
      current_rating: 5
      Vto: 1.5
      Kn: 50e-3
      Lambda: 0.01
      Cgs: 500e-12
      Cgd: 100e-12
      Cdb: 100e-12
    layout:
      schX: -1.5
      schY: 0.0
      rotation: 270deg
  - ref: SW2
    type: transistor
    role: primary_switch_bot
    params:
      family: mosfet
      type: nmos
      mode: enhancement
      voltage_rating: 200
      current_rating: 5
      Vto: 1.5
      Kn: 50e-3
      Lambda: 0.01
      Cgs: 500e-12
      Cgd: 100e-12
      Cdb: 100e-12
    layout:
      schX: -1.5
      schY: -3.0
      rotation: 270deg
  - ref: D1
    type: diode
    role: clamp_diode_top
    params:
      reverse_voltage: 200
      current_rating: 3
      Is: 1e-12
      n: 1.1
      Rs: 0.1
      Cjo: 5e-12
      Tt: 10e-9
      Bv: 200
      Ibv: 1e-6
    layout:
      schX: -3.0
      schY: 0.0
      orientation: pos_bottom
  - ref: D2
    type: diode
    role: clamp_diode_bot
    params:
      reverse_voltage: 200
      current_rating: 3
      Is: 1e-12
      n: 1.1
      Rs: 0.1
      Cjo: 5e-12
      Tt: 10e-9
      Bv: 200
      Ibv: 1e-6
    layout:
      schX: -3.0
      schY: -3.0
      orientation: pos_bottom
  - ref: T1
    type: transformer
    role: power_transformer
    params:
      Lm_primary: 500e-6
      turns_ratio: 2.5
      k_coupling: 0.99
      phase: same
      Rp: 0.5
      Rs: 0.1
      core_loss_resistance: 1e6
    layout:
      schX: 0.5
      schY: -1.5
      configuration: left-to-right
    internal:
      - ref: R_ISO
        type: resistor
        role: secondary_ground_anchor
        params:
          resistance: 100e6
        connections:
          pos:
            - T1
            - S2
          neg:
            - VIN
            - '-'
  - ref: D_FWD
    type: diode
    role: secondary_forward
    params:
      reverse_voltage: 50
      current_rating: 5
      Is: 1e-12
      n: 1.1
      Rs: 0.1
      Cjo: 10e-12
      Tt: 15e-9
      Bv: 100
      Ibv: 1e-6
    layout:
      schX: 1.5
      schY: -0.5
      orientation: horizontal
  - ref: D_FW
    type: diode
    role: secondary_freewheeling
    params:
      reverse_voltage: 50
      current_rating: 5
      Is: 1e-12
      n: 1.1
      Rs: 0.1
      Cjo: 10e-12
      Tt: 15e-9
      Bv: 100
      Ibv: 1e-6
    layout:
      schX: 2.5
      schY: -1.5
      orientation: pos_bottom
  - ref: L_OUT
    type: inductor
    role: output_filter
    params:
      inductance: 100e-6
      series_resistance: 0.05
      saturation_current: 5.0
      core_loss_resistance: 1e6
      parasitic_capacitance: 30e-12
      ic: 0
    layout:
      schX: 3.5
      schY: -0.5
      orientation: horizontal
  - ref: Cout
    type: capacitor
    role: output_filter
    params:
      capacitance: 470e-6
      polarized: true
      voltage_rating: 16
      tolerance: 0.1
      esr: 0.02
      esl: 5e-9
      leakage_current: 1e-6
      ic: 0
    layout:
      schX: 4.5
      schY: -1.5
      orientation: vertical
  - ref: R_LOAD
    type: resistor
    role: load
    params:
      resistance: 5
      tolerance: 0.05
      temp_coefficient: 100e-6
      parasitic_inductance: 10e-9
    layout:
      schX: 5.5
      schY: -1.5
      orientation: vertical
nets:
  - - - VIN
      - +
    - - SW1
      - drain
    - - D1
      - cathode
  - - - SW1
      - source
    - - T1
      - P1
    - - D2
      - cathode
    - - PWM1
      - neg
  - - - PWM1
      - pos
    - - SW1
      - gate
  - - - T1
      - P2
    - - SW2
      - drain
    - - D1
      - anode
  - - - VIN
      - '-'
    - - SW2
      - source
    - - D2
      - anode
    - - PWM2
      - neg
  - - - PWM2
      - pos
    - - SW2
      - gate
  - - - T1
      - S1
    - - D_FWD
      - anode
  - - - D_FWD
      - cathode
    - - D_FW
      - cathode
    - - L_OUT
      - pin1
  - - - T1
      - S2
    - - D_FW
      - anode
    - - Cout
      - neg
    - - R_LOAD
      - neg
  - - - L_OUT
      - pin2
    - - Cout
      - pos
    - - R_LOAD
      - pos
analysis:
  transient:
    spice_settings:
      tstop: 0.02
      reltol: 0.01
      abstol: 1.0e-10
      vntol: 1.0e-06
      gmin: 1.0e-12
      method: gear
      maxord: 2
    requirements:
      - rid: tr_reg
        requirement: Output voltage regulation at 5V; duty < 0.5 enforced for core
          reset margin
        criteria:
          target_vout: 5.0
          regulation_limit_pct: 5
          ripple_limit_vpp: 30e-3
          max_duty: 0.45
        measurement:
          - ref: VOUT
            plot:
              x_axis: time
              title: Output Voltage Two-Switch Forward
            component: R_LOAD
            quantity: voltage
            nets:
              - - R_LOAD
                - pos
              - - T1
                - S2
            data:
              - name: Vout_avg
                spice_command: avg
                description: Average output voltage
              - name: Vout_ripple_vpp
                spice_command: pp
                description: Peak-to-peak output ripple
          - ref: IOUT
            plot: false
            component: R_LOAD
            quantity: current
            data:
              - name: Iout_avg
                spice_command: avg
                description: Average load current
        outputs:
          - var: load_regulation_pct
            formula: 100*abs([Vout_avg] - {criteria.target_vout})/{criteria.target_vout}
            description: Load regulation deviation from target
          - var: vout_avg_v
            formula: '[Vout_avg]'
            description: Average output voltage
          - var: vout_ripple_vpp_v
            formula: '[Vout_ripple_vpp]'
            description: Output voltage peak-to-peak ripple
      - rid: tr_eff
        requirement: Efficiency; verify D1/D2 clamp diode loss; measure forward and
          freewheeling diode conduction
        criteria:
          efficiency_target_pct: 85
        measurement:
          - ref: IIN
            plot: false
            component: VIN
            quantity: current
            data:
              - name: Iin_avg
                spice_command: avg
                description: Average input current
          - ref: IOUT_EFF
            plot: false
            component: R_LOAD
            quantity: current
            data:
              - name: Iout_avg
                spice_command: avg
                description: Average load current
          - ref: VOUT_EFF
            plot: false
            component: R_LOAD
            quantity: voltage
            nets:
              - - R_LOAD
                - pos
              - - T1
                - S2
            data:
              - name: Vout_avg
                spice_command: avg
                description: Average output voltage
          - ref: VIN_EFF
            plot: false
            component: VIN
            quantity: voltage
            nets:
              - - VIN
                - +
              - - VIN
                - '-'
            data:
              - name: Vin_avg
                spice_command: avg
                description: Average input voltage
          - ref: ID1
            plot: false
            component: D1
            quantity: current
            data:
              - name: Id1_avg
                spice_command: avg
                description: Average clamp diode D1 current (energy returned to source)
          - ref: ID_FWD
            plot: false
            component: D_FWD
            quantity: current
            data:
              - name: Id_fwd_avg
                spice_command: avg
                description: Average forward diode current
          - ref: IL_OUT
            plot:
              x_axis: time
              title: Output Inductor Current
            component: L_OUT
            quantity: current
            data:
              - name: IL_out_rms
                spice_command: rms
                description: RMS output inductor current
        outputs:
          - var: Pin_avg
            formula: abs([Vin_avg]*[Iin_avg])
            description: Average input power
          - var: Pout_avg
            formula: '[Vout_avg]*[Iout_avg]'
            description: Average output power
          - var: P_L_out_cu
            formula: '[IL_out_rms]**2*{components.L_OUT.series_resistance}'
            description: Output inductor copper loss
          - var: efficiency_pct
            formula: 100*[Pout_avg]/[Pin_avg]
            description: Efficiency percentage
      - rid: tr_stress
        requirement: Switch peak voltage clamped to VIN by D1/D2; verify switches
          see no more than VIN
        criteria:
          sw_voltage_margin_pct: 20
          sw_current_margin_pct: 30
        measurement:
          - ref: VSW1
            plot:
              x_axis: time
              title: SW1 Drain Voltage (Clamped to VIN)
            component: SW1
            quantity: voltage
            nets:
              - - SW1
                - drain
              - - SW1
                - source
            data:
              - name: Vsw1_max
                spice_command: max
                description: Peak SW1 drain-source voltage
          - ref: VSW2
            plot: false
            component: SW2
            quantity: voltage
            nets:
              - - SW2
                - drain
              - - VIN
                - '-'
            data:
              - name: Vsw2_max
                spice_command: max
                description: Peak SW2 drain voltage
          - ref: ISW1_S
            plot: false
            component: SW1
            quantity: current
            data:
              - name: Isw1_peak
                spice_command: max
                description: Peak SW1 current
        outputs:
          - var: vsw1_max_v
            formula: '[Vsw1_max]'
            description: Peak SW1 drain-source voltage (should be <= VIN)
          - var: vsw2_max_v
            formula: '[Vsw2_max]'
            description: Peak SW2 drain voltage
          - var: isw1_peak_a
            formula: '[Isw1_peak]'
            description: Peak switch current
metadata:
  stage:
    - power_switch
    - isolation
    - rectification
    - filter
  topology: isolated
  control: PWM
  tags:
    - two-switch-forward
    - forward-converter
    - telecom
    - isolated
