  type: capacitor
  params:
    capacitance: 2200u
- ref: R_DC
  type: resistor
  params:
    resistance: 49.0
- ref: B_ERR
  type: b_source
  params:
    expression: 700 - v(V_DC)
- ref: B_P
  type: b_source
  params:
    expression: v(V_ERR) * 0.08
- ref: B_INT
  type: b_source
  params:
    source_type: i
    expression: 'v(V_I) >= 30.1 ? (v(V_ERR) > 0 ? 0 : 0.005 * v(V_ERR)) : (v(V_I) <= 0 ? (v(V_ERR) < 0 ? 0 : 0.005 * v(V_ERR)) : 0.005 * v(V_ERR))'
- ref: C_INT
  type: capacitor
  params:
    capacitance: 1.0e-05
- ref: R_INT
  type: resistor
  params:
    resistance: 10Meg
- ref: B_VERR_RAW
  type: b_source
  params:
    expression: '((v(V_ERR) * 0.08) + v(V_I)) > 30.1 ? 30.1 : (((v(V_ERR) * 0.08) + v(V_I)) < 0 ? 0 : ((v(V_ERR) * 0.08) + v(V_I)))'
- ref: R_MAG_FLT
  type: resistor
  params:
    resistance: 1k
- ref: C_MAG_FLT
  type: capacitor
  params:
