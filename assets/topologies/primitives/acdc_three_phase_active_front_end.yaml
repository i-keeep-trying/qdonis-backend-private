# Control (blocks): voltage PI 0.02 * err + 500 * integral (conditional anti-windup 0..30.1) -> clamp ->
# 1 ms filter = current amplitude; per phase: reference = amplitude * v_phase / 310.27, command =
# 10/350 * v_phase feed-forward - 0.1 * current error, clamped +-9.5, 10 us filter, bipolar PWM against a
# +-10 V 20 kHz triangle (0.2 V dead band, 15 V gate levels; top switch on while the command is above it).
# E1..E3 stay E sources: the high-side gate buffers float on the phase nodes.
# Sizing (chat-first 6b8f8dd): 0.1 mH EMI / 0.5 mH boost inductors, 5 mF bus starting at 700 V, neutral
# divider 10k / 10k from the bus, 1 us step.
id: acdc_three_phase_active_front_end
name: Three Phase Active Front End Rectifier
description: 3-Phase active boost rectifier with a full analog SPWM and PI control loop.
