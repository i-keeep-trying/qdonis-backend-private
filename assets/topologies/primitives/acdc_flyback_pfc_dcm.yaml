id: acdc_flyback_pfc_dcm
name: Flyback PFC DCM
description: Single-stage AC-DC flyback Power Factor Correction (PFC) converter operating
  in Discontinuous Conduction Mode (DCM). The AC line is rectified by a diode bridge
  into a small high-frequency input capacitor, so the flyback primary sees the rectified
  line voltage. With a constant on-time (fixed duty) in DCM the input current follows
  the line voltage, giving natural power factor correction. Output = Vpk * D * sqrt(R_LOAD
  / (4 * Lm * fsw)) averaged over the line cycle. The line source starts at its peak,
  the windings carry RC snubbers and the bus a bleeder resistor so the solver stays
  well-conditioned through the line zero crossings.
components:
- ref: GND
  type: node
  params:
    node_type: ground
- ref: VAC
  type: node
  role: input_source
  params:
    node_type: voltage_source
    source: sine
    offset: 0
    amplitude: 325
    frequency: 50
    phase: 90
- ref: R_LINE
  type: resistor
  role: line_impedance
  params:
    resistance: 0.1
- ref: DB1
  type: diode
  role: input_rectifier
  params:
    Is: 1.0e-11
    n: 1
    Rs: 0.01
    Cjo: 1.0e-11
    Tt: 0
- ref: DB2
  type: diode
  role: input_rectifier
  params:
    Is: 1.0e-11
    n: 1
    Rs: 0.01
    Cjo: 1.0e-11
    Tt: 0
- ref: DB3
  type: diode
  role: input_rectifier
  params:
    Is: 1.0e-11
    n: 1
    Rs: 0.01
    Cjo: 1.0e-11
    Tt: 0
- ref: DB4
  type: diode
  role: input_rectifier
  params:
    Is: 1.0e-11
    n: 1
    Rs: 0.01
    Cjo: 1.0e-11
    Tt: 0
- ref: CIN
  type: capacitor
  role: input_filter
  params:
    capacitance: 1.0e-06
- ref: R_BLEED
  type: resistor
  role: bus_bleeder
  params:
    resistance: 47000.0
- ref: PWM
  type: node
  role: pwm_control
  params:
    node_type: pwm_control
    frequency: 100000.0
    duty_cycle: 0.2
    vhigh: 10.0
    vlow: 0.0
    trise: 1e-8
    tfall: 1e-8
    tdelay: 0
- ref: SW
  type: switch
  role: power_switch
  params:
    model: sw_mod
- ref: R_SENSE
  type: resistor
  role: current_sense
  params:
    resistance: 0.1
- ref: T1
  type: transformer
  role: flyback_transformer
  params:
    Lm_primary: 0.0005
    turns_ratio: 0.1
    k_coupling: 0.985
    phase: same
    Rp: 1e-3
    Rs: 1e-3
    core_loss_resistance: 1e9
- ref: D1
  type: diode
  role: output_rectifier
  params:
    Is: 1e-11
    n: 1
    Rs: 0.01
    Cjo: 10e-12
    Tt: 0
- ref: R_SNUB_P
  type: resistor
  role: primary_snubber
  params:
    resistance: 22.0
- ref: C_SNUB_P
  type: capacitor
  role: primary_snubber
  params:
    capacitance: 2.2e-09
- ref: R_SNUB_S
  type: resistor
  role: secondary_snubber
  params:
    resistance: 100.0
- ref: C_SNUB_S
  type: capacitor
  role: secondary_snubber
  params:
    capacitance: 1.0e-09
- ref: Cout
  type: capacitor
  role: output_filter
  params:
    capacitance: 0.0022
    ic: 12
- ref: R_LOAD
  type: resistor
  role: load
  params:
    resistance: 4.8
nets:
- - - VAC
    - +
  - - R_LINE
    - pin1
- - - R_LINE
    - pin2
  - - DB1
    - anode
  - - DB3
    - cathode
- - - VAC
    - '-'
  - - DB2
    - anode
  - - DB4
    - cathode
- - - DB1
    - cathode
  - - DB2
    - cathode
  - - CIN
    - pos
  - - T1
    - P1
  - - C_SNUB_P
    - neg
  - - R_BLEED
    - pos
- - - T1
    - P2
  - - SW
    - pos
  - - R_SNUB_P
    - pos
- - - SW
    - neg
  - - R_SENSE
    - pos
- - - DB3
    - anode
  - - DB4
    - anode
  - - CIN
    - neg
  - - R_SENSE
    - neg
  - - PWM
    - neg
  - - SW
    - ctrl-
  - - T1
    - S1
  - - Cout
    - neg
  - - R_LOAD
    - neg
  - - GND
    - pin
  - - C_SNUB_S
    - neg
  - - R_BLEED
    - neg
- - - PWM
    - pos
  - - SW
    - ctrl+
- - - T1
    - S2
  - - D1
    - anode
  - - R_SNUB_S
    - pos
- - - D1
    - cathode
  - - Cout
    - pos
  - - R_LOAD
    - pos
- - - R_SNUB_P
    - neg
  - - C_SNUB_P
    - pos
- - - R_SNUB_S
    - neg
  - - C_SNUB_S
    - pos
analysis:
  transient:
    spice_settings:
      tstop: 0.06
      use_ic: true
      reltol: 0.005
      abstol: 1.0e-06
      vntol: 0.001
      itl4: 50
      method: gear
    requirements:
    - rid: tr_flyback_pfc_dcm
      requirement: 'Verify Flyback PFC operation in DCM: regulated output and line-following
        input current'
      measurement:
      - ref: VIN
        plot:
          x_axis: time
          title: AC Line Voltage
        quantity: voltage
        nets:
        - - VAC
          - +
        - - VAC
          - '-'
      - ref: IIN
        plot:
          x_axis: time
          title: AC Line Current
        component: R_LINE
        quantity: current
        data:
        - name: Iin_rms
          spice_command: rms
          description: RMS line current
      - ref: VOUT
        plot:
          x_axis: time
          title: Output Voltage
        quantity: voltage
        nets:
        - - R_LOAD
          - pos
        - - R_LOAD
          - neg
        data:
        - name: Vout_avg
          spice_command: avg
          description: Average Output Voltage
        - name: Vout_ripple_vpp
          spice_command: pp
          description: Output ripple peak-to-peak (twice line frequency)
      outputs:
      - var: vout_avg_v
        formula: abs([Vout_avg])
        description: Average Output Voltage
      - var: vout_ripple_vpp
        formula: '[Vout_ripple_vpp]'
        description: Output Voltage Ripple peak-to-peak
      - var: iin_rms_a
        formula: '[Iin_rms]'
        description: RMS line current
      environment:
      - ref: time_domain
        t_stop: 0.06
      criteria:
        target_vout: 12
  spice_settings:
    abstol: 1.0e-06
    vntol: 0.0001
metadata:
  stage:
  - pfc
  - rectifier
  topology: flyback_pfc_dcm
  control: open_loop_constant_on_time
  tags:
  - flyback
  - pfc
  - dcm
  - acdc
models:
- .model sw_mod SW(vt=5 vh=0.1 ron=0.1 roff=1MEG)
