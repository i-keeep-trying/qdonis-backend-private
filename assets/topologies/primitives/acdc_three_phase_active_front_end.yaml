- ref: B_ERR_A
  type: b_source
  params:
    expression: '((v(I_REF_A) - v(V_IACT_A)) * 20) > 12 ? 12 : (((v(I_REF_A) - v(V_IACT_A))
      * 20) < -12 ? -12 : ((v(I_REF_A) - v(V_IACT_A)) * 20))'
- ref: B_ERR_B
