id: dcac_neutral_point_clamped
name: Three-Phase 3-Level NPC Inverter (Closed-Loop AC Inverter via PD PWM)
description: Three-phase three-level Neutral Point Clamped (NPC) inverter with closed-loop AC voltage regulation via Phase
  Disposition (PD) PWM and continuous-time PI control with voltage feed-forward. Converts a stiff 800V split-rail DC link
  (two 400V rails anchored at midpoint neutral n6) to a clean 380V line-to-line RMS (310.27V peak line-to-neutral) 50Hz sinusoidal
  AC output across star-connected 2.888 Ohm loads (50kW total). Each phase leg uses four NMOS switches (SW1-SW4) and two clamping
  diodes (D_CLAMP_P, D_CLAMP_N) producing three voltage levels (+400V, 0V, -400V) at switch node n5 relative to midpoint n6,
  with 10kHz carrier triangle modulation and 500ns interlocking dead-time delay.
models:
- '* Device Models'
- .model SCTHC250N120G_NMOS NMOS(Vto=3 Lambda=0.01 Kp=14.706 Cbd=0.6n Cbs=0.6n Cgdo=0.6n Is=1e-14 Rs=0.0085)
- .model Dmodel D(Is=1e-12 n=1.1 Rs=0.001 Cjo=5e-11 Bv=750 Ibv=1e-06)
