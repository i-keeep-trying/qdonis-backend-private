  params:
    resistance: 10
- ref: M_B_TOP
  type: transistor
  params:
    family: mosfet
    type: nmos
    mode: enhancement
    model: sic_mosfet
    part_number: C3M0015065D
    rds_on: 0.015
    tr: 1.0e-08
- ref: D2
  type: diode
  params:
