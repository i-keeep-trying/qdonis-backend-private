    source: dc
    voltage: 380
    series_resistance: 0.01
- ref: VTRI
  type: node
  role: carrier_source
  params:
    node_type: voltage_source
    source: pulse
    v1: -10
    v2: 10
    td: 0
    tr: 0.03124m
    tf: 0.03124m
    pw: 0.00002m
    per: 0.0625m
    series_resistance: 0
- ref: VREF
  type: node
  role: reference_source
  params:
    node_type: voltage_source
    source: sine
    offset: 0
    amplitude: 8
    frequency: 50
    series_resistance: 0

# Bipolar sine-triangle PWM (blocks): leg B uses the inverted reference; the ground-referenced gate drives
# (S2, S4) as gain blocks, the high-side ones E1 / E5 (floating on OUT1 / OUT2) stay E sources.
- ref: INV_B
  type: gain
  role: leg_b_reference
  params:
    gain: -1

- ref: CMP_1
  type: comparator
  role: s1_pwm
  params:
    high: 1
    low: 0
    width: 0.001

- ref: CMP_2
  type: comparator
  role: s2_pwm
  params:
    high: 1
    low: 0
    width: 0.001

- ref: CMP_3
  type: comparator
  role: s3_pwm
  params:
    high: 1
    low: 0
    width: 0.001

- ref: CMP_4
  type: comparator
  role: s4_pwm
  params:
    high: 1
    low: 0
    width: 0.001

- ref: DRV_2
  type: gain
  role: s2_gate_drive
  params:
    gain: 15

- ref: DRV_4
  type: gain
  role: s4_gate_drive
  params:
    gain: 15

- ref: E1
  type: e_source
  params:
    gain: 15
- ref: R1
