  - - SUM_FC
    - out
  - - LIM_IC
    - in
analysis:
  transient:
    requirements:
    - rid: tr_afe_rectifier
      requirement: Verify 3-phase Active Front End boost rectification to 700V DC.
      environment:
      - ref: time_domain
        t_step: 1.0e-06
        t_stop: 0.05
        t_start: 0.04
        t_max_step: 1.0e-06
      measurement:
      - ref: VOUT
        plot:
          x_axis: time
          title: Output DC Voltage
        quantity: voltage
        component: R_DC
        nets:
        - - R_DC
          - pos
        - - R_DC
          - neg
        data:
        - name: Vout_avg
          spice_command: avg
          description: Average Output Voltage
          from: 0.04
          to: 0.05
      outputs:
      - var: vout_avg_v
        formula: abs([Vout_avg])
        description: Average Output Voltage
      criteria:
        target_vout: 700.0
        tolerance_pct: 5.0
    spice_settings:
      use_ic: true
      method: trap
      trtol: 7
      ic: v(V_DC)=700 v(V_I)=21.5 v(I_MAG)=21.5
models:
- .model dmodel1 D(Is=1e-12 n=1.1 Rs=0.001 Cjo=5e-11 Bv=1200 Ibv=1e-06)
- .model sic_mosfet NMOS(Vto=3 Lambda=0.01 Kp=8.333 Cbd=0.3n Cbs=0.3n Cgdo=0.3n Is=1e-14 Rs=0.015)
