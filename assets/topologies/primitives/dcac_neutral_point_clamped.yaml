analysis:
  spice_settings:
    rshunt: 1000000000000.0
    cshunt: 1.0e-12
    reltol: 0.01
    abstol: 1.0e-09
    vntol: 1.0e-05
    chgtol: 1.0e-11
    gmin: 1.0e-10
    method: gear
    maxord: 2
    trtol: 4
  transient:
    spice_settings:
      tstop: 0.1
      use_ic: true
      reltol: 0.01
      abstol: 1.0e-09
      vntol: 1.0e-05
      chgtol: 1.0e-11
      gmin: 1.0e-10
      method: gear
      maxord: 2
      trtol: 4
    requirements:
    - rid: tr_vout
      requirement: Three-level AC output voltage at load; verify phase and line-to-line voltage levels
      criteria:
        vdc_half_v: 400
        fundamental_freq_hz: 50
      environment:
      - ref: time_domain
        t_step: 4.0e-06
        t_stop: 0.1
        t_max_step: 1.0e-05
      measurement:
      - ref: VOUT_A
        plot:
          x_axis: time
          title: Phase A Output Voltage (Line-to-Neutral)
        component: R_LOAD_a
        quantity: voltage
        nets:
        - - R_LOAD_a
          - pos
        - - R_LOAD_a
          - neg
        data:
        - name: Vout_A_max
          spice_command: max
          description: Peak positive output voltage Phase A
        - name: Vout_A_min
          spice_command: min
          description: Peak negative output voltage Phase A
        - name: Vout_A_rms
          spice_command: rms
          description: RMS phase output voltage Phase A
      - ref: VOUT_B
        plot:
          x_axis: time
          title: Phase B Output Voltage (Line-to-Neutral)
        component: R_LOAD_b
        quantity: voltage
        nets:
        - - R_LOAD_b
          - pos
        - - R_LOAD_b
          - neg
        data:
        - name: Vout_B_rms
          spice_command: rms
          description: RMS phase output voltage Phase B
      - ref: VOUT_C
        plot:
          x_axis: time
          title: Phase C Output Voltage (Line-to-Neutral)
        component: R_LOAD_c
        quantity: voltage
        nets:
        - - R_LOAD_c
          - pos
        - - R_LOAD_c
          - neg
        data:
        - name: Vout_C_rms
          spice_command: rms
          description: RMS phase output voltage Phase C
      - ref: VOUT_RAW_A
        plot:
          x_axis: time
          title: Phase A Switch Node Voltage (Shows +400V, 0V, -400V)
        component: L_FILT_a
        quantity: voltage
        nets:
        - - L_FILT_a
          - pos
        - - R_GND_ANCHOR
          - pos
        data:
        - name: Vraw_a_max
          spice_command: max
          description: Peak raw output voltage vs NPC midpoint
        - name: Vraw_a_min
          spice_command: min
          description: Minimum raw output voltage vs NPC midpoint
      - ref: ILOAD_A
        plot:
          x_axis: time
          title: Phase A Load Current
        component: R_LOAD_a
        quantity: current
        data:
        - name: Iload_A_rms
          spice_command: rms
          description: RMS Phase A load current
      - ref: ILOAD_B
        plot:
          x_axis: time
          title: Phase B Load Current
        component: R_LOAD_b
        quantity: current
        data:
        - name: Iload_B_rms
          spice_command: rms
          description: RMS Phase B load current
      - ref: ILOAD_C
        plot:
          x_axis: time
          title: Phase C Load Current
        component: R_LOAD_c
        quantity: current
        data:
        - name: Iload_C_rms
          spice_command: rms
          description: RMS Phase C load current
      outputs:
      - var: vout_ll_rms_v
        formula: '[Vout_A_rms]*sqrt(3)'
        description: Equivalent line-to-line RMS output voltage of the three-phase inverter (phase RMS x sqrt(3))
      - var: vout_a_rms_v
        formula: '[Vout_A_rms]'
        description: RMS phase (line-to-neutral) output voltage after LC filter
      - var: vout_peak_v
        formula: '[Vout_A_max]'
        description: Peak AC output voltage after LC filter
      - var: iload_a_rms_a
        formula: '[Iload_A_rms]'
        description: Phase A RMS load current
      - var: iload_b_rms_a
        formula: '[Iload_B_rms]'
        description: Phase B RMS load current
      - var: iload_c_rms_a
        formula: '[Iload_C_rms]'
        description: Phase C RMS load current
    - rid: tr_clamp
      requirement: Clamping diode stress in Phase A
      criteria:
        vc_target_v: 400
      environment:
      - ref: time_domain
        t_step: 4.0e-06
        t_stop: 0.1
        t_max_step: 1.0e-05
      measurement:
      - ref: ID_CLAMP_P_A
        plot:
          x_axis: time
          title: Phase A Upper Clamping Diode Current
        component: D_CLAMP_P_a
        quantity: current
        data:
        - name: Id_clamp_p_a_max
          spice_command: max
          description: Peak upper clamping diode forward current
      - ref: ID_CLAMP_N_A
        plot:
          x_axis: time
          title: Phase A Lower Clamping Diode Current
        component: D_CLAMP_N_a
        quantity: current
        data:
        - name: Id_clamp_n_a_max
          spice_command: max
          description: Peak lower clamping diode forward current
      outputs:
      - var: id_clamp_p_peak_a
        formula: '[Id_clamp_p_a_max]'
        description: Peak upper clamping diode current
      - var: id_clamp_n_peak_a
        formula: '[Id_clamp_n_a_max]'
        description: Peak lower clamping diode current
    - rid: tr_stress
      requirement: Switch voltage stress; outer devices (SW1_a, SW4_a) should see at most 400V
      criteria:
        outer_sw_voltage_max_v: 400
      environment:
      - ref: time_domain
        t_step: 4.0e-06
        t_stop: 0.1
        t_max_step: 1.0e-05
      measurement:
      - ref: VSW1_A_DS
        plot:
          x_axis: time
          title: SW1_a Drain-Source Voltage Stress
        component: SW1_a
        quantity: voltage
        nets:
        - - SW1_a
          - drain
        - - SW1_a
          - source
        data:
        - name: Vsw1_a_max
          spice_command: max
          description: Peak SW1_a drain-source voltage
      - ref: VSW4_A_DS
        plot:
          x_axis: time
          title: SW4_a Drain-Source Voltage Stress
        component: SW4_a
        quantity: voltage
        nets:
        - - SW4_a
          - drain
        - - SW4_a
          - source
        data:
        - name: Vsw4_a_max
          spice_command: max
          description: Peak SW4_a drain-source voltage
      outputs:
      - var: vsw1_a_max_v
        formula: '[Vsw1_a_max]'
        description: Peak outer upper switch voltage stress Phase A
      - var: vsw4_a_max_v
        formula: '[Vsw4_a_max]'
        description: Peak outer lower switch voltage stress Phase A
