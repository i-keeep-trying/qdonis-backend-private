id: acdc_centre_tapped_full_wave
name: Centre Tapped Full Wave Rectifier
description: Full wave rectifier utilizing a centre-tapped secondary transformer.
components:
  - ref: GND
    type: node
    params:
      node_type: ground
  - ref: VAC
    type: node
    role: voltage_source
    params:
      node_type: voltage_source
      source: sine
      offset: 0
      amplitude: 24
      frequency: 160
  - ref: R_IN
    type: resistor
    params:
      resistance: 1.0
  - ref: TX
    type: dual_ct_transformer
    params:
      Lm_primary: 0.01
      turns_ratio: 2.0
      k_coupling: 1.0
      phase_s1: same
      phase_s2: opposite
  - ref: D1
    type: diode
    params:
      Is: 3.17e-05
      Rs: 0.051
      n: 1.373
      Cjo: 1.6e-10
      Tt: 0
  - ref: D2
    type: diode
    params:
      Is: 3.17e-05
      Rs: 0.051
      n: 1.373
      Cjo: 1.6e-10
      Tt: 0
  - ref: R_LOAD
    type: resistor
    params:
      resistance: 10.0
nets:
  - - - GND
      - pin
    - - TX
      - CT_S
    - - R_LOAD
      - neg
  - - - VAC
      - +
    - - R_IN
      - pin2
  - - - VAC
      - '-'
    - - TX
      - P1
  - - - R_IN
      - pin1
    - - TX
      - P2
  - - - TX
      - S1
    - - D1
      - anode
  - - - TX
      - S2
    - - D2
      - anode
  - - - D1
      - cathode
    - - D2
      - cathode
    - - R_LOAD
      - pos
  - - - TX
      - CT_P
analysis:
  transient:
    requirements:
      - rid: tr_centre_tapped_fw
        requirement: Verify full wave rectification via centre-tapped secondary.
        criteria:
          target_vout: 13.0
        environment:
          - ref: time_domain
            t_step: 1.0e-06
            t_stop: 0.1
            t_start: 0.05
            t_max_step: 1.0e-06
        measurement:
          - ref: VOUT
            plot: true
            quantity: voltage
            nets:
              - - R_LOAD
                - pos
              - - R_LOAD
                - neg
            data:
              - name: Vout_avg
                spice_command: avg
                description: Average Output Voltage in steady state
        outputs:
          - var: vout_avg_v
            formula: abs([Vout_avg])
            description: Average Output Voltage
schematic:
  tuned: true
  components:
    D1: {x: 460, y: 80, rotation: 270}
    D2: {x: 460, y: 320, rotation: 270}
    GND: {x: 360, y: 280, rotation: 0}
    R_IN: {x: 140, y: 300, rotation: 90}
    R_LOAD: {x: 660, y: 120, rotation: 0}
    TX: {x: 300, y: 200, rotation: 0}
    VAC: {x: 0, y: 200, rotation: 180}
  wires:
  - {id: W1, from: GND.P, to: TX.SCT, path: [[360, 260], [360, 200], [340, 200], [340, 200], [320, 200]]}
  - {id: W2, from: GND.P, to: R_LOAD.B, path: [[360, 260], [360, 200], [660, 200], [660, 160]]}
  - {id: W3, from: R_IN.B, to: VAC.A}
  - {id: W4, from: TX.P1, to: VAC.B}
  - {id: W5, from: R_IN.A, to: TX.P2}
  - {id: W6, from: D1.A, to: TX.S1}
  - {id: W7, from: D2.A, to: TX.S2}
  - {id: W8, from: D1.B, to: R_LOAD.A, path: [[500, 80], [600, 80], [600, 80], [660, 80], [660, 80]]}
  - {id: W9, from: D1.B, to: D2.B}
  groups: {}
