# Control (blocks): voltage PI 0.3 * err + 20 * integral, clamped 0..80 = current amplitude (15 kW needs ~62 A);
# per phase: reference = amplitude * |v_grid| / 170, duty = 1 - |v_grid| / (Vdc / 2) + 0.01 * current error, clamped
# 0.02..0.98, PWM against a 0..1 V 20 kHz triangle (smooth 20 V switch drive). Sensed currents |i| through a 20 us
# filter (switching ripple only).
# Until 2026-10-11: ki 0.05 (effectively P-only), clamp 50 A, a fixed 400 V half-bus in the feed-forward and a 1 ms
# current filter (18 deg lag at 50 Hz): the bus settled at 617 V.
- ref: SUM_VDC
  type: sum
  role: dc_bus_voltage_sense
  params:
    signs: "+-"

- ref: REF_V
  type: const
  role: voltage_reference
  params:
    value: 800

- ref: SUM_V
  type: sum
  role: voltage_error
  params:
    signs: "+-"

- ref: KP_V
  type: gain
  role: voltage_p
  params:
    gain: 0.3

- ref: INT_V
  type: integrator
  role: voltage_i
  params:
    ki: 20
    ic: 62  # steady-state current amplitude at 15 kW
    lower: 0
    upper: 80

- ref: SUM_PI
  type: sum
  role: voltage_pi_sum
  params:
    signs: "++"

- ref: LIM_PI
  type: limiter
  role: current_amplitude_clamp
  params:
    lower: 0
    upper: 80

- ref: CAR
  type: carrier
  role: pwm_carrier
  params:
    frequency: 20000.0
    low: 0
    high: 1
    shape: "triangle"

- ref: SUM_VA
  type: sum
  role: phase_a_voltage_sense
  params:
    signs: "+-"

- ref: ABS_A
  type: function
  role: phase_a_rectified_voltage
  params:
    expression: "abs(in1)"
    inputs: 1

- ref: I_SENSE_A
  type: function
  role: phase_a_current_sense
  params:
    expression: "abs(I(V_SENSE_A))"
    inputs: 0

- ref: LPF_IA
  type: lowpass
  role: phase_a_current_filter
  params:
    tau: 2.0e-05

- ref: REF_A
  type: product
  role: phase_a_current_reference
  params:
    gain: "1/170.0"

- ref: FF_A
  type: function
  role: phase_a_duty_feedforward
  params:
    expression: "1-2*in1/max(in2,100)"
    inputs: 2

- ref: SUM_IA
  type: sum
  role: phase_a_current_error
  params:
    signs: "+-"

- ref: KP_IA
  type: gain
  role: phase_a_current_p
  params:
    gain: 0.01

- ref: SUM_DA
  type: sum
  role: phase_a_duty
  params:
    signs: "++"

- ref: LIM_DA
  type: limiter
  role: phase_a_duty_clamp
  params:
    lower: 0.02
    upper: 0.98

- ref: CMP_A
  type: comparator
  role: phase_a_pwm
  params:
    high: 20
    low: 0
    width: 0.001

- ref: SUM_VB
  type: sum
  role: phase_b_voltage_sense
  params:
    signs: "+-"

- ref: ABS_B
  type: function
  role: phase_b_rectified_voltage
  params:
    expression: "abs(in1)"
    inputs: 1

- ref: I_SENSE_B
  type: function
  role: phase_b_current_sense
  params:
    expression: "abs(I(V_SENSE_B))"
    inputs: 0

- ref: LPF_IB
  type: lowpass
  role: phase_b_current_filter
  params:
    tau: 2.0e-05

- ref: REF_B
  type: product
  role: phase_b_current_reference
  params:
    gain: "1/170.0"

- ref: FF_B
  type: function
  role: phase_b_duty_feedforward
  params:
    expression: "1-2*in1/max(in2,100)"
    inputs: 2

- ref: SUM_IB
  type: sum
  role: phase_b_current_error
  params:
    signs: "+-"

- ref: KP_IB
  type: gain
  role: phase_b_current_p
  params:
    gain: 0.01

- ref: SUM_DB
  type: sum
  role: phase_b_duty
  params:
    signs: "++"

- ref: LIM_DB
  type: limiter
  role: phase_b_duty_clamp
  params:
    lower: 0.02
    upper: 0.98

- ref: CMP_B
  type: comparator
  role: phase_b_pwm
  params:
    high: 20
    low: 0
    width: 0.001

- ref: SUM_VC
  type: sum
  role: phase_c_voltage_sense
  params:
    signs: "+-"

- ref: ABS_C
  type: function
  role: phase_c_rectified_voltage
  params:
    expression: "abs(in1)"
    inputs: 1

- ref: I_SENSE_C
  type: function
  role: phase_c_current_sense
  params:
    expression: "abs(I(V_SENSE_C))"
    inputs: 0

- ref: LPF_IC
  type: lowpass
  role: phase_c_current_filter
  params:
    tau: 2.0e-05

- ref: REF_C
  type: product
  role: phase_c_current_reference
  params:
    gain: "1/170.0"

- ref: FF_C
  type: function
  role: phase_c_duty_feedforward
  params:
    expression: "1-2*in1/max(in2,100)"
    inputs: 2

- ref: SUM_IC
  type: sum
  role: phase_c_current_error
  params:
    signs: "+-"

- ref: KP_IC
  type: gain
  role: phase_c_current_p
  params:
    gain: 0.01

- ref: SUM_DC
  type: sum
  role: phase_c_duty
  params:
    signs: "++"

- ref: LIM_DC
  type: limiter
  role: phase_c_duty_clamp
  params:
    lower: 0.02
    upper: 0.98

- ref: CMP_C
  type: comparator
  role: phase_c_pwm
  params:
    high: 20
    low: 0
    width: 0.001

