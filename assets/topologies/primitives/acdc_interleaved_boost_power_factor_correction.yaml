id: acdc_interleaved_boost_power_factor_correction
name: Interleaved Boost Power Factor Correction Rectifier
description: A 100kHz interleaved dual-phase boost Power Factor Correction (PFC) rectifier converting 230V RMS AC (325V peak) to 385V DC at ~370W load with input LC EMI filter, dual interleaved switching branches operating 180 degrees out-of-phase, and closed-loop average current mode control.

models:
  - ".model dmodel1 D(Rs=0.01)"
  - ".model power_nmos VDMOS(Ron=0.04 Vto=3.5 Kp=60 Cgdmax=15p Cgdmin=1p Cgs=150p)"

components:
  # Ground reference and semantic net labels
  - ref: GND
    type: node
    params:
      node_type: ground

  - ref: a
    type: node
    params:
      node_type: label

  - ref: b
    type: node
    params:
      node_type: label

  - ref: a_filt
    type: node
    params:
      node_type: label

  - ref: d
    type: node
    params:
      node_type: label

  - ref: L1_node
    type: node
    params:
      node_type: label

  - ref: e1
    type: node
    params:
      node_type: label

  - ref: ctrl_gate1
    type: node
    params:
      node_type: label

  - ref: ctrl1
    type: node
    params:
      node_type: label

  - ref: L2_node
    type: node
    params:
      node_type: label

  - ref: e2
    type: node
    params:
      node_type: label

  - ref: ctrl_gate2
    type: node
    params:
      node_type: label

  - ref: ctrl2
    type: node
    params:
      node_type: label

  - ref: VOUT
    type: node
    params:
      node_type: label

  - ref: VFB
    type: node
    params:
      node_type: label

  - ref: VREF_NODE
    type: node
    params:
      node_type: label

  - ref: V_RAW
    type: node
    params:
      node_type: label

  - ref: V_ERR
    type: node
    params:
      node_type: "label"

  - ref: V_AC_ABS
    type: node
    params:
      node_type: "label"

  - ref: C_ERR1
    type: node
    params:
      node_type: "label"

  - ref: C_ERR2
    type: node
    params:
      node_type: "label"

  - ref: V_CLAMP
    type: node
    params:
      node_type: label

  - ref: V_COMP
    type: node
    params:
      node_type: label

  - ref: I_TARGET
    type: node
    params:
      node_type: label

  - ref: I_ACT1
    type: node
    params:
      node_type: label

  - ref: C_RAW1
    type: node
    params:
      node_type: label

  - ref: C_CLAMP1
    type: node
    params:
      node_type: label

  - ref: C_COMP1
    type: node
    params:
      node_type: label

  - ref: I_ACT2
    type: node
    params:
      node_type: label

  - ref: C_RAW2
    type: node
    params:
      node_type: label

  - ref: C_CLAMP2
    type: node
    params:
      node_type: label

  - ref: C_COMP2
    type: node
    params:
      node_type: label

  - ref: VTRI1
    type: node
    params:
      node_type: label

  - ref: VTRI2
    type: node
    params:
      node_type: label

  # AC Input Source (230V RMS = 325V peak, 50Hz)
  - ref: VAC
    type: node
    role: voltage_source
    params:
      node_type: voltage_source
      source: sine
      offset: 0
      amplitude: 325
      frequency: 50
      delay: 0
      damping: 0
      phase: 0
      series_resistance: 0

  # High impedance ground reference resistors for floating AC input
  - ref: Ra
    type: resistor
    params:
      resistance: 10000000.0
      sense: false

  - ref: Rb
    type: resistor
    params:
      resistance: 10000000.0
      sense: false

  # LC EMI Filter
  - ref: L_EMI
    type: inductor
    params:
      inductance: 0.002
      sense: false

  - ref: C_EMI
    type: capacitor
    params:
      capacitance: 4.7e-07
      sense: false

  - ref: R_filt
    type: resistor
    params:
      resistance: 10000000.0
      sense: false

  # Bridge Rectifier
  - ref: D1
    type: diode
    params:
      model: dmodel1
      sense: false

  - ref: D2
    type: diode
    params:
      model: dmodel1
      sense: false

  - ref: D3
    type: diode
    params:
      model: dmodel1
      sense: false

  - ref: D4
    type: diode
    params:
      model: dmodel1
      sense: false

  - ref: C_BYPASS
    type: capacitor
    params:
      capacitance: 1.0e-08
      sense: false

  # === Interleaved Phase 1 ===
  - ref: L1
    type: inductor
    params:
      inductance: 0.003
      sense: false

  - ref: VSENSE1
    type: node
    role: voltage_source
    params:
      node_type: voltage_source
      source: dc
      voltage: 0
      series_resistance: 0

  - ref: C_S1
    type: capacitor
    params:
      capacitance: 1.0e-09
      sense: false

  - ref: R_S1
    type: resistor
    params:
      resistance: 1000000.0
      sense: false

  - ref: M1
    type: transistor
    params:
      family: vdmos
      model: power_nmos
      sense: false

  - ref: R_gate1
    type: resistor
    params:
      resistance: 10.0
      sense: false

  - ref: R_GS1
    type: resistor
    params:
      resistance: 100000.0
      sense: false

  - ref: D5
    type: diode
    params:
      model: dmodel1
      sense: false

  # === Interleaved Phase 2 ===
  - ref: L2
    type: inductor
    params:
      inductance: 0.003
      sense: false

  - ref: VSENSE2
    type: node
    role: voltage_source
    params:
      node_type: voltage_source
      source: dc
      voltage: 0
      series_resistance: 0

  - ref: C_S2
    type: capacitor
    params:
      capacitance: 1.0e-09
      sense: false

  - ref: R_S2
    type: resistor
    params:
      resistance: 1000000.0
      sense: false

  - ref: M2
    type: transistor
    params:
      family: vdmos
      model: power_nmos
      sense: false

  - ref: R_gate2
    type: resistor
    params:
      resistance: 10.0
      sense: false

  - ref: R_GS2
    type: resistor
    params:
      resistance: 100000.0
      sense: false

  - ref: D6
    type: diode
    params:
      model: dmodel1
      sense: false

  # Output bulk capacitor (470uF) & Load (400 Ohm)
  - ref: C1
    type: capacitor
    params:
      capacitance: 0.00047
      sense: false

  - ref: R1
    type: resistor
    role: load
    params:
      resistance: 400.0
      sense: false

  # Control Loop 1: Voltage Divider (Target 385V -> 5V FB)
  - ref: R2
    type: resistor
    params:
      resistance: 760000.0
      sense: false

  - ref: R3
    type: resistor
    params:
      resistance: 10000.0
      sense: false

  # Control Loop 2: Voltage loop (control blocks): 5V reference - VFB -> gain 100 -> clamp 0..5V -> 10ms lag
  # Control Loop 3: Multiplier: current reference = 0.0015 * |v_ac| * voltage-loop output
  - ref: REF_V
    type: const
    role: voltage_reference
    params:
      value: 5.0

  - ref: SUM_V
    type: sum
    role: voltage_error
    params:
      signs: "+-"

  - ref: K_V
    type: gain
    role: voltage_error_amp
    params:
      gain: 100.0

  - ref: LIM_V
    type: limiter
    role: voltage_error_clamp
    params:
      lower: 0
      upper: 5

  - ref: LPF_V
    type: lowpass
    role: voltage_compensator
    params:
      tau: 0.01
      ic: 2.5

  - ref: ABS_VIN
    type: function
    role: rectified_line_voltage
    params:
      expression: "abs(in1-in2)"
      inputs: 2

  - ref: MULT
    type: product
    role: current_reference_multiplier
    params:
      gain: 0.0015

  # Control Loop 4: Phase 1 current loop: reference - sensed current -> gain 100 -> clamp 0.1..4.8V -> 22us lag
  - ref: I_SENSE1
    type: function
    role: phase1_current_sense
    params:
      expression: "I(VSENSE1)"
      inputs: 0

  - ref: SUM_C1
    type: sum
    role: phase1_current_error
    params:
      signs: "+-"

  - ref: K_C1
    type: gain
    role: phase1_current_error_amp
    params:
      gain: 100.0

  - ref: LIM_C1
    type: limiter
    role: phase1_current_error_clamp
    params:
      lower: 0.1
      upper: 4.8

  - ref: LPF_C1
    type: lowpass
    role: phase1_current_compensator
    params:
      tau: 2.2e-05
      ic: 2.5

  # Control Loop 4: Phase 2 current loop: reference - sensed current -> gain 100 -> clamp 0.1..4.8V -> 22us lag
  - ref: I_SENSE2
    type: function
    role: phase2_current_sense
    params:
      expression: "I(VSENSE2)"
      inputs: 0

  - ref: SUM_C2
    type: sum
    role: phase2_current_error
    params:
      signs: "+-"

  - ref: K_C2
    type: gain
    role: phase2_current_error_amp
    params:
      gain: 100.0

  - ref: LIM_C2
    type: limiter
    role: phase2_current_error_clamp
    params:
      lower: 0.1
      upper: 4.8

  - ref: LPF_C2
    type: lowpass
    role: phase2_current_compensator
    params:
      tau: 2.2e-05
      ic: 2.5

  # Control Loop 5: Interleaved 100kHz PWM (Carrier 1: 0 delay, Carrier 2: 5µs delay = 180 deg)
  - ref: V_TRI1
    type: node
    role: voltage_source
    params:
      node_type: voltage_source
      source: pulse
      v1: 0
      v2: 5
      td: 0
      tr: 9.5e-06
      tf: 5.0e-07
      pw: 0
      per: 1.0e-05
      series_resistance: 0

  - ref: V_TRI2
    type: node
    role: voltage_source
    params:
      node_type: voltage_source
      source: pulse
      v1: 0
      v2: 5
      td: 5.0e-06
      tr: 9.5e-06
      tf: 5.0e-07
      pw: 0
      per: 1.0e-05
      series_resistance: 0

  - ref: CMP1
    type: comparator
    role: phase1_pwm_comparator
    params:
      high: 15
      low: 0
      width: 1.0e-06  # hard switching, like the original V(a) > V(b) ? high : low

  - ref: CMP2
    type: comparator
    role: phase2_pwm_comparator
    params:
      high: 15
      low: 0
      width: 1.0e-06  # hard switching, like the original V(a) > V(b) ? high : low



nets:
  # Ground reference net (0)
  - - - GND
      - pin
    - - Ra
      - neg
    - - Rb
      - neg
    - - R_filt
      - neg
    - - D1
      - anode
    - - D3
      - anode
    - - C_BYPASS
      - neg
    - - C_S1
      - neg
    - - R_S1
      - neg
    - - M1
      - source
    - - R_GS1
      - neg
    - - C_S2
      - neg
    - - R_S2
      - neg
    - - M2
      - source
    - - R_GS2
      - neg
    - - C1
      - neg
    - - R1
      - neg
    - - R3
      - neg
    - - V_TRI1
      - '-'
    - - V_TRI2
      - '-'

  # Net a (AC input L before filter)
  - - - a
      - pin
    - - VAC
      - +
    - - Ra
      - pos
    - - L_EMI
      - pos
    - - ABS_VIN
      - in1

  # Net b (AC input N)
  - - - b
      - pin
    - - VAC
      - '-'
    - - Rb
      - pos
    - - C_EMI
      - neg
    - - D3
      - cathode
    - - D4
      - anode
    - - ABS_VIN
      - in2

  # Net a_filt (Filtered AC input L)
  - - - a_filt
      - pin
    - - L_EMI
      - neg
    - - C_EMI
      - pos
    - - R_filt
      - pos
    - - D1
      - cathode
    - - D2
      - anode

  # Net d (Rectified bus)
  - - - d
      - pin
    - - D2
      - cathode
    - - D4
      - cathode
    - - C_BYPASS
      - pos
    - - L1
      - pos
    - - L2
      - pos

  # Net L1_node (Phase 1 inductor to sense)
  - - - L1_node
      - pin
    - - L1
      - neg
    - - VSENSE1
      - +

  # Net e1 (Phase 1 switch drain)
  - - - e1
      - pin
    - - VSENSE1
      - '-'
    - - C_S1
      - pos
    - - R_S1
      - pos
    - - M1
      - drain
    - - D5
      - anode

  # Net ctrl_gate1 (Phase 1 gate)
  - - - ctrl_gate1
      - pin
    - - M1
      - gate
    - - R_gate1
      - neg
    - - R_GS1
      - pos

  # Net ctrl1 (Phase 1 PWM output)
  - - - ctrl1
      - pin
    - - R_gate1
      - pos
    - - CMP1
      - out

  # Net L2_node (Phase 2 inductor to sense)
  - - - L2_node
      - pin
    - - L2
      - neg
    - - VSENSE2
      - +

  # Net e2 (Phase 2 switch drain)
  - - - e2
      - pin
    - - VSENSE2
      - '-'
    - - C_S2
      - pos
    - - R_S2
      - pos
    - - M2
      - drain
    - - D6
      - anode

  # Net ctrl_gate2 (Phase 2 gate)
  - - - ctrl_gate2
      - pin
    - - M2
      - gate
    - - R_gate2
      - neg
    - - R_GS2
      - pos

  # Net ctrl2 (Phase 2 PWM output)
  - - - ctrl2
      - pin
    - - R_gate2
      - pos
    - - CMP2
      - out

  # Net VOUT (Regulated 385V DC output)
  - - - VOUT
      - pin
    - - D5
      - cathode
    - - D6
      - cathode
    - - C1
      - pos
    - - R1
      - pos
    - - R2
      - pos

  # Net VFB (Feedback voltage ~5V)
  - - - VFB
      - pin
    - - R2
      - neg
    - - R3
      - pos
    - - SUM_V
      - in2

  # Net VREF_NODE (Reference 5V)
  - - - VREF_NODE
      - pin
    - - REF_V
      - out
    - - SUM_V
      - in1

  # Net V_RAW (Voltage error amp unconstrained output)
  - - - V_RAW
      - pin
    - - K_V
      - out
    - - LIM_V
      - in

  # Net V_CLAMP (Voltage error amp clamped output)
  - - - V_CLAMP
      - pin
    - - LIM_V
      - out
    - - LPF_V
      - in

  # Net V_COMP (Voltage error compensation filtered output)
  - - - V_COMP
      - pin
    - - LPF_V
      - out
    - - MULT
      - in2

  # Net I_TARGET (Multiplier current demand reference)
  - - - I_TARGET
      - pin
    - - MULT
      - out
    - - SUM_C1
      - in1
    - - SUM_C2
      - in1

  # Net I_ACT1 (Phase 1 sensed current signal)
  - - - I_ACT1
      - pin
    - - I_SENSE1
      - out
    - - SUM_C1
      - in2

  # Net C_RAW1 (Phase 1 current error amp unconstrained output)
  - - - C_RAW1
      - pin
    - - K_C1
      - out
    - - LIM_C1
      - in

  # Net C_CLAMP1 (Phase 1 current error amp clamped output)
  - - - C_CLAMP1
      - pin
    - - LIM_C1
      - out
    - - LPF_C1
      - in

  # Net C_COMP1 (Phase 1 current error compensation filtered output)
  - - - C_COMP1
      - pin
    - - LPF_C1
      - out
    - - CMP1
      - inp

  # Net I_ACT2 (Phase 2 sensed current signal)
  - - - I_ACT2
      - pin
    - - I_SENSE2
      - out
    - - SUM_C2
      - in2

  # Net C_RAW2 (Phase 2 current error amp unconstrained output)
  - - - C_RAW2
      - pin
    - - K_C2
      - out
    - - LIM_C2
      - in

  # Net C_CLAMP2 (Phase 2 current error amp clamped output)
  - - - C_CLAMP2
      - pin
    - - LIM_C2
      - out
    - - LPF_C2
      - in

  # Net C_COMP2 (Phase 2 current error compensation filtered output)
  - - - C_COMP2
      - pin
    - - LPF_C2
      - out
    - - CMP2
      - inp

  # Net VTRI1 (Phase 1 PWM carrier)
  - - - VTRI1
      - pin
    - - V_TRI1
      - +
    - - CMP1
      - inn

  # Net VTRI2 (Phase 2 PWM carrier, 180 deg out of phase)
  - - - VTRI2
      - pin
    - - V_TRI2
      - +
    - - CMP2
      - inn

  # Net C_ERR1 (Phase 1 current error)
  - - - C_ERR1
      - pin
    - - SUM_C1
      - out
    - - K_C1
      - in

  # Net C_ERR2 (Phase 2 current error)
  - - - C_ERR2
      - pin
    - - SUM_C2
      - out
    - - K_C2
      - in

  # Net V_ERR (Voltage error VREF - VFB)
  - - - V_ERR
      - pin
    - - SUM_V
      - out
    - - K_V
      - in

  # Net V_AC_ABS (Rectified line voltage |v_ac|)
  - - - V_AC_ABS
      - pin
    - - ABS_VIN
      - out
    - - MULT
      - in1

analysis:
  spice_settings:
    reltol: 0.01
    method: gear
    initial_conditions: "v(VOUT)=385 v(V_COMP)=2.5 v(C_COMP1)=2.5 v(C_COMP2)=2.5"
  transient:
    requirements:
      - rid: tr_interleaved_pfc
        requirement: Verify 385V DC output and interleaved dual-phase PFC boosting operation
        criteria:
          target_vout: 385.0
        environment:
          - ref: time_domain
            t_step: 1.0e-06
            t_stop: 0.1
            t_max_step: 1.0e-07
        measurement:
          - ref: VOUT
            plot: true
            quantity: voltage
            nets:
              - - R1
                - pos
              - - R1
                - neg
            data:
              - name: Vout_avg
                spice_command: avg
                description: Average Output Voltage in steady state (last 20ms)
              - name: Vout_ripple_vpp
                spice_command: pp
                description: Output Ripple peak-to-peak in steady state
          - ref: VIN
            plot: true
            quantity: voltage
            nets:
              - - VAC
                - +
              - - VAC
                - '-'
          - ref: IL1
            plot: true
            quantity: current
            component: VSENSE1
            data:
              - name: IL1_avg
                spice_command: avg
                description: Average Phase 1 Inductor Current
          - ref: IL2
            plot: true
            quantity: current
            component: VSENSE2
            data:
              - name: IL2_avg
                spice_command: avg
                description: Average Phase 2 Inductor Current
        outputs:
          - var: vout_avg_v
            formula: abs([Vout_avg])
            description: Average Output Voltage
          - var: vout_ripple_vpp
            formula: '[Vout_ripple_vpp]'
            description: Output Voltage Ripple peak-to-peak
