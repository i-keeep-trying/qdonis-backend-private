analysis:
  transient:
    time_domain:
      - ref: transient
        duration: 60m
        step_size: 5u
        time_start: 0
        tmax: 1m
        uic: true
    requirements:
      - rid: tr_comprehensive
        requirement: Plot all key waveforms
        criteria:
          target_vout: 380.0
        measurement:
          - ref: VIN
            plot:
              x_axis: time
              title: Input DC Link Voltage
            quantity: voltage
            nets:
              - - V5
                - +
              - - V5
                - '-'
            data:
              - name: Vin_avg
                spice_command: avg
                description: Average input voltage
          - ref: VOUT_A
            plot:
              x_axis: time
              title: Phase A Output Voltage
            quantity: voltage
            nets:
              - - L1
                - pos
              - - M2
                - source
            data:
              - name: Vout_A_rms
                spice_command: rms
                description: RMS output voltage for Phase A
          - ref: VOUT_B
            plot:
              x_axis: time
              title: Phase B Output Voltage
            quantity: voltage
            nets:
              - - L2
                - pos
              - - M4
                - source
            data:
              - name: Vout_B_rms
                spice_command: rms
                description: RMS output voltage for Phase B
          - ref: VOUT_C
            plot:
              x_axis: time
              title: Phase C Output Voltage
            quantity: voltage
            nets:
              - - L3
                - pos
              - - M6
                - source
            data:
              - name: Vout_C_rms
                spice_command: rms
                description: RMS output voltage for Phase C
          - ref: IOUT_A
            plot:
              x_axis: time
              title: Phase A Load Current
            quantity: current
            component: L1
            data:
              - name: Iout_A_rms
                spice_command: rms
                description: RMS output current for Phase A
          - ref: IOUT_B
            plot:
              x_axis: time
              title: Phase B Load Current
            quantity: current
            component: L2
            data:
              - name: Iout_B_rms
                spice_command: rms
                description: RMS output current for Phase B
          - ref: IOUT_C
            plot:
              x_axis: time
              title: Phase C Load Current
            quantity: current
            component: L3
            data:
              - name: Iout_C_rms
                spice_command: rms
                description: RMS output current for Phase C
          - ref: GATE_A_HIGH
            plot:
              x_axis: time
              title: Phase A High-Side Gate Pulse (Vgs)
            quantity: voltage
            nets:
              - - M1
                - gate
              - - M1
                - source
          - ref: GATE_A_LOW
            plot:
              x_axis: time
              title: Phase A Low-Side Gate Pulse (Vgs)
            quantity: voltage
            nets:
              - - M2
                - gate
              - - M2
                - source
          - ref: GATE_B_HIGH
            plot:
              x_axis: time
              title: Phase B High-Side Gate Pulse (Vgs)
            quantity: voltage
            nets:
              - - M3
                - gate
              - - M3
                - source
          - ref: GATE_B_LOW
            plot:
              x_axis: time
              title: Phase B Low-Side Gate Pulse (Vgs)
            quantity: voltage
            nets:
              - - M4
                - gate
              - - M4
                - source
          - ref: GATE_C_HIGH
            plot:
              x_axis: time
              title: Phase C High-Side Gate Pulse (Vgs)
            quantity: voltage
            nets:
              - - M5
                - gate
              - - M5
                - source
          - ref: GATE_C_LOW
            plot:
              x_axis: time
              title: Phase C Low-Side Gate Pulse (Vgs)
            quantity: voltage
            nets:
              - - M6
                - gate
              - - M6
                - source
        outputs:
          - var: vout_a_rms_v
            formula: '[Vout_A_rms]'
            description: Phase A RMS Voltage
  ac:
    frequency:
      start: 1
      stop: 1Meg
      points_per_decade: 10
models:
  - .model FDH210N08 NMOS (LEVEL=1 VTO=2.5 KP=20 LAMBDA=0.001 RD=0.003 RS=0.003)
