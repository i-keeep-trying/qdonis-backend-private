analysis:
  transient:
    spice_settings:
      tstop: 0.15
      use_ic: false
      reltol: 0.01
      abstol: 1.0e-06
      vntol: 0.001
      cshunt: 1.0e-11
      chgtol: 1.0e-11
      itl4: 50
      method: gear
    requirements:
    - rid: tr_afe_rectifier
      requirement: Verify AFE Rectifier active current shaping and output voltage.
      measurement:
      - ref: VOUT
        plot:
          x_axis: time
          title: Output DC Voltage
        quantity: voltage
        component: R_DC
        nets:
        - - R_DC
          - pos
        - - R_DC
          - neg
        data:
        - name: Vout_avg
          spice_command: avg
          description: Average Output Voltage
          from: 0.14
          to: 0.15
      - ref: IIN_SENSE
        plot:
          x_axis: time
          title: Input AC Current
        quantity: current
        component: VSENSE_AC
        data:
        - name: Iin_rms
          spice_command: rms
          description: RMS Input Current
          from: 0.14
          to: 0.15
        - name: Iin_max
          spice_command: max
          description: Peak Input Current
          from: 0.14
          to: 0.15
      outputs:
      - var: vout_avg_v
        formula: abs([Vout_avg])
        description: Average Output Voltage
      - var: iin_rms_a
        formula: abs([Iin_rms])
        description: RMS Input Current
      - var: iin_peak_a
        formula: abs([Iin_max])
        description: Peak Input Current
metadata:
  stage:
  - afe
  - rectifier
  topology: single_phase_active_front_end
  control: continuous_pi_pwm
  tags:
  - afe
  - pfc
  - sic
  - acdc
