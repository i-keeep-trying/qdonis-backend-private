# Control (blocks): per phase, modulation = feed-forward + 0.5 * (current reference - sensed current),
# 100 us filter, clamped +-9.5 V; phase-disposition PWM against the carrier shifted to 0..10 V (CHI) and -10..0 V (CLO)
# with a 0.16 V dead band. Gate drives: S4 (ground-referenced) as gain blocks; the floating ones stay E sources.
# Scale: the carrier spans +-10 for +-400 V (40 V per unit). The feed-forward V_VFF_* is the load voltage for the
# reference current, 20 A * |1 + j*2*pi*160*10m| = 202 V at 84.3 deg = 5.05 units. Until 2026-10-11 it was 10.1 units
# (sized for the old 24 V link, 1 A): on 800 V that asked for ~400 V and the currents ran at 18 A against 1 A.
- ref: CHI_SHIFT
  type: function
  role: upper_carrier
  params:
    expression: "in1/2+5"
    inputs: 1

- ref: CLO_SHIFT
  type: function
  role: lower_carrier
  params:
    expression: "in1/2-5"
    inputs: 1

