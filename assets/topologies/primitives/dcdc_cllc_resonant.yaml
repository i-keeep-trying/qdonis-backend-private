id: dcdc_cllc_resonant
name: CLLC Resonant DC-DC Converter
description: 'Bidirectional isolated resonant DC-DC converter with complementary LLC
  tanks on primary and secondary sides. Converts 400V input to 400V output (unity-gain
  V2G demo). Primary full H-bridge (SW1-SW4) drives a series-resonant tank Cr_P-Lr
  through transformer T1. Secondary features an asymmetric topology: Cr_S in series
  from T1.S1, followed by secondary resonant inductor Ls which drives the right-side
  bridge (SW7-SW8), while the left-side bridge (SW5-SW6) is driven directly from T1.S2.
  This asymmetry allows independent control of power flow direction while maintaining
  ZVS/ZCS operation near the resonant frequency fr = 1/(2pi*sqrt(Lr*Cr_P)) ~ 100kHz
  on the primary side.'
components:
  - ref: VIN
    type: node
    role: input_source
    params:
      node_type: voltage_source
      source: dc
      voltage: 400
      series_resistance: 0.2
  - ref: PWM1
    type: node
    role: pwm_control
    params:
      node_type: pwm_control
      frequency: 100e3
      duty_cycle: 0.46
      vhigh: 20.0
      vlow: 0.0
      trise: 1e-7
      tfall: 1e-7
      tdelay: 0
      drive_resistance: 50
  - ref: PWM2
    type: node
    role: pwm_control
    params:
      node_type: pwm_control
      frequency: 100e3
      duty_cycle: 0.46
      vhigh: 20.0
      vlow: 0.0
      trise: 1e-7
      tfall: 1e-7
      tdelay: 5.0e-06
      drive_resistance: 50
  - ref: PWM3
    type: node
    role: pwm_control
    params:
      node_type: pwm_control
      frequency: 100e3
      duty_cycle: 0.46
      vhigh: 20.0
      vlow: 0.0
      trise: 1e-7
      tfall: 1e-7
      tdelay: 5.0e-06
      drive_resistance: 50
  - ref: PWM4
    type: node
    role: pwm_control
    params:
      node_type: pwm_control
      frequency: 100e3
      duty_cycle: 0.46
      vhigh: 20.0
      vlow: 0.0
      trise: 1e-7
      tfall: 1e-7
      tdelay: 0
      drive_resistance: 50
  - ref: PWM5
    type: node
    role: pwm_control
    params:
      node_type: pwm_control
      frequency: 100e3
      duty_cycle: 0.46
      vhigh: 20.0
      vlow: 0.0
      trise: 1e-7
      tfall: 1e-7
      tdelay: 5.0e-06
      drive_resistance: 50
  - ref: PWM6
    type: node
    role: pwm_control
    params:
      node_type: pwm_control
      frequency: 100e3
      duty_cycle: 0.46
      vhigh: 20.0
      vlow: 0.0
      trise: 1e-7
      tfall: 1e-7
      tdelay: 0
      drive_resistance: 50
  - ref: PWM7
    type: node
    role: pwm_control
    params:
      node_type: pwm_control
      frequency: 100e3
      duty_cycle: 0.46
      vhigh: 20.0
      vlow: 0.0
      trise: 1e-7
      tfall: 1e-7
      tdelay: 0
      drive_resistance: 50
  - ref: PWM8
    type: node
    role: pwm_control
    params:
      node_type: pwm_control
      frequency: 100e3
      duty_cycle: 0.46
      vhigh: 20.0
      vlow: 0.0
      trise: 1e-7
      tfall: 1e-7
      tdelay: 5.0e-06
      drive_resistance: 50
  - ref: SW1
    type: transistor
    role: pri_hs_left
    params:
      family: mosfet
      type: nmos
      mode: enhancement
      voltage_rating: 600
      current_rating: 10
      Vto: 1.5
      Kn: 25e-3
      Lambda: 0.005
      Cgs: 1000e-12
      Cgd: 200e-12
      Cdb: 200e-12
    layout:
      schX: -3.0
      schY: 0.0
      rotation: 270deg
  - ref: SW2
    type: transistor
    role: pri_ls_left
    params:
      family: mosfet
      type: nmos
      mode: enhancement
      voltage_rating: 600
      current_rating: 10
      Vto: 1.5
      Kn: 25e-3
      Lambda: 0.005
      Cgs: 1000e-12
      Cgd: 200e-12
      Cdb: 200e-12
    layout:
      schX: -3.0
      schY: -3.0
      rotation: 270deg
  - ref: SW3
    type: transistor
    role: pri_hs_right
    params:
      family: mosfet
      type: nmos
      mode: enhancement
      voltage_rating: 600
      current_rating: 10
      Vto: 1.5
      Kn: 25e-3
      Lambda: 0.005
      Cgs: 1000e-12
      Cgd: 200e-12
      Cdb: 200e-12
    layout:
      schX: 0.0
      schY: 0.0
      rotation: 270deg
  - ref: SW4
    type: transistor
    role: pri_ls_right
    params:
      family: mosfet
      type: nmos
      mode: enhancement
      voltage_rating: 600
      current_rating: 10
      Vto: 1.5
      Kn: 25e-3
      Lambda: 0.005
      Cgs: 1000e-12
      Cgd: 200e-12
      Cdb: 200e-12
    layout:
      schX: 0.0
      schY: -3.0
      rotation: 270deg
  - ref: Cr_P
    type: capacitor
    role: primary_resonant_cap
    params:
      capacitance: 47e-9
      polarized: false
      voltage_rating: 600
      tolerance: 0.05
      esr: 0.05
      esl: 2e-9
      leakage_current: 1e-12
    layout:
      schX: 1.0
      schY: -1.0
      orientation: horizontal
  - ref: Lr
    type: inductor
    role: primary_resonant_inductor
    params:
      inductance: 54e-6
      series_resistance: 0.1
      saturation_current: 10.0
      core_loss_resistance: 1e6
      parasitic_capacitance: 20e-12
    layout:
      schX: 2.5
      schY: -1.0
      orientation: horizontal
  - ref: T1
    type: transformer
    role: power_transformer
    params:
      Lm_primary: 1000e-6
      turns_ratio: 1.0
      k_coupling: 0.99
      phase: same
      Rp: 0.1
      Rs: 0.1
      core_loss_resistance: 1e6
    layout:
      schX: 4.0
      schY: -2.0
      configuration: left-to-right
    internal:
      - ref: R_ISO
        type: resistor
        role: secondary_ground_anchor
        params:
          resistance: 10e6
        connections:
          pos:
            - T1
            - S2
          neg:
            - VIN
            - '-'
  - ref: Cr_S
    type: capacitor
    role: secondary_resonant_cap
    params:
      capacitance: 47e-9
      polarized: false
      voltage_rating: 600
      tolerance: 0.05
      esr: 0.05
      esl: 2e-9
      leakage_current: 1e-12
    layout:
      schX: 5.5
      schY: -1.0
      orientation: horizontal
  - ref: Ls
    type: inductor
    role: secondary_resonant_inductor
    params:
      inductance: 54e-6
      series_resistance: 0.1
      saturation_current: 10.0
      core_loss_resistance: 1e6
      parasitic_capacitance: 20e-12
    layout:
      schX: 7.5
      schY: -1.0
      orientation: horizontal
  - ref: SW5
    type: transistor
    role: sec_hs_left
    params:
      family: mosfet
      type: nmos
      mode: enhancement
      voltage_rating: 600
      current_rating: 10
      Vto: 1.5
      Kn: 25e-3
      Lambda: 0.005
      Cgs: 1000e-12
      Cgd: 200e-12
      Cdb: 200e-12
    layout:
      schX: 9.0
      schY: 0.0
      rotation: 270deg
  - ref: SW6
    type: transistor
    role: sec_ls_left
    params:
      family: mosfet
      type: nmos
      mode: enhancement
      voltage_rating: 600
      current_rating: 10
      Vto: 1.5
      Kn: 25e-3
      Lambda: 0.005
      Cgs: 1000e-12
      Cgd: 200e-12
      Cdb: 200e-12
    layout:
      schX: 9.0
      schY: -3.0
      rotation: 270deg
  - ref: SW7
    type: transistor
    role: sec_hs_right
    params:
      family: mosfet
      type: nmos
      mode: enhancement
      voltage_rating: 600
      current_rating: 10
      Vto: 1.5
      Kn: 25e-3
      Lambda: 0.005
      Cgs: 1000e-12
      Cgd: 200e-12
      Cdb: 200e-12
    layout:
      schX: 12.0
      schY: 0.0
      rotation: 270deg
  - ref: SW8
    type: transistor
    role: sec_ls_right
    params:
      family: mosfet
      type: nmos
      mode: enhancement
      voltage_rating: 600
      current_rating: 10
      Vto: 1.5
      Kn: 25e-3
      Lambda: 0.005
      Cgs: 1000e-12
      Cgd: 200e-12
      Cdb: 200e-12
    layout:
      schX: 12.0
      schY: -3.0
      rotation: 270deg
  - ref: Cout
    type: capacitor
    role: output_filter
    params:
      capacitance: 10e-6
      polarized: true
      voltage_rating: 600
      tolerance: 0.1
      esr: 0.01
      esl: 5e-9
      leakage_current: 10e-6
      ic: 0
    layout:
      schX: 13.5
      schY: -1.5
      orientation: vertical
  - ref: R_LOAD
    type: resistor
    role: load
    params:
      resistance: 40
      tolerance: 0.05
      temp_coefficient: 100e-6
      parasitic_inductance: 10e-9
    layout:
      schX: 14.5
      schY: -1.5
      orientation: vertical
