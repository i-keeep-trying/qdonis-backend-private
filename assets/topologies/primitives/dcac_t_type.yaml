# Third-harmonic injection (2026-10-22): in series with each feed-forward source, 1/6 of it at three times the
# output frequency (the same for all phases: 3 x 120 deg). The load star floats (R_STAR 1 Meg), so it adds no
# current but lifts the linear range by 15 % (V_LL up to 0.707 Vdc instead of 0.612 Vdc: 380 V from 600 V).
