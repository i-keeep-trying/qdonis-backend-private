id: dcdc_interleaved_multiphase_buck
name: Interleaved Multiphase Buck DC-DC Converter
description: Four-phase interleaved synchronous buck converter for high-current CPU/GPU
  core power delivery. Converts 12V input to 1.2V output. All phases run at 500kHz
  with 90 degrees phase offset (tdelay = k*T/4 on phase k+1) for output ripple cancellation.
  Each phase uses an NMOS high-side switch with a floating gate drive (referenced
  to its switch node) and an NMOS synchronous low-side switch with 40ns dead time.
  The shared output capacitor benefits from interleaved ripple cancellation.
components:
- ref: VIN
  type: node
  role: input_source
  params:
    node_type: voltage_source
    source: dc
    voltage: 12
    series_resistance: 0.005
- ref: PWM1
  type: node
  role: pwm_control
  params:
    node_type: pwm_control
    frequency: 500000.0
    duty_cycle: 0.12
    vhigh: 12.0
    vlow: 0.0
    trise: 2.0e-08
    tfall: 2.0e-08
    tdelay: 0.0
    drive_resistance: 5
- ref: PWM2
  type: node
  role: pwm_control
  params:
    node_type: pwm_control
    frequency: 500000.0
    duty_cycle: 0.84
    vhigh: 12.0
    vlow: 0.0
    trise: 2.0e-08
    tfall: 2.0e-08
    tdelay: 2.8e-07
    drive_resistance: 5
- ref: PWM3
  type: node
  role: pwm_control
  params:
    node_type: pwm_control
    frequency: 500000.0
    duty_cycle: 0.12
    vhigh: 12.0
    vlow: 0.0
    trise: 2.0e-08
    tfall: 2.0e-08
    tdelay: 5.0e-07
    drive_resistance: 5
- ref: PWM4
  type: node
  role: pwm_control
  params:
    node_type: pwm_control
    frequency: 500000.0
    duty_cycle: 0.84
    vhigh: 12.0
    vlow: 0.0
    trise: 2.0e-08
    tfall: 2.0e-08
    tdelay: 7.8e-07
    drive_resistance: 5
- ref: PWM5
  type: node
  role: pwm_control
  params:
    node_type: pwm_control
    frequency: 500000.0
    duty_cycle: 0.12
    vhigh: 12.0
    vlow: 0.0
    trise: 2.0e-08
    tfall: 2.0e-08
    tdelay: 1.0e-06
    drive_resistance: 5
- ref: PWM6
  type: node
  role: pwm_control
  params:
    node_type: pwm_control
    frequency: 500000.0
    duty_cycle: 0.84
    vhigh: 12.0
    vlow: 0.0
    trise: 2.0e-08
    tfall: 2.0e-08
    tdelay: 1.28e-06
    drive_resistance: 5
- ref: PWM7
  type: node
  role: pwm_control
  params:
    node_type: pwm_control
    frequency: 500000.0
    duty_cycle: 0.12
    vhigh: 12.0
    vlow: 0.0
    trise: 2.0e-08
    tfall: 2.0e-08
    tdelay: 1.5e-06
    drive_resistance: 5
- ref: PWM8
  type: node
  role: pwm_control
  params:
    node_type: pwm_control
    frequency: 500000.0
    duty_cycle: 0.84
    vhigh: 12.0
    vlow: 0.0
    trise: 2.0e-08
    tfall: 2.0e-08
    tdelay: 1.78e-06
    drive_resistance: 5
- ref: SW1
  type: transistor
  role: ph1_hs
  params:
    family: mosfet
    type: nmos
    mode: enhancement
    voltage_rating: 100
    current_rating: 10
    Vto: 1.5
    Kn: 200e-3
    Lambda: 0.01
    Cgs: 1500e-12
    Cgd: 300e-12
    Cdb: 300e-12
