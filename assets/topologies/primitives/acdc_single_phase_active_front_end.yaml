id: acdc_single_phase_active_front_end
name: Single Phase Active Front End Rectifier
description: Single-Phase Active Front End (AFE) Rectifier using a continuous PI control
  loop and bipolar smooth PWM logic.
components:
- ref: GLOBAL_PARAMS
  type: custom_spice
  params:
    spice_line: .param V_TARGET=400 V_PEAK=325.27
- ref: GND
  type: node
  params:
    node_type: ground
- ref: VAC
  type: node
  role: voltage_source
  params:
    node_type: voltage_source
    source: sine
    offset: 0
    amplitude: 325.27
    frequency: 50
- ref: R_GND_L
  type: resistor
  params:
    resistance: 10000000.0
- ref: R_GND_N
  type: resistor
  params:
    resistance: 10000000.0
- ref: R_GRID_L
  type: resistor
  params:
    resistance: 0.1
- ref: L_BOOST
  type: inductor
  params:
    inductance: 0.001
- ref: VSENSE_AC
  type: node
  params:
    node_type: voltage_source
    source: dc
    voltage: 0
- ref: R_GRID_N
  type: resistor
  params:
    resistance: 0.1
- ref: B_GA_TOP
  type: b_source
  params:
    expression: v(n_duty_A_top)
- ref: R_GA_TOP
  type: resistor
  params:
    resistance: 10.0
- ref: M_A_TOP
  type: transistor
  params:
    family: mosfet
    type: nmos
    Vto: 3.5
    Kp: 60
    Rs: 0.04
- ref: D_A_TOP
  type: diode
  params:
    Rs: 0.01
    Cjo: 1.0e-10
    Tt: 1.0e-08
    Bv: 800.0
- ref: R_GA_BOT
  type: resistor
  params:
    resistance: 10.0
- ref: M_A_BOT
  type: transistor
  params:
    family: mosfet
    type: nmos
    Vto: 3.5
    Kp: 60
    Rs: 0.04
- ref: D_A_BOT
  type: diode
  params:
    Rs: 0.01
    Cjo: 1.0e-10
    Tt: 1.0e-08
    Bv: 800.0
- ref: B_GB_TOP
  type: b_source
  params:
    expression: v(n_duty_B_top)
- ref: R_GB_TOP
  type: resistor
  params:
    resistance: 10.0
- ref: M_B_TOP
  type: transistor
  params:
    family: mosfet
    type: nmos
    Vto: 3.5
    Kp: 60
    Rs: 0.04
- ref: D_B_TOP
  type: diode
  params:
    Rs: 0.01
    Cjo: 1.0e-10
    Tt: 1.0e-08
    Bv: 800.0
- ref: R_GB_BOT
  type: resistor
  params:
    resistance: 10.0
- ref: M_B_BOT
  type: transistor
  params:
    family: mosfet
    type: nmos
    Vto: 3.5
    Kp: 60
    Rs: 0.04
- ref: D_B_BOT
  type: diode
  params:
    Rs: 0.01
    Cjo: 1.0e-10
    Tt: 1.0e-08
    Bv: 800.0
- ref: C_DC
  type: capacitor
  params:
    capacitance: 0.0022
- ref: R_DC
  type: resistor
  params:
    resistance: 100.0

- ref: n_vref
  type: node
  params:
    node_type: "label"

- ref: n_pi_sum
  type: node
  params:
    node_type: "label"

- ref: n_vac
  type: node
  params:
    node_type: "label"

- ref: n_ierr
  type: node
  params:
    node_type: "label"

- ref: n_ierr_k
  type: node
  params:
    node_type: "label"

# Control (blocks): voltage PI (0.1 * err + 20 * integral) -> clamp 0..40 -> 10 ms filter = current amplitude;
# current reference = amplitude * v_ac / V_PEAK; current error * 10, clamped +-10, 47 us filter = n_ctrl;
# bipolar PWM: comparators against a +-10 V 100 kHz triangle with a 0.2 V dead band (15 V gate levels).
# The high-side drives B_GA_TOP / B_GB_TOP stay B sources (their outputs float on the switch nodes).
- ref: REF_V
  type: const
  role: voltage_reference
  params:
    value: "V_TARGET"

- ref: SUM_V
  type: sum
  role: voltage_error
  params:
    signs: "+-"

- ref: KP_V
  type: gain
  role: voltage_p
  params:
    gain: 0.1

- ref: INT_V
  type: integrator
  role: voltage_i
  params:
    ki: 20
    ic: 29.5

- ref: SUM_PI
  type: sum
  role: voltage_pi_sum
  params:
    signs: "++"

- ref: LIM_MAG
  type: limiter
  role: current_amplitude_clamp
  params:
    lower: 0
    upper: 40

- ref: LPF_MAG
  type: lowpass
  role: current_amplitude_filter
  params:
    tau: 0.00999001
    gain: 0.999001
    ic: 29.5

- ref: SUM_VAC
  type: sum
  role: line_voltage_sense
  params:
    signs: "+-"

- ref: REF_I
  type: product
  role: current_reference
  params:
    gain: "1/V_PEAK"

- ref: I_SENSE
  type: function
  role: line_current_sense
  params:
    expression: "i(VSENSE_AC)"
    inputs: 0

- ref: SUM_I
  type: sum
  role: current_error
  params:
    signs: "+-"

- ref: K_I
  type: gain
  role: current_error_amp
  params:
    gain: 10

- ref: LIM_I
  type: limiter
  role: current_error_clamp
  params:
    lower: -10
    upper: 10

- ref: LPF_C
  type: lowpass
  role: current_compensator
  params:
    tau: 4.6953e-05
    gain: 0.999001

- ref: CAR
  type: carrier
  role: pwm_carrier
  params:
    frequency: 100000.0
    low: -10
    high: 10
    shape: "triangle"

- ref: CMP_A_TOP
  type: comparator
  role: leg_a_top_pwm
  params:
    high: 15
    low: 0
    threshold: 0.2
    width: 0.01

- ref: CMP_A_BOT
  type: comparator
  role: leg_a_bottom_pwm
  params:
    high: 15
    low: 0
    threshold: 0.2
    width: 0.01

- ref: CMP_B_TOP
  type: comparator
  role: leg_b_top_pwm
  params:
    high: 15
    low: 0
    threshold: 0.2
    width: 0.01

- ref: CMP_B_BOT
  type: comparator
  role: leg_b_bottom_pwm
  params:
    high: 15
    low: 0
    threshold: 0.2
    width: 0.01

- ref: IC_CMD
  type: custom_spice
  params:
    spice_line: .ic V(n_DC_BUS)=400 V(n_INT)=29.5 V(n_mag_flt)=29.5
