id: dcdc_push_pull
name: Push Pull DC-DC Converter
description: Isolated DC-DC converter using a center-tapped transformer driven by
  two alternating switches. Converts 12V input to 6V isolated output with output inductor
  filtering.
components:
  - ref: VIN
    type: node
    role: voltage_source
    params:
      node_type: voltage_source
      voltage: 12
      source: dc
      series_resistance: 0.01
  - ref: C1
    type: capacitor
    role: input_filter
    params:
      capacitance: 100e-6
      polarized: true
      voltage_rating: 25
      tolerance: 0.2
      esr: 0.05
      esl: 10e-9
      leakage_current: 5e-6
    layout:
      schX: 0.0
      schY: 1.0
      orientation: vertical
  - ref: Q1
    type: transistor
    role: primary_switch_A
    params:
      family: mosfet
      type: nmos
      mode: enhancement
      voltage_rating: 100
      current_rating: 5
      Vto: 1.5
      Kp: 50e-3
      Lambda: 0.02
      Cgs: 20e-12
      Cgd: 10e-12
      Cdb: 1e-9
      Tpd: 10e-9
    layout:
      schX: 1.0
      schY: 0.0
      rotation: 270deg
  - ref: Q2
    type: transistor
    role: primary_switch_B
    params:
      family: mosfet
      type: nmos
      mode: enhancement
      voltage_rating: 100
      current_rating: 5
      Vto: 1.5
      Kp: 50e-3
      Lambda: 0.02
      Cgs: 20e-12
      Cgd: 10e-12
      Cdb: 1e-9
      Tpd: 10e-9
    layout:
      schX: 3.0
      schY: 0.0
      rotation: 270deg
  - ref: T1
    type: dual_ct_transformer
    role: push_pull_transformer
    params:
      turns_ratio: 1.0
      Lm_primary: 100e-6
      leakage_inductance: 2e-6
      winding_resistance_p1: 0.05
      winding_resistance_p2: 0.05
      winding_resistance_s1: 0.05
      winding_resistance_s2: 0.05
      coupling_coefficient: 0.9
      interwinding_capacitance_pp: 50e-12
      interwinding_capacitance_ss: 50e-12
      interwinding_capacitance_ps: 20e-12
      primary_center_tap_resistance: 0.1
      primary_center_tap_capacitance: 0
      secondary_center_tap_resistance: 0.1
      secondary_center_tap_capacitance: 0
      core_loss_resistance: 1e6
      phase_p1: same
      phase_p2: opposite
      phase_s1: same
      phase_s2: opposite
    layout:
      schX: 4.0
      schY: 2.0
      configuration: left-to-right
    internal:
      - ref: RSN_Q1
        type: resistor
        role: snubber_q1
        params:
          resistance: 20
        connections:
          pos:
            - Q1
            - drain
          neg:
            - CSN_Q1
            - pos
      - ref: CSN_Q1
        type: capacitor
        role: snubber_q1
        params:
          capacitance: 1e-9
        connections:
          pos:
            - RSN_Q1
            - neg
          neg:
            - VIN
            - '-'
      - ref: RSN_Q2
        type: resistor
        role: snubber_q2
        params:
          resistance: 20
        connections:
          pos:
            - Q2
            - drain
          neg:
            - CSN_Q2
            - pos
      - ref: CSN_Q2
        type: capacitor
        role: snubber_q2
        params:
          capacitance: 1e-9
        connections:
          pos:
            - RSN_Q2
            - neg
          neg:
            - VIN
            - '-'
      - ref: RSN_SEC
        type: resistor
        role: snubber_sec
        params:
          resistance: 20
        connections:
          pos:
            - L1
            - pin1
          neg:
            - CSN_SEC
            - pos
      - ref: CSN_SEC
        type: capacitor
        role: snubber_sec
        params:
          capacitance: 1e-9
        connections:
          pos:
            - RSN_SEC
            - neg
          neg:
            - T1
            - CT_S
      - ref: R_ISO
        type: resistor
        role: secondary_ground_anchor
        params:
          resistance: 100e6
        connections:
          pos:
            - T1
            - CT_S
          neg:
            - VIN
            - '-'
  - ref: D1
    type: diode
    role: rectifier_diode_1
    params:
      reverse_voltage: 20
      current_rating: 3
      forward_voltage: 0.7
      reverse_recovery_time: 0
      junction_capacitance: 20e-12
      series_resistance: 0.1
      Bv: 100
      Ibv: 1e-6
    layout:
      schX: 5.0
      schY: 3.0
      orientation: horizontal
  - ref: D2
    type: diode
    role: rectifier_diode_2
    params:
      reverse_voltage: 20
      current_rating: 3
      forward_voltage: 0.7
      reverse_recovery_time: 0
      junction_capacitance: 20e-12
      series_resistance: 0.1
      Bv: 100
      Ibv: 1e-6
    layout:
      schX: 5.0
      schY: 1.0
      orientation: horizontal
  - ref: L1
    type: inductor
    role: output_filter
    params:
      inductance: 47e-6
      series_resistance: 0.1
      saturation_current: 5.0
      core_loss_resistance: 1e6
      parasitic_capacitance: 50e-12
    layout:
      schX: 6.5
      schY: 3.0
      orientation: horizontal
  - ref: C0
    type: capacitor
    role: output_filter
    params:
      capacitance: 47e-6
      polarized: true
      voltage_rating: 20
      tolerance: 0.2
      esr: 0.05
      esl: 8e-9
      leakage_current: 5e-6
    layout:
      schX: 7.5
      schY: 2.0
      orientation: vertical
  - ref: RLOAD
    type: resistor
    role: load
    params:
      resistance: 100
      tolerance: 0.05
      temp_coefficient: 100e-6
      parasitic_inductance: 10e-9
    layout:
      schX: 9.0
      schY: 2.0
      orientation: vertical
  - ref: PWM1
    type: node
    role: pwm_control
    params:
      node_type: pwm_control
      frequency: 100e3
      duty_cycle: 0.4
      vhigh: 12.0
      vlow: 0.0
      trise: 1e-7
      tfall: 1e-7
      tdelay: 0
      drive_resistance: 100
  - ref: PWM2
    type: node
    role: pwm_control
    params:
      node_type: pwm_control
      frequency: 100e3
      duty_cycle: 0.4
      vhigh: 12.0
      vlow: 0.0
      trise: 1e-7
      tfall: 1e-7
      tdelay: 5e-6
      drive_resistance: 100
nets:
  - - - VIN
      - +
    - - C1
      - pos
    - - T1
      - CT_P
  - - - VIN
      - '-'
    - - C1
      - neg
    - - Q1
      - source
    - - Q2
      - source
    - - PWM1
      - neg
    - - PWM2
      - neg
  - - - Q1
      - drain
    - - T1
      - P1
  - - - Q2
      - drain
    - - T1
      - P2
  - - - PWM1
      - pos
    - - Q1
      - gate
  - - - PWM2
      - pos
    - - Q2
      - gate
  - - - T1
      - S1
    - - D1
      - anode
  - - - T1
      - S2
    - - D2
      - anode
  - - - D1
      - cathode
    - - D2
      - cathode
    - - L1
      - pin1
  - - - L1
      - pin2
    - - C0
      - pos
    - - RLOAD
      - pos
  - - - T1
      - CT_S
    - - C0
      - neg
    - - RLOAD
      - neg
analysis:
  transient:
    spice_settings:
      reltol: 0.01
      abstol: 1.0e-09
      vntol: 1.0e-05
      chgtol: 1.0e-12
      gmin: 1.0e-10
      method: gear
      maxord: 2
      trtol: 4.0
      use_ic: true
    requirements:
      - rid: tr_startup
        requirement: Startup transient from 0V to 12V output. Push-pull converter
          is NON-INVERTING (output positive terminal [RLOAD, pos] referenced to isolated
          ground [T1, CT_S]). Measure VOUT at [RLOAD, pos]. Verify output reaches
          target voltage with acceptable overshoot and settling time.
        criteria:
          target_vout: 12.0
          overshoot_pct: 10.0
          settle_time_ms: 5.0
          vout_min: 11.4
          vout_max: 12.6
        environment:
          - ref: time_domain
            t_start: 0.01275
            t_stop: 0.015
            t_step: 1.0e-07
            description: 15ms simulation for startup settling (1500+ switching periods
              at typical 100kHz)
        measurement:
          - ref: VIN
            plot:
              x_axis: time
              title: Input Voltage
            quantity: voltage
            nets:
              - - VIN
                - +
              - - VIN
                - '-'
          - ref: VOUT
            plot:
              x_axis: time
              title: Output Voltage Startup Transient
            quantity: voltage
            nets:
              - - RLOAD
                - pos
              - - T1
                - CT_S
            data:
              - name: vout_peak
                spice_command: max
                description: Peak output voltage during startup
              - name: vout_final
                spice_command: avg
                description: Final settled output voltage
            description: Output voltage at load (isolated secondary side)
          - ref: VOUT_SETTLE
            plot: false
            quantity: voltage
            nets:
              - - RLOAD
                - pos
              - - T1
                - CT_S
            data:
              - name: t_settle
                spice_command: TRIG AT=0.0 TARG [VOUT] VAL={{criteria.target_vout}*0.95}
                  CROSS=LAST
                description: Time when output settles within 5% band (last crossing)
            description: Settling time measurement
        outputs:
          - var: vout_final_v
            formula: '[vout_final]'
            description: Final output voltage in volts
          - var: overshoot_pct
            formula: 100 * abs([vout_peak] - {criteria.target_vout}) / {criteria.target_vout}
            description: Overshoot percentage relative to target
          - var: settle_time_ms
            formula: '[t_settle] * 1000'
            description: Settling time in milliseconds
      - rid: tr_regulation
        requirement: Steady-state output voltage regulation at nominal load. Measure
          VOUT at [RLOAD, pos] after startup transient settles. Verify output voltage
          is within regulation tolerance.
        criteria:
          target_vout: 12.0
          vout_min: 11.4
          vout_max: 12.6
          regulation_pct: 5.0
        environment:
          - ref: time_domain
            t_start: 0.01275
            t_stop: 0.015
            t_step: 1.0e-07
            description: 15ms simulation for steady-state measurement
        measurement:
          - ref: VIN
            plot: false
            quantity: voltage
            nets:
              - - VIN
                - +
              - - VIN
                - '-'
          - ref: VOUT_REG
            plot: false
            quantity: voltage
            nets:
              - - RLOAD
                - pos
              - - T1
                - CT_S
            data:
              - name: vout_avg
                spice_command: avg
                description: Average output voltage during steady state
            description: Steady-state output voltage regulation
        outputs:
          - var: vout_avg_v
            formula: '[vout_avg]'
            description: Average output voltage in volts
          - var: regulation_error_pct
            formula: 100 * abs([vout_avg] - {criteria.target_vout}) / {criteria.target_vout}
            description: Regulation error percentage
      - rid: tr_output_ripple
        requirement: Output voltage ripple at steady state. Measure peak-to-peak ripple
          voltage at [RLOAD, pos] during steady-state operation (after startup settling).
          Verify ripple is within acceptable limits.
        criteria:
          target_vout: 12.0
          ripple_max_mv: 120.0
          ripple_max_pct: 1.0
        environment:
          - ref: time_domain
            t_start: 0.01275
            t_stop: 0.015
            t_step: 1.0e-07
            description: 15ms simulation to capture ripple after settling
        measurement:
          - ref: VIN
            plot: false
            quantity: voltage
            nets:
              - - VIN
                - +
              - - VIN
                - '-'
          - ref: VOUT_RIPPLE
            plot:
              x_axis: time
              title: Output Voltage Ripple (Steady State)
            quantity: voltage
            nets:
              - - RLOAD
                - pos
              - - T1
                - CT_S
            data:
              - name: vout_ripple_pp
                spice_command: pp
                description: Peak-to-peak output voltage ripple
              - name: vout_avg_ripple
                spice_command: avg
                description: Average output voltage for ripple percentage calculation
            description: Output voltage ripple measurement
        outputs:
          - var: ripple_mv
            formula: '[vout_ripple_pp] * 1000'
            description: Output ripple in millivolts
          - var: ripple_pct
            formula: 100 * [vout_ripple_pp] / abs([vout_avg_ripple])
            description: Output ripple as percentage of average voltage
      - rid: tr_switch_stress
        requirement: Primary switch voltage and current stress. Measure peak drain-source
          voltage across Q1 and Q2, and peak drain current through Q1 and Q2. Verify
          switches operate within safe limits (no excessive voltage spikes or current
          overshoot).
        criteria:
          vds_max_q1: 30.0
          vds_max_q2: 30.0
          id_max_q1: 5.0
          id_max_q2: 5.0
        environment:
          - ref: time_domain
            t_start: 0.01275
            t_stop: 0.015
            t_step: 1.0e-07
            description: 15ms simulation to capture switching stress
        measurement:
          - ref: VIN
            plot: false
            quantity: voltage
            nets:
              - - VIN
                - +
              - - VIN
                - '-'
          - ref: VDS_Q1
            plot:
              x_axis: time
              title: Q1 Drain-Source Voltage
            quantity: voltage
            nets:
              - - Q1
                - drain
              - - Q1
                - source
            data:
              - name: vds_q1_max
                spice_command: max
                description: Peak drain-source voltage on Q1
            description: Q1 drain-source voltage stress
          - ref: VDS_Q2
            plot:
              x_axis: time
              title: Q2 Drain-Source Voltage
            quantity: voltage
            nets:
              - - Q2
                - drain
              - - Q2
                - source
            data:
              - name: vds_q2_max
                spice_command: max
                description: Peak drain-source voltage on Q2
            description: Q2 drain-source voltage stress
          - ref: ID_Q1
            plot:
              x_axis: time
              title: Q1 Drain Current
            component: Q1
            quantity: current
            data:
              - name: id_q1_max
                spice_command: max
                description: Peak drain current through Q1
            description: Q1 drain current stress
          - ref: ID_Q2
            plot:
              x_axis: time
              title: Q2 Drain Current
            component: Q2
            quantity: current
            data:
              - name: id_q2_max
                spice_command: max
                description: Peak drain current through Q2
            description: Q2 drain current stress
          - ref: VOUT
            plot: false
            quantity: voltage
            nets:
              - - R_LOAD
                - pos
              - - R_LOAD
                - neg
        outputs:
          - var: vds_q1_max_v
            formula: '[vds_q1_max]'
            description: Maximum Q1 drain-source voltage in volts
          - var: vds_q2_max_v
            formula: '[vds_q2_max]'
            description: Maximum Q2 drain-source voltage in volts
          - var: id_q1_max_a
            formula: '[id_q1_max]'
            description: Maximum Q1 drain current in amperes
          - var: id_q2_max_a
            formula: '[id_q2_max]'
            description: Maximum Q2 drain current in amperes
      - rid: tr_transformer_current
        requirement: Transformer primary and secondary current waveforms. Measure
          primary current (through Q1/Q2 drains) and secondary current (through D1/D2
          anodes). Verify balanced operation and no DC bias buildup in transformer.
        criteria:
          ipri_max_a: 5.0
          isec_max_a: 10.0
          dc_bias_max_a: 0.5
        environment:
          - ref: time_domain
            t_start: 0.01275
            t_stop: 0.015
            t_step: 1.0e-07
            description: 15ms simulation to verify transformer balance
        measurement:
          - ref: VIN
            plot: false
            quantity: voltage
            nets:
              - - VIN
                - +
              - - VIN
                - '-'
          - ref: IPRI
            plot:
              x_axis: time
              title: Transformer Primary Current
            component: T1.pri
            quantity: current
            data:
              - name: ipri_max
                spice_command: max
                description: Peak primary current
              - name: ipri_avg
                spice_command: avg
                description: Average primary current (DC bias check)
            description: Transformer primary winding current
          - ref: ISEC1
            plot:
              x_axis: time
              title: Transformer Secondary Current (D1 path)
            component: D1
            quantity: current
            data:
              - name: isec1_max
                spice_command: max
                description: Peak secondary current through D1
            description: Secondary current through D1 rectifier
          - ref: ISEC2
            plot:
              x_axis: time
              title: Transformer Secondary Current (D2 path)
            component: D2
            quantity: current
            data:
              - name: isec2_max
                spice_command: max
                description: Peak secondary current through D2
            description: Secondary current through D2 rectifier
          - ref: VOUT
            plot: false
            quantity: voltage
            nets:
              - - R_LOAD
                - pos
              - - R_LOAD
                - neg
        outputs:
          - var: ipri_max_a
            formula: '[ipri_max]'
            description: Maximum primary current in amperes
          - var: isec_max_a
            formula: max(abs([isec1_max]), abs([isec2_max]))
            description: Maximum secondary current in amperes
          - var: dc_bias_a
            formula: abs([ipri_avg])
            description: DC bias current in primary winding (amperes)
      - rid: tr_inductor_current
        requirement: Output inductor current ripple and average value. Measure current
          through L1 ([L1, pin1] to [L1, pin2]). Verify inductor operates in continuous
          conduction mode (CCM) with acceptable ripple.
        criteria:
          il_avg_a: 1.0
          il_ripple_max_a: 0.5
          il_min_a: 0.0
        environment:
          - ref: time_domain
            t_start: 0.01275
            t_stop: 0.015
            t_step: 1.0e-07
            description: 15ms simulation to measure inductor current
        measurement:
          - ref: VIN
            plot: false
            quantity: voltage
            nets:
              - - VIN
                - +
              - - VIN
                - '-'
          - ref: IL1
            plot:
              x_axis: time
              title: Output Inductor Current
            component: L1
            quantity: current
            data:
              - name: il_avg
                spice_command: avg
                description: Average inductor current
              - name: il_min
                spice_command: min
                description: Minimum inductor current (CCM check)
              - name: il_ripple_pp
                spice_command: pp
                description: Peak-to-peak inductor current ripple
            description: Output inductor L1 current
          - ref: VOUT
            plot: false
            quantity: voltage
            nets:
              - - R_LOAD
                - pos
              - - R_LOAD
                - neg
        outputs:
          - var: il_avg_a
            formula: '[il_avg]'
            description: Average inductor current in amperes
          - var: il_min_a
            formula: '[il_min]'
            description: Minimum inductor current in amperes
          - var: il_ripple_a
            formula: '[il_ripple_pp]'
            description: Inductor current ripple in amperes
      - rid: tr_diode_stress
        requirement: Secondary rectifier diode voltage and current stress. Measure
          peak reverse voltage across D1 and D2, and peak forward current through
          D1 and D2. Verify diodes operate within safe limits.
        criteria:
          vr_max_d1: 30.0
          vr_max_d2: 30.0
          if_max_d1: 5.0
          if_max_d2: 5.0
        environment:
          - ref: time_domain
            t_start: 0.01275
            t_stop: 0.015
            t_step: 1.0e-07
            description: 15ms simulation to capture diode stress
        measurement:
          - ref: VIN
            plot: false
            quantity: voltage
            nets:
              - - VIN
                - +
              - - VIN
                - '-'
          - ref: VR_D1
            plot:
              x_axis: time
              title: D1 Reverse Voltage
            quantity: voltage
            nets:
              - - D1
                - cathode
              - - D1
                - anode
            data:
              - name: vr_d1_max
                spice_command: max
                description: Peak reverse voltage across D1
            description: D1 reverse voltage stress
          - ref: VR_D2
            plot:
              x_axis: time
              title: D2 Reverse Voltage
            quantity: voltage
            nets:
              - - D2
                - cathode
              - - D2
                - anode
            data:
              - name: vr_d2_max
                spice_command: max
                description: Peak reverse voltage across D2
            description: D2 reverse voltage stress
          - ref: IF_D1
            plot:
              x_axis: time
              title: D1 Forward Current
            component: D1
            quantity: current
            data:
              - name: if_d1_max
                spice_command: max
                description: Peak forward current through D1
            description: D1 forward current stress
          - ref: IF_D2
            plot:
              x_axis: time
              title: D2 Forward Current
            component: D2
            quantity: current
            data:
              - name: if_d2_max
                spice_command: max
                description: Peak forward current through D2
            description: D2 forward current stress
          - ref: VOUT
            plot: false
            quantity: voltage
            nets:
              - - R_LOAD
                - pos
              - - R_LOAD
                - neg
        outputs:
          - var: vr_d1_max_v
            formula: '[vr_d1_max]'
            description: Maximum D1 reverse voltage in volts
          - var: vr_d2_max_v
            formula: '[vr_d2_max]'
            description: Maximum D2 reverse voltage in volts
          - var: if_d1_max_a
            formula: '[if_d1_max]'
            description: Maximum D1 forward current in amperes
          - var: if_d2_max_a
            formula: '[if_d2_max]'
            description: Maximum D2 forward current in amperes
      - rid: tr_efficiency
        requirement: Converter efficiency at nominal load. Measure input power (VIN
          * IIN) and output power (VOUT * IOUT). Calculate efficiency as Pout/Pin.
          Verify efficiency meets target.
        criteria:
          target_vout: 12.0
          efficiency_min_pct: 85.0
          pin_max_w: 20.0
          pout_min_w: 10.0
        environment:
          - ref: time_domain
            t_start: 0.01275
            t_stop: 0.015
            t_step: 1.0e-07
            description: 15ms simulation for efficiency calculation
        measurement:
          - ref: VIN_EFF
            plot: false
            quantity: voltage
            nets:
              - - VIN
                - +
              - - VIN
                - '-'
            data:
              - name: vin_avg
                spice_command: avg
                description: Average input voltage
            description: Input voltage for efficiency calculation
          - ref: IIN_EFF
            plot: false
            component: VIN
            quantity: current
            data:
              - name: iin_avg
                spice_command: avg
                description: Average input current
            description: Input current for efficiency calculation
          - ref: VOUT_EFF
            plot: false
            quantity: voltage
            nets:
              - - RLOAD
                - pos
              - - T1
                - CT_S
            data:
              - name: vout_avg_eff
                spice_command: avg
                description: Average output voltage
            description: Output voltage for efficiency calculation
          - ref: IOUT_EFF
            plot: false
            component: RLOAD
            quantity: current
            data:
              - name: iout_avg
                spice_command: avg
                description: Average output current
            description: Output current for efficiency calculation
        outputs:
          - var: pin_w
            formula: abs([vin_avg] * [iin_avg])
            description: Input power in watts
          - var: pout_w
            formula: abs([vout_avg_eff] * [iout_avg])
            description: Output power in watts
          - var: efficiency_pct
            formula: 100 * abs([vout_avg_eff] * [iout_avg]) / abs([vin_avg] * [iin_avg])
            description: Converter efficiency percentage
