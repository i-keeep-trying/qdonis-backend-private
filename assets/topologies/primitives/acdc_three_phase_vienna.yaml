analysis:
  transient:
    spice_settings:
      tstop: 0.06
      use_ic: true
      reltol: 0.01
      abstol: 1.0e-05
      vntol: 0.01
      cshunt: 2.0e-11
      chgtol: 1.0e-10
      itl4: 50
      method: gear
    requirements:
    - rid: tr_vienna_rectifier
      requirement: Verify Vienna Rectifier active current shaping and output voltage.
      measurement:
      - ref: VOUT_TOT
        plot:
          x_axis: time
          title: Total DC Link Voltage
        quantity: voltage
        component: R_LOAD
        nets:
        - - R_LOAD
          - pos
        - - R_LOAD
          - neg
        data:
        - name: Vout_avg
          spice_command: avg
          description: Average Output Voltage
      outputs:
      - var: vout_avg_v
        formula: abs([Vout_avg])
        description: Average Output Voltage
metadata:
  stage:
  - afe
  - rectifier
  topology: three_phase_vienna_rectifier
  control: continuous_pi_pwm
  tags:
  - vienna
  - pfc
  - sic
  - acdc
models:
- .model D_SiC D(Is=1e-12 Rs=0.01 N=1.2 Cjo=150p tt=5n)
- .model sw_mod SW(Ron=0.02 Roff=1Meg Vt=5 Vh=1)
