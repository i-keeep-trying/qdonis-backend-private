analysis:
  transient:
    spice_settings:
      tstop: 0.01
      use_ic: false
      reltol: 0.01
      abstol: 1.0e-06
      vntol: 0.0001
      gmin: 1.0e-12
      method: gear
      maxord: 2
    requirements:
    - rid: tr_reg
      requirement: Output voltage regulation at 1.2V; verify interleaved ripple cancellation
        achieves < 5mV ripple
      criteria:
        target_vout: 1.2
        regulation_limit_pct: 3
        ripple_limit_vpp: 5e-3
      measurement:
      - ref: VIN
        plot:
          x_axis: time
          title: Input Voltage (tr_reg)
        quantity: voltage
        nets:
        - - VIN
          - +
        - - VIN
          - '-'
      - ref: VOUT
        plot:
          x_axis: time
          title: Output Voltage VRM
        component: R_LOAD
        quantity: voltage
        nets:
        - - R_LOAD
          - pos
        - - VIN
          - '-'
        data:
        - name: Vout_avg
          spice_command: avg
          description: Average output voltage
        - name: Vout_ripple_vpp
          spice_command: pp
          description: Peak-to-peak output ripple (should be cancelled by interleaving)
      - ref: IOUT
        plot: false
        component: R_LOAD
        quantity: current
        data:
        - name: Iout_avg
          spice_command: avg
          description: Average load current
      outputs:
      - var: load_regulation_pct
        formula: 100*abs([Vout_avg] - {criteria.target_vout})/{criteria.target_vout}
        description: Load regulation deviation from target
      - var: vout_avg_v
        formula: '[Vout_avg]'
        description: Average output voltage
      - var: vout_ripple_vpp_v
        formula: '[Vout_ripple_vpp]'
        description: Output voltage peak-to-peak ripple
    - rid: tr_balance
      requirement: Current sharing balance between the four phases; verify IL1_avg
        = IL2_avg = IL3_avg = IL4_avg = Iout/4
      criteria:
        current_balance_pct: 10
      measurement:
      - ref: VIN
        plot: false
        quantity: voltage
        nets:
        - - VIN
          - +
        - - VIN
          - '-'
      - ref: IL1
        plot:
          x_axis: time
          title: Phase 1 Inductor Current
        component: L1
        quantity: current
        data:
        - name: IL1_avg
          spice_command: avg
          description: Average phase 1 inductor current
        - name: IL1_ripple
          spice_command: pp
          description: Phase 1 individual ripple (before cancellation)
      - ref: IL2
        plot:
          x_axis: time
          title: Phase 2 Inductor Current
        component: L2
        quantity: current
        data:
        - name: IL2_avg
          spice_command: avg
          description: Average phase 2 inductor current
        - name: IL2_ripple
          spice_command: pp
          description: Phase 2 individual ripple (before cancellation)
      - ref: IL3
        plot:
          x_axis: time
          title: Phase 3 Inductor Current
        component: L3
        quantity: current
        data:
        - name: IL3_avg
          spice_command: avg
          description: Average phase 3 inductor current
        - name: IL3_ripple
          spice_command: pp
          description: Phase 3 individual ripple (before cancellation)
      - ref: IL4
        plot:
          x_axis: time
          title: Phase 4 Inductor Current
        component: L4
        quantity: current
        data:
        - name: IL4_avg
          spice_command: avg
          description: Average phase 4 inductor current
        - name: IL4_ripple
          spice_command: pp
          description: Phase 4 individual ripple (before cancellation)
      - ref: IOUT_B
        plot: false
        component: R_LOAD
        quantity: current
        data:
        - name: Iout_avg
          spice_command: avg
          description: Total average load current
      - ref: VOUT
        plot: false
        quantity: voltage
        nets:
        - - R_LOAD
          - pos
        - - R_LOAD
          - neg
      outputs:
      - var: il1_avg_a
        formula: '[IL1_avg]'
        description: Phase 1 average current
      - var: il2_avg_a
        formula: '[IL2_avg]'
        description: Phase 2 average current
      - var: il3_avg_a
        formula: '[IL3_avg]'
        description: Phase 3 average current
      - var: il4_avg_a
        formula: '[IL4_avg]'
        description: Phase 4 average current
      - var: current_balance_pct
        formula: 100*(max([IL1_avg], [IL2_avg], [IL3_avg], [IL4_avg]) - min([IL1_avg],
          [IL2_avg], [IL3_avg], [IL4_avg]))/([Iout_avg]/4)
        description: Current sharing imbalance percentage (max - min vs. ideal per-phase
          current)
    - rid: tr_eff
      requirement: Efficiency and per-phase loss breakdown
      criteria:
        efficiency_target_pct: 90
      measurement:
      - ref: IIN
        plot: false
        component: VIN
        quantity: current
        data:
        - name: Iin_avg
          spice_command: avg
          description: Average input current
      - ref: IOUT_EFF
        plot: false
        component: R_LOAD
        quantity: current
        data:
        - name: Iout_avg
          spice_command: avg
          description: Average load current
      - ref: VOUT_EFF
        plot: false
        component: R_LOAD
        quantity: voltage
        nets:
        - - R_LOAD
          - pos
        - - VIN
          - '-'
        data:
        - name: Vout_avg
          spice_command: avg
          description: Average output voltage
      - ref: VIN_EFF
        plot: false
        component: VIN
        quantity: voltage
        nets:
        - - VIN
          - +
        - - VIN
          - '-'
        data:
        - name: Vin_avg
          spice_command: avg
          description: Average input voltage
      - ref: IL1_EFF
        plot: false
        component: L1
        quantity: current
        data:
        - name: IL1_rms
          spice_command: rms
          description: RMS phase 1 inductor current
      - ref: IL2_EFF
        plot: false
        component: L2
        quantity: current
        data:
        - name: IL2_rms
          spice_command: rms
          description: RMS phase 2 inductor current
      - ref: IL3_EFF
        plot: false
        component: L3
        quantity: current
        data:
        - name: IL3_rms
          spice_command: rms
          description: RMS phase 3 inductor current
      - ref: IL4_EFF
        plot: false
        component: L4
        quantity: current
        data:
        - name: IL4_rms
          spice_command: rms
          description: RMS phase 4 inductor current
      outputs:
      - var: Pin_avg
        formula: abs([Vin_avg]*[Iin_avg])
        description: Average input power
      - var: Pout_avg
        formula: '[Vout_avg]*[Iout_avg]'
        description: Average output power
      - var: P_L1_cu
        formula: '[IL1_rms]**2*{components.L1.series_resistance}'
        description: Phase 1 inductor copper loss
      - var: P_L2_cu
        formula: '[IL2_rms]**2*{components.L2.series_resistance}'
        description: Phase 2 inductor copper loss
      - var: P_L3_cu
        formula: '[IL3_rms]**2*{components.L3.series_resistance}'
        description: Phase 3 inductor copper loss
      - var: P_L4_cu
        formula: '[IL4_rms]**2*{components.L4.series_resistance}'
        description: Phase 4 inductor copper loss
      - var: efficiency_pct
        formula: 100*[Pout_avg]/[Pin_avg]
        description: Efficiency percentage
