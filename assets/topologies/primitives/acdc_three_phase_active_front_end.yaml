    resistance: 2
- ref: R_DAMP_B
  type: resistor
  params:
    resistance: 2
- ref: R_DAMP_C
  type: resistor
  params:
    resistance: 2
- ref: LA
  type: inductor
  params:
    inductance: 5m
- ref: LB
  type: inductor
  params:
    inductance: 5m
- ref: LC
  type: inductor
  params:
    inductance: 5m
- ref: E1
  type: e_source
  params:
    gain: 1
- ref: R6
  type: resistor
  params:
    resistance: 10
- ref: M_A_TOP
  type: transistor
  params:
    family: mosfet
    type: nmos
    mode: enhancement
    model: sic_mosfet
    part_number: C3M0015065D
    rds_on: 0.015
    tr: 1.0e-08
- ref: D1
  type: diode
  params:
    model: dmodel1
    Bv: 1200
    Rs: 0.001
    Tt: 1.0e-08
    Cjo: 5.0e-11
- ref: R9
  type: resistor
  params:
    resistance: 10
- ref: M_A_BOT
  type: transistor
  params:
    family: mosfet
    type: nmos
