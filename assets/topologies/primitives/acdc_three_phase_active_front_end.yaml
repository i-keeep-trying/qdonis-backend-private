id: acdc_three_phase_active_front_end
name: Three Phase Active Front End Rectifier
description: 3-Phase active boost rectifier with a full analog SPWM and PI control
  loop.
components:
- ref: V_A
  type: node
  role: voltage_source
  params:
    node_type: voltage_source
    source: sine
    amplitude: 310.27
    frequency: 50
    phase: 0
- ref: V_B
  type: node
  role: voltage_source
  params:
    node_type: voltage_source
    source: sine
    amplitude: 310.27
    frequency: 50
    phase: -120
- ref: V_C
  type: node
  role: voltage_source
