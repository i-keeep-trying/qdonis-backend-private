analysis:
  transient:
    spice_settings:
      tstop: 0.01
      use_ic: true
      # abstol / vntol at the defaults (1e-9 / 1e-5): the looser 1e-6 / 1e-4 written here earlier were applied from
      # 2026-10-11 and moved the results away from a tight-tolerance reference (median error 5.4 % -> 9.4 %).
      reltol: 0.01
      gmin: 1.0e-12
      method: gear
      maxord: 2
    requirements:
      - rid: tr_reg
        requirement: Output voltage regulation at 400V; verify unity-gain operation
          at resonant frequency
        criteria:
          target_vout: 400.0
          regulation_limit_pct: 5
          ripple_limit_vpp: 4.0
        measurement:
          - ref: VIN
            plot:
              x_axis: time
              title: Input Voltage (tr_reg)
            quantity: voltage
            nets:
              - - VIN
                - +
              - - VIN
                - '-'
          - ref: VOUT
            plot:
              x_axis: time
              title: Output Voltage CLLC
            component: R_LOAD
            quantity: voltage
            nets:
              - - R_LOAD
                - pos
              - - Cout
                - neg
            data:
              - name: Vout_avg
                spice_command: avg
                description: Average output voltage
              - name: Vout_ripple_vpp
                spice_command: pp
                description: Peak-to-peak output ripple
          - ref: IOUT
            plot: false
            component: R_LOAD
            quantity: current
            data:
              - name: Iout_avg
                spice_command: avg
                description: Average load current
        outputs:
          - var: load_regulation_pct
            formula: 100*abs([Vout_avg] - {criteria.target_vout})/{criteria.target_vout}
            description: Load regulation deviation from target
          - var: vout_avg_v
            formula: '[Vout_avg]'
            description: Average output voltage
      - rid: tr_resonant
        requirement: Primary and secondary resonant tank verification; Lr current
          should be sinusoidal at operating frequency; Ls current validates asymmetric
          secondary power path and bidirectional capability
        criteria:
          resonant_freq_hz: 100e3
        measurement:
          - ref: VIN
            plot: false
            quantity: voltage
            nets:
              - - VIN
                - +
              - - VIN
                - '-'
          - ref: ILR
            plot:
              x_axis: time
              title: Primary Resonant Inductor Current (should be sinusoidal)
            component: Lr
            quantity: current
            data:
              - name: ILr_peak
                spice_command: max
                description: Peak primary resonant tank current
              - name: ILr_rms
                spice_command: rms
                description: RMS primary resonant tank current
          - ref: VCR_P
            plot:
              x_axis: time
              title: Primary Resonant Capacitor Voltage
            component: Cr_P
            quantity: voltage
            nets:
              - - Cr_P
                - pos
              - - Cr_P
                - neg
            data:
              - name: Vcr_p_peak
                spice_command: max
                description: Peak primary resonant capacitor voltage
          - ref: ILS
            plot:
              x_axis: time
              title: Secondary Resonant Inductor Current (asymmetric path)
            component: Ls
            quantity: current
            data:
              - name: ILs_peak
                spice_command: max
                description: Peak secondary resonant inductor current
              - name: ILs_rms
                spice_command: rms
                description: RMS secondary resonant inductor current
          - ref: VCR_S
            plot:
              x_axis: time
              title: Secondary Resonant Capacitor Voltage
            component: Cr_S
            quantity: voltage
            nets:
              - - Cr_S
                - pos
              - - Cr_S
                - neg
            data:
              - name: Vcr_s_peak
                spice_command: max
                description: Peak secondary resonant capacitor voltage
              - name: Vcr_s_min
                spice_command: min
                description: Minimum secondary resonant capacitor voltage
          - ref: VOUT
            plot: false
            quantity: voltage
            nets:
              - - R_LOAD
                - pos
              - - R_LOAD
                - neg
        outputs:
          - var: ilr_peak_a
            formula: '[ILr_peak]'
            description: Peak primary resonant inductor current in amperes
          - var: ilr_rms_a
            formula: '[ILr_rms]'
            description: RMS primary resonant inductor current in amperes
          - var: vcr_p_peak_v
            formula: '[Vcr_p_peak]'
            description: Peak primary resonant capacitor voltage
          - var: ils_peak_a
            formula: '[ILs_peak]'
            description: Peak secondary resonant inductor current (indicates right-bridge
              power)
          - var: ils_rms_a
            formula: '[ILs_rms]'
            description: RMS secondary resonant inductor current
          - var: vcr_s_peak_v
            formula: '[Vcr_s_peak]'
            description: Peak secondary resonant capacitor voltage
          - var: vcr_s_swing_v
            formula: '[Vcr_s_peak] - [Vcr_s_min]'
            description: Secondary resonant capacitor voltage swing (asymmetric tank
              stress indicator)
      - rid: tr_eff
        requirement: Efficiency at unity-gain operating point; ZVS/ZCS expected at
          resonant frequency
        criteria:
          efficiency_target_pct: 95
        measurement:
          - ref: IIN
            plot: false
            component: VIN
            quantity: current
            data:
              - name: Iin_avg
                spice_command: avg
                description: Average input current
          - ref: IOUT_EFF
            plot: false
            component: R_LOAD
            quantity: current
            data:
              - name: Iout_avg
                spice_command: avg
                description: Average load current
          - ref: VOUT_EFF
            plot: false
            component: R_LOAD
            quantity: voltage
            nets:
              - - R_LOAD
                - pos
              - - Cout
                - neg
            data:
              - name: Vout_avg
                spice_command: avg
                description: Average output voltage
          - ref: VIN_EFF
            plot: false
            component: VIN
            quantity: voltage
            nets:
              - - VIN
                - +
              - - VIN
                - '-'
            data:
              - name: Vin_avg
                spice_command: avg
                description: Average input voltage
        outputs:
          - var: Pin_avg
            formula: abs([Vin_avg]*[Iin_avg])
            description: Average input power
          - var: Pout_avg
            formula: '[Vout_avg]*[Iout_avg]'
            description: Average output power
          - var: efficiency_pct
            formula: 100*[Pout_avg]/[Pin_avg]
            description: Efficiency percentage
