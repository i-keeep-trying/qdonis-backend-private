    voltage_rating: 100
    current_rating: 10
    Vto: 1.5
    Kn: 200e-3
    Lambda: 0.01
    Cgs: 1500e-12
    Cgd: 300e-12
    Cdb: 300e-12
  layout:
    schX: -2.0
    schY: -3.0
    rotation: 270deg
- ref: SW3
  type: transistor
  role: ph2_hs
  params:
    family: mosfet
