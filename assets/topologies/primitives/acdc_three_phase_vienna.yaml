id: acdc_three_phase_vienna
name: Three-Phase Vienna Rectifier
description: Three-phase Vienna rectifier with fully corrected and filtered control
  loop
components:
- ref: GND
  type: node
  params:
    node_type: ground
- ref: V_AC_A
  type: node
  role: voltage_source
  params:
    node_type: voltage_source
    source: sine
    amplitude: 170.0
    frequency: 50
    phase: 0
- ref: V_AC_B
  type: node
  role: voltage_source
  params:
    node_type: voltage_source
    source: sine
    amplitude: 170.0
    frequency: 50
    phase: -120
- ref: V_AC_C
  type: node
  role: voltage_source
  params:
    node_type: voltage_source
    source: sine
    amplitude: 170.0
    frequency: 50
    phase: -240
- ref: R_neutral
  type: resistor
  params:
    resistance: 10000000.0
- ref: R_grid_A
  type: resistor
  params:
    resistance: 0.05
- ref: R_grid_B
  type: resistor
  params:
    resistance: 0.05
- ref: R_grid_C
  type: resistor
  params:
    resistance: 0.05
- ref: V_SENSE_A
  type: node
  params:
    node_type: voltage_source
    source: dc
    voltage: 0
- ref: V_SENSE_B
  type: node
  params:
    node_type: voltage_source
    source: dc
    voltage: 0
- ref: V_SENSE_C
  type: node
  params:
    node_type: voltage_source
    source: dc
    voltage: 0
- ref: L_A
  type: inductor
  params:
    inductance: 0.00047
- ref: L_B
  type: inductor
  params:
    inductance: 0.00047
- ref: L_C
  type: inductor
  params:
    inductance: 0.00047
- ref: C_DC_TOP
  type: capacitor
  params:
    capacitance: 0.0022
    ic: 400
- ref: C_DC_BOT
  type: capacitor
  params:
    capacitance: 0.0022
    ic: -400
- ref: R_LOAD
  type: resistor
  params:
    resistance: 42.66
- ref: D_A_TOP
  type: diode
  params:
    model: D_SiC
- ref: D_A_BOT
  type: diode
  params:
    model: D_SiC
- ref: D_B_TOP
  type: diode
  params:
    model: D_SiC
- ref: D_B_BOT
  type: diode
  params:
    model: D_SiC
- ref: D_C_TOP
  type: diode
  params:
    model: D_SiC
- ref: D_C_BOT
  type: diode
  params:
    model: D_SiC
- ref: S_A
  type: switch
  params:
    model: sw_mod
- ref: S_B
  type: switch
  params:
    model: sw_mod
- ref: S_C
  type: switch
  params:
    model: sw_mod
- ref: B_VA_grid
  type: b_source
  params:
    expression: V(n_A_raw) - V(n_neutral)
- ref: B_VB_grid
  type: b_source
  params:
    expression: V(n_B_raw) - V(n_neutral)
- ref: B_VC_grid
  type: b_source
  params:
    expression: V(n_C_raw) - V(n_neutral)
- ref: B_Iact_A_raw
  type: b_source
  params:
    expression: abs(I(V_SENSE_A))
- ref: R_fA
  type: resistor
  params:
    resistance: 10000.0
- ref: C_fA
  type: capacitor
  params:
    capacitance: 1.0e-07
- ref: B_Iact_B_raw
  type: b_source
  params:
    expression: abs(I(V_SENSE_B))
- ref: R_fB
  type: resistor
  params:
    resistance: 10000.0
- ref: C_fB
  type: capacitor
  params:
    capacitance: 1.0e-07
- ref: B_Iact_C_raw
  type: b_source
  params:
    expression: abs(I(V_SENSE_C))
- ref: R_fC
  type: resistor
  params:
    resistance: 10000.0
- ref: C_fC
  type: capacitor
  params:
    capacitance: 1.0e-07
- ref: B_VDC_TOTAL
  type: b_source
  params:
    expression: V(n_DC_POS) - V(n_DC_NEG)
- ref: B_VERR
  type: b_source
  params:
    expression: 800 - V(v_dc_tot)
- ref: B_VP
  type: b_source
  params:
    expression: V(v_err) * 0.1
- ref: G_VINT
  type: custom_spice
  params:
    spice_line: G_VINT 0 v_int v_err 0 0.05
- ref: C_VINT
  type: capacitor
  params:
    capacitance: 1
- ref: R_VINT
  type: resistor
  params:
    resistance: 100000000.0
- ref: B_IMAG
  type: b_source
  params:
    expression: max(0, min(50, V(v_p) + V(v_int)))
- ref: B_Iref_A
  type: b_source
  params:
    expression: V(i_mag) * abs(V(v_a_grid)) / 170.0
- ref: B_Iref_B
  type: b_source
  params:
    expression: V(i_mag) * abs(V(v_b_grid)) / 170.0
- ref: B_Iref_C
  type: b_source
  params:
    expression: V(i_mag) * abs(V(v_c_grid)) / 170.0
- ref: B_Duty_A
  type: b_source
  params:
    expression: 1 - (abs(V(v_a_grid))/400) + 0.01*(V(i_ref_A) - V(i_act_A))
- ref: B_Duty_B
  type: b_source
  params:
    expression: 1 - (abs(V(v_b_grid))/400) + 0.01*(V(i_ref_B) - V(i_act_B))
- ref: B_Duty_C
  type: b_source
  params:
    expression: 1 - (abs(V(v_c_grid))/400) + 0.01*(V(i_ref_C) - V(i_act_C))
- ref: B_Clamp_A
  type: b_source
  params:
    expression: max(0.02, min(0.98, V(n_duty_A)))
- ref: B_Clamp_B
  type: b_source
  params:
    expression: max(0.02, min(0.98, V(n_duty_B)))
- ref: B_Clamp_C
  type: b_source
  params:
    expression: max(0.02, min(0.98, V(n_duty_C)))
- ref: V_TRI
  type: custom_spice
  params:
    spice_line: V_TRI n_tri 0 PULSE(0 1 0 25u 25u 0 50u)
- ref: B_PWM_A
  type: b_source
  params:
    expression: 10 * (1 + tanh((V(n_d_A) - V(n_tri))*1000))
- ref: B_PWM_B
  type: b_source
  params:
    expression: 10 * (1 + tanh((V(n_d_B) - V(n_tri))*1000))
- ref: B_PWM_C
  type: b_source
  params:
    expression: 10 * (1 + tanh((V(n_d_C) - V(n_tri))*1000))
