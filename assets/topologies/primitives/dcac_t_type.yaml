id: dcac_t_type
name: Three-Phase 3-Level T-Type Inverter (Closed-Loop Current Controlled)
description: Three-phase three-level T-type inverter with closed-loop AC current regulation
  via Phase Disposition (PD) PWM and continuous-time feedforward + proportional error
  control. Converts an 800V split-rail DC link (midpoint N008 at +400V) into
  three-phase sinusoidal AC currents regulated to 20A peak at 160Hz into a star-connected
  inductive load (10mH + 1 Ohm, about 202V peak per phase). Each phase leg uses 4 SiC MOSFETs
  (M_S1..M_S4) where M_S1 and M_S4 switch the outer DC rails and bidirectional center switches
  M_S2 and M_S3 clamp to the midpoint N008 with 16kHz carrier modulation.
models:
- .model C3M0065090D VDMOS(Ron=0.065 Vto=2.6 Kp=15 Cgdmax=12p Cgdmin=1p Cgs=400p Bv=1200)
