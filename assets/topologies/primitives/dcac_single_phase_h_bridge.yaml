# Gate capacitance of the ideal switches (2026-10-22): the S elements have none, so the gate node stepped
# instantly and ngspice aborted ("timestep too small" on the floating gate source) for sized designs
# (380 V -> 120 V, 400 V -> 230 V at 5 kW); 1 nF (tau = 1 us with the 1 kOhm drive) lets the run finish.
- ref: CG1
  type: capacitor
  role: gate_capacitance
  params:
    capacitance: 1n
- ref: CG2
  type: capacitor
  role: gate_capacitance
  params:
    capacitance: 1n
- ref: CG3
  type: capacitor
  role: gate_capacitance
  params:
    capacitance: 1n
- ref: CG4
  type: capacitor
  role: gate_capacitance
  params:
    capacitance: 1n
