  groups:
    current_loop: {label: "Current loop", members: [POL_SIGN, VAC_NORM, IREF, I_SENSE, LPF_I, SUM_I]}
    modulator: {label: "Modulator", members: [FF_D, KP_I, SUM_D, LIM_D, V_tri, CMP]}
    voltage_loop: {label: "Voltage loop", members: [REF_V, SUM_V, KP_V, INT_V, SUM_PI, LIM_PI]}
    gate_logic: {label: "Gate logic", members: [POL, DRV_LF_BOT, DRV_HF_BOT, E_g_LF_TOP, E_g_HF_TOP]}
  sheets:
    current_loop:
      wires:
      - {id: W1, from: VAC_NORM.in1, to: "^current_loop:n_AC_L.P"}
      - {id: W2, from: POL_SIGN.inp, to: "^current_loop:n_AC_L.P"}
      - {id: W3, from: VAC_NORM.in2, to: "^current_loop:n_AC_N.P"}
