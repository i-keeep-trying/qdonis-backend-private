  - ref: R8
    type: resistor
    role: gate_pulldown_b_low
    params:
      resistance: 50k
  - ref: E5
    type: e_source
    role: gate_driver_c_high
    params:
      gain: 100
  - ref: R9
    type: resistor
    role: gate_resistor_c_high
    params:
      resistance: 1k
  - ref: R10
    type: resistor
    role: gate_pulldown_c_high
    params:
      resistance: 50k
  - ref: E6
    type: e_source
    role: gate_driver_c_low
    params:
      gain: 100
  - ref: R11
    type: resistor
    role: gate_resistor_c_low
    params:
      resistance: 1k
  - ref: R12
    type: resistor
    role: gate_pulldown_c_low
    params:
      resistance: 50k
  - ref: V5
    type: node
    role: dc_link_voltage
    params:
      node_type: voltage_source
      source: dc
      voltage: 380
  - ref: R13
    type: resistor
    role: dc_link_filter_res1
    params:
      resistance: 10
  - ref: C1
    type: capacitor
    role: dc_link_filter_cap1
    params:
      capacitance: 10u
  - ref: R14
    type: resistor
    role: dc_link_filter_res2
    params:
      resistance: 10
  - ref: C2
    type: capacitor
    role: dc_link_filter_cap2
    params:
      capacitance: 10u
  - ref: M1
    type: transistor
    role: mosfet_a_high
    params:
      family: mosfet
      type: nmos
      model: FDH210N08
      Bv: 500
  - ref: M2
    type: transistor
    role: mosfet_a_low
    params:
      family: mosfet
      type: nmos
      model: FDH210N08
      Bv: 500
  - ref: M3
    type: transistor
    role: mosfet_b_high
    params:
      family: mosfet
      type: nmos
      model: FDH210N08
      Bv: 500
  - ref: M4
    type: transistor
    role: mosfet_b_low
    params:
      family: mosfet
      type: nmos
      model: FDH210N08
      Bv: 500
  - ref: M5
    type: transistor
    role: mosfet_c_high
    params:
      family: mosfet
      type: nmos
      model: FDH210N08
      Bv: 500
  - ref: M6
    type: transistor
    role: mosfet_c_low
    params:
      family: mosfet
      type: nmos
      model: FDH210N08
      Bv: 500
  - ref: L1
    type: inductor
    role: load_inductor_a
    params:
      inductance: 10m
  - ref: L2
    type: inductor
    role: load_inductor_b
    params:
      inductance: 10m
  - ref: L3
    type: inductor
    role: load_inductor_c
    params:
      inductance: 10m
  - ref: R15
    type: resistor
    role: load_resistor_a
    params:
      resistance: 10
  - ref: R16
    type: resistor
    role: load_resistor_b
    params:
      resistance: 10
  - ref: R17
    type: resistor
    role: load_resistor_c
    params:
      resistance: 10
